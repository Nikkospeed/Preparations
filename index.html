er hvor alvorlig skaden kan bli (S1 lett, S2 alvorlig). F er hvor ofte og hvor lenge man er utsatt for faren. P er om det er mulig å unngå eller begrense skaden. Høy alvorlighet, hyppig eksponering og liten mulighet for å unngå gir PLe. Kategori, MTTFd og DC brukes senere for å vise at løsningen oppnår PLr.", "243": "Kategori 3 krever at en enkelt feil ikke fører til tap av sikkerhetsfunksjonen, som i praksis betyr redundans med to kanaler. Feil skal oppdages når det er rimelig mulig, men en opphopning av uoppdagede feil kan føre til tap av funksjonen. Kategori 4 går lenger og krever at feil oppdages før neste krav og at opphopning av feil tåles. Bare velprøvde komponenter er kravet i kategori 1.", "244": "Med to uavhengige kanaler, for eksempel to kontakter i en nødstopp og to kontaktorer i serie, vil én feil som en sveiset kontakt ikke hindre at maskinen stopper. Den andre kanalen bryter fortsatt. Sikkerhetsreleet sammenligner kanalene og oppdager kryssfeil og at en kanal henger, slik at reset blir sperret. Dette er grunnlaget for kategori 3 og 4.", "245": "Tvangsbrytende kontakter er mekanisk koblet slik at aktuatoren direkte river kontakten opp, uten å være avhengig av en fjær. Selv om kontaktene har sveiset seg sammen, vil bevegelsen bryte dem. Det gjør funksjonen pålitelig på dørbrytere og nødstopp. Symbolet er en pil i en sirkel. Det handler om sikkerhet, ikke pris eller respons.", "246": "Lysgardinen må stå så langt fra faren at maskinen rekker å stoppe før en hånd eller kropp når fram. Etter ISO 13855 beregnes avstanden med S = K · T + C, der K er tilnærmingshastigheten (for eksempel 2000 mm/s for hånd), T er total stopptid for gardin, styring og maskin, og C er et tillegg som avhenger av oppløsningen. Lang stopptid gir stor avstand, så stopptiden bør måles.", "247": "Muting betyr at lysgardinens sikkerhetsfunksjon kobles midlertidig og automatisk ut mens materiale, for eksempel en pall på en transportør, passerer. Egne mutingsensorer gjenkjenner materialet ut fra rekkefølge og tid, slik at en person ikke skal kunne utløse muting. Når materialet har passert, er gardinen aktiv igjen. Muting skal vises, gjerne med en lampe.", "248": "Med tohåndsbetjening må operatøren holde inne to knapper som er plassert slik at begge hendene er opptatt og langt fra fareområdet, for eksempel ved en presse. Knappene må aktiveres nesten samtidig, og slippes én av dem, stopper bevegelsen. Det hindrer at man kan holde én knapp inne med noe annet. Tohåndsbetjening beskytter bare den som betjener, ikke andre i nærheten.", "249": "ISO 12100 har en fast rekkefølge for risikoreduksjon. Først fjernes eller reduseres faren gjennom konstruksjonen, for eksempel lavere kraft eller ingen klemsteder. Deretter brukes tekniske vern og sikkerhetsfunksjoner som skjermer, dørbrytere og lysgardiner. Til slutt gis informasjon til brukeren, som advarsler, skilt og bruksanvisning. Opplæring og skilt skal aldri erstatte et vern som er mulig å lage.", "250": "Etter maskinforskriften må produsenten gjennomføre en risikovurdering og vise at maskinen oppfyller de grunnleggende helse‑ og sikkerhetskravene. Det dokumenteres i en teknisk dossier, og det lages en EU‑samsvarserklæring før CE‑merket settes på. Harmoniserte standarder som NEK EN 60204‑1 og EN ISO 13849‑1 brukes for å vise samsvar. En isolasjonsmåling eller en FAT alene er bare deler av dette.", "251": "Validering betyr å bekrefte og dokumentere at hver sikkerhetsfunksjon gjør det den er spesifisert til, og når påkrevd PL. Det innebærer både analyse og praktiske tester, for eksempel at nødstopp gir riktig stopp, at døråpning stopper maskinen og at man ikke kan starte etter reset. Man tester også feilsituasjoner som brudd på én kanal. Resultatene skal dokumenteres.", "252": "Nødstopp skal virke i alle driftsmoduser, enten maskinen er i automatisk, manuell, oppsett eller service. Den skal ha prioritet over alle andre funksjoner og ikke kunne sperres av programmet. En nødsituasjon kan oppstå når som helst, og ofte nettopp i manuell drift når noen er nær maskinen. Derfor kobles nødstoppen gjerne direkte i sikkerhetskretsen og ikke via standard PLS‑logikk.", "253": "En sikkerhets‑PLS er sertifisert for sikkerhetsfunksjoner, typisk opp til PLe eller SIL 3. Den har intern redundans, for eksempel to prosessorer som sammenligner resultatene, og kontinuerlig diagnose av innganger og utganger. Sikkerhetsprogrammet holdes adskilt fra standardprogrammet og beskyttes med signatur eller passord. Sikker I/O kan ofte gå over nettverk med sikker protokoll som PROFIsafe.", "254": "Ved lockout/tagout låser hver person som skal jobbe på anlegget, energikilden med sin egen hengelås og merker den med navn. Bare den som satte låsen har nøkkelen, så ingen andre kan slå på mens du jobber. Er flere på jobb, brukes en låsesaks med plass til mange låser. Etter låsing skal man alltid kontrollere at anlegget faktisk er spenningsløst og trykkløst.", "255": "Ventilbetegnelsen angir først antall porter og deretter antall stillinger. En 5/2‑ventil har fem tilkoblinger: trykk (1), to arbeidsporter (2 og 4) og to avluftinger (3 og 5), og to koblingsstillinger. Den er standard for å styre dobbeltvirkende sylindere ut og inn. En 3/2‑ventil har tre porter og to stillinger.", "256": "En enkeltvirkende sylinder har bare én lufttilkobling, og fjæren fører stempelet tilbake. Ventilen trenger da en trykkport inn (1), en arbeidsport mot sylinderen (2) og en avlufting (3), og to stillinger: trykk på eller avluft. Det er nøyaktig en 3/2‑ventil. En 5/2‑ventil har to arbeidsporter og brukes til dobbeltvirkende sylindere.", "257": "I lukket midtstilling er alle arbeidsportene sperret, så luften stenges inne på begge sider av stempelet. Sylinderen stopper derfor omtrent der den er. Fordi luft kan komprimeres, kan stempelet likevel flytte seg litt under last, og lekkasjer gjør at posisjonen siger over tid. Andre varianter er avluftet midtstilling, der sylinderen blir trykkløs, og trykksatt midtstilling.", "258": "En bistabil ventil, ofte kalt impulsventil, har en spole på hver side og ingen fjær. Et kort signal flytter ventilen, og den blir stående i den stillingen til den får signal på motsatt spole. Det gir en minnefunksjon, så sylinderen blir stående i posisjon også ved spenningsbortfall. En monostabil ventil har fjærretur og går tilbake når signalet forsvinner.", "259": "Vanligvis strupes avluften fra sylinderen med en strupetilbakeslagsventil. Da får stempelet fullt trykk på den ene siden og et mottrykk på den andre, slik at det klemmes mellom to luftputer og går jevnt. Struper man tilluften, får man ofte rykkvis bevegelse (stick‑slip) fordi trykket må bygges opp før stempelet løsner. Tilbakeslagsventilen gjør at luften strømmer fritt den andre veien.", "260": "Kraften er trykk ganger areal: F = p · A. Gjør om til SI‑enheter: 6 bar = 600 000 Pa og 10 cm² = 0,001 m². Da blir F = 600 000 · 0,001 = 600 N. En enkel huskeregel er at 1 bar på 1 cm² gir 10 N, så 6 · 10 · 10 = 600 N. I praksis blir kraften litt lavere på grunn av friksjon.", "261": "1 bar er definert som 100 000 Pa. Siden 1 kPa er 1000 Pa, blir det 100 000 / 1000 = 100 kPa. Tilsvarende er 1 bar = 0,1 MPa. Huskeregel: 6 bar arbeidstrykk i trykkluftnettet er 600 kPa. Mange transmittere og datablad oppgir trykket i kPa eller MPa.", "262": "Sylindere for sensorer har en magnetring i stempelet. En reed‑bryter eller en elektronisk magnetfeltsensor festes i sporet utenpå sylinderrøret og reagerer når magneten passerer. Røret er av aluminium eller annet umagnetisk materiale, slik at magnetfeltet går gjennom. En induktiv giver kan ikke se stempelet gjennom røret, den reagerer bare på metall rett foran seg.", "263": "Luft inneholder fuktighet som kondenserer til vann når den komprimeres og kjøles ned. Vannet gir rust i rør og sylindere, vasker bort smøring, kan fryse i utendørs ledninger og gjør at ventiler kiler seg. Derfor brukes kjøle‑ eller adsorpsjonstørker etter kompressoren, og vannutskillere og filtre ved forbrukerne. Tørking påvirker ikke trykket.", "264": "En vakuumejektor bruker venturiprinsippet: trykkluft blåses med høy hastighet gjennom en dyse, og det gir undertrykk i et sidehull. Der kobles sugekoppen til. Ejektoren har ingen bevegelige deler og gir vakuum raskt, men bruker en del luft. Den er vanlig i robotgripere og pakkemaskiner for håndtering av plater, esker og lignende.", "265": "Selv om maskinen er stoppet, kan det være trykkluft igjen i slanger, sylindere og akkumulatorer. Kobler du løs en slange, kan sylindere bevege seg uventet eller slangen kan slå. Derfor skal tilførselen stenges med en låsbar ventil, og systemet trykkavlastes før arbeid, gjerne som del av lockout. Kontroller deretter på manometeret at trykket er borte.", "266": "Kraften fra en sylinder er F = p · A. Hydraulikk kjøres ofte på 100–300 bar, mens trykkluft vanligvis ligger rundt 6 bar, så med samme areal blir kraften mange ganger større. Olje er dessuten nesten ikke kompressibel, så sylinderen holder posisjonen stivt under last. Luft er derimot fjærende, og pneumatikk egner seg bedre til raske, lette bevegelser.", "267": "Trykkbegrensningsventilen er systemets sikkerhetsventil. Den holder seg stengt til trykket når innstilt verdi, og åpner da mot tank slik at overskuddsoljen slippes ut. Det beskytter pumpe, slanger og sylindere mot sprengning, for eksempel når en sylinder står i endestopp. Hastighet styres med strupeventiler og retning med retningsventiler.", "268": "ISO 1219 beskriver grafiske symboler og kretsskjemaer for pneumatikk og hydraulikk, som ventiler, sylindere, pumper og strupeventiler. For elektriske symboler i strømskjema brukes IEC 60617, og EN 81346 gjelder referansebetegnelser for komponenter. ISO 9001 handler om kvalitetsstyring. Kjenner du ISO 1219, kan du lese pneumatikkskjema fra alle leverandører.", "269": "NEK EN 61439 er produktstandarden for lavspennings koblings- og kontrollutstyr, altså tavler. Den stiller krav til konstruksjon, temperaturstigning, kortslutningsfasthet og isolasjon, og tavlebyggeren må verifisere tavla mot disse kravene før levering. NEK EN 60204-1 handler om elektrisk utstyr på maskiner, og brukes sammen med 61439 når tavla styrer en maskin, men den erstatter ikke tavlestandarden.", "270": "NEK EN 60204-1 anbefaler en fast fargekode i maskintavler: svart for hovedkretser med AC og DC, rød for AC-styrestrøm, mørkeblå for DC-styrestrøm og oransje for kretser som forsynes utenfra. Mørkeblå for 24 V DC er derfor det standarden peker på. Mange bedrifter har likevel egne fargekoder, så sjekk alltid fargeforklaringen i skjemaet før du kobler eller feilsøker.", "271": "Oransje leder markerer kretser som ikke kobles fra av maskinens hovedbryter, typisk forriglinger eller signaler som forsynes fra en annen tavle. Selv om hovedbryteren er av, kan det altså være spenning på disse lederne. Fargen er en advarsel til den som jobber i tavla om å kontrollere spenningsløshet også på disse kretsene. Noen bedrifter bruker oransje til andre formål, så sjekk skjemaets fargeforklaring.", "272": "Hovedbryteren er maskinens skillebryter, og den skal kunne låses i av-stilling, for eksempel med hengelås. Da kan den som jobber på maskinen sette sin egen lås på, slik at ingen andre kan slå på mens arbeidet pågår. Dette er grunnlaget for sikker frakobling etter FSE. Hovedbryteren skal ikke være avhengig av PLS, og nødstopp er en egen funksjon som ikke erstatter låsbar frakobling.", "273": "En flertrådet leder består av mange tynne kordeller. Skrus den rett inn i en skrueklemme, kan kordeller spre seg utenfor klemmen, bli klemt av eller kuttet, og kontakten blir dårlig. Endehylsen samler kordellene til en fast pinne som gir god og varig kontakt. Hylsen øker ikke tverrsnittet og er ikke ment som isolasjon eller merking. Bruk riktig størrelse og godkjent presstang.", "274": "Produsenten oppgir et tiltrekkingsmoment for hver klemme fordi både for løs og for hard tiltrekking gir problemer. For løst gir høy overgangsmotstand, varmgang og i verste fall brann. For hardt kan knuse kordeller, skade gjenger eller sprekke klemmehuset. Bruk momentskrutrekker med riktig innstilling, særlig på kraftklemmer og hovedbrytere.", "275": "Kraftkabler, særlig til motorer og frekvensomformere, lager magnetiske og elektriske felt som kan indusere støy i signalkabler som ligger tett inntil. Analoge signaler som 4–20 mA og følsomme busser er spesielt utsatt. Ved å legge kraft og signal i separate kanaler med avstand reduseres koblingen mellom dem. Må de krysse, gjør det i 90° for å minimere påvirkningen.", "276": "For analoge signaler med lav frekvens jordes skjermen normalt i én ende, vanligvis i tavla. Jordes skjermen i begge ender, kan potensialforskjell mellom jordpunktene drive en strøm i skjermen, en jordsløyfe, som gir støy på signalet. Ved høyfrekvent støy, for eksempel motorkabler fra frekvensomformer og mange feltbusser, jordes skjermen derimot i begge ender med 360° tilkobling.", "277": "Tavla må tåle kortslutningsstrømmen som kan oppstå der den står. Prospektiv kortslutningsstrøm er strømmen som ville gått ved en boltet kortslutning på stedet. Er tavlas kortslutningsytelse, for eksempel Icw eller betinget kortslutningsstrøm Icc, lavere, kan skinner og komponenter deformeres eller eksplodere ved en feil. Derfor må verdien fra netteier eller beregning sammenlignes med tavlas data.", "278": "Komponenter som PLS, strømforsyninger og frekvensomformere har en øvre driftstemperatur, ofte rundt 40–55 °C. I en lukket tavle avgir komponentene varme som må ut. Varmeberegningen sammenligner tapseffekten med hva skapet kan avgi, slik at temperaturen ikke blir for høy. Viser beregningen for høy temperatur, monteres vifte med filter, varmeveksler eller kjøleaggregat.", "279": "Merkingen på ledere, rekkeklemmer og komponenter skal stemme med skjemaene, slik at det er entydig hvilken leder og klemme som hører til hvilken krets. Når en tekniker feilsøker, slår han opp i skjemaet og skal kunne finne nøyaktig samme betegnelse i tavla. Avvik mellom merking og skjema gir feilkoblinger og lang feilsøking.", "280": "Systematisk feilsøking starter med å forstå feilen før du rører noe. Snakk med operatøren, les alarmlogg og trender, og finn ut hva som skjedde, når det skjedde og om noe er endret, for eksempel programendring, utskiftet komponent eller vedlikehold. Ofte peker dette rett mot årsaken. Å bytte deler eller laste ned program på nytt uten å vite hva som er feil, sløser tid og kan skjule årsaken.", "281": "Halveringsmetoden går ut på å måle midt på signalveien. Er signalet i orden der, ligger feilen i siste halvdel, ellers i første. Deretter halverer du den feilaktige delen igjen. Med for eksempel 16 mulige feilpunkter finner du feilen på rundt fire målinger. Metoden er effektiv på lange kretser med mange rekkeklemmer, releer og koblingsbokser.", "282": "4–20 mA bruker live zero: 4 mA tilsvarer 0 % av måleområdet. En fungerende sløyfe skal derfor aldri vise 0 mA. 0 mA betyr at det ikke går strøm i det hele tatt, typisk brudd i kabel eller klemme, manglende sløyfeforsyning eller defekt transmitter. Prosessverdi 0 % ville vist 4 mA. Mange PLS-er gir derfor alarm når signalet går under ca. 3,6–3,8 mA.", "283": "Lyser giverens LED, registrerer giveren objektet, men signalet når ikke fram til PLS-inngangen. Typiske årsaker er brudd i signalleder eller klemme, at giveren er NPN mens inngangskortet forventer PNP, eller at inngangskortets felles 0 V ikke er koblet. Mål spenningen på inngangsklemmen mot kortets referanse. Programmet og HMI kan ikke påvirke inngangs-LED-en, så de er ikke første sted å lete.", "284": "Når kontaktoren ikke trekker, er feilen i styrekretsen, ikke i motoren. Følg strømveien fra styrespenningen til kontaktorspolen: sjekk at styrespenning er tilstede, at vern og sikringer er inne, at nødstopp er tilbakestilt og at forriglinger og termorelé er lukket. Mål deg fram til punktet der spenningen forsvinner. Motorlagre og motorkabel er først aktuelle når kontaktoren faktisk trekker.", "285": "Kp er forsterkningen, og høyere Kp gir kraftigere pådrag for samme avvik. Ti er integraltiden, og kortere Ti betyr at I-leddet bygger seg raskere opp. Begge deler gjør regulatoren mer aggressiv, og blir den for aggressiv, oversvinger og svinger sløyfa. Lavere Kp og lengre Ti gir roligere regulering. Gå tilbake til sist kjente gode parametre og juster forsiktig.", "286": "Støy på analoge signaler kommer oftest fra elektromagnetisk påvirkning. Vanlige årsaker er manglende eller feil avsluttet skjerm, jordsløyfer der skjerm eller 0 V er jordet flere steder, og signalkabel lagt tett inntil kraftkabler, særlig motorkabler fra frekvensomformer. Sjekk skjermavslutning, jordingspunkter og kabelføring før du bruker filter i PLS-en.", "287": "I et IT-nett gir første jordfeil ingen utkobling, men isolasjonsovervåkingen varsler at isolasjonen er lav. Den sier ikke hvor feilen er. Et jordfeilsøkingssystem sender et testsignal inn i nettet og finner med strømtenger hvilken kurs signalet lekker ut på. Alternativt kan man koble ut kurser én og én til varselet forsvinner, men det krever at kursene kan tas ut av drift.", "288": "Når feilen er rettet, må du teste at funksjonen virker som den skal, gjerne sammen med operatøren, og at sikkerhetsfunksjoner som nødstopp og forriglinger er intakte. Deretter dokumenteres hva feilen var, årsaken og hva som ble gjort, for eksempel i vedlikeholdssystemet. Det hjelper neste person og gjør det mulig å se om samme feil går igjen.", "289": "PT100 er en motstandsføler der motstanden øker med temperaturen, 100 Ω ved 0 °C og ca. 138,5 Ω ved 100 °C. Ved brudd i føler eller ledning blir motstanden i praksis uendelig, og transmitteren eller inngangskortet tolker det som svært høy temperatur. Kortslutning gir motsatt effekt, nær 0 Ω, som vises som svært lav temperatur.", "290": "I ISA-merking angir første bokstav den målte størrelsen og de neste bokstavene funksjonen. P står for trykk (pressure) og T for transmitter. PT er derfor en trykktransmitter, typisk med 4–20 mA ut. En temperaturtransmitter ville hatt taggen TT. Tallet bak, for eksempel PT-101, angir sløyfenummeret.", "291": "Bokstavene leses etter ISA-systemet: L er målt størrelse nivå (level), S er funksjonen bryter (switch) og H betyr høy (high). LSH er altså en nivåbryter som slår ved høyt nivå, for eksempel en vibrasjonsgaffel øverst i en tank som gir alarm eller stopper innpumping. Tilsvarende er LSL nivåbryter lavt nivå.", "292": "T er målt størrelse temperatur. I betyr indikerende, altså at verdien vises, og C betyr regulator (controller). TIC er derfor en temperaturregulator som også viser måleverdien, for eksempel en PID-sløyfe som styrer varmeelement eller ventil. En ren temperaturindikator ville hatt taggen TI.", "293": "F står for mengde (flow) og V for ventil. FV er derfor ventilen i en mengdesløyfe, typisk en reguleringsventil som styres av regulatoren FIC med samme sløyfenummer. Sammen med mengdetransmitteren FT utgjør de hele sløyfa. Frekvensomformer har ikke bokstaven F i ISA-sammenheng, der betyr F alltid flow når det står først.", "294": "P&ID står for Piping and Instrumentation Diagram. Det viser prosessen med rør, tanker, pumper og ventiler, sammen med instrumenter merket med ISA-tagger og hvordan reguleringssløyfer henger sammen. Det viser ikke elektriske koblinger eller plassering i tavla, det finner du i strømskjema og koblingsskjema. P&ID er utgangspunktet for I/O-liste og sløyfeskjemaer.", "295": "Et sløyfeskjema viser én enkelt måle- eller styresløyfe fra start til slutt: instrumentet i felt, kabler, koblingsbokser, rekkeklemmer i tavla, eventuelle barrierer og til slutt I/O-kanalen i styresystemet. Det er arbeidsverktøyet ved sløyfetest og feilsøking, fordi du kan følge signalet klemme for klemme uten å lete gjennom mange tegninger.", "296": "I/O-listen er en tabell over alle signaler mellom felt og styresystem. For hvert signal står tag, beskrivelse, PLS-adresse eller kanal, signaltype som digital eller 4–20 mA, og gjerne måleområde og alarmgrenser. Programmereren bruker den til å deklarere variabler, og ved sløyfetest krysser man av hvert signal i listen.", "297": "Strømskjemaet viser hvordan kretsene virker, med strømveier, kontakter og spoler tegnet logisk og oversiktlig, uavhengig av hvor komponentene sitter. Koblingsskjemaet viser de fysiske tilkoblingene, altså hvilken leder som går til hvilken klemme på hvilken komponent. Strømskjemaet brukes til å forstå funksjon og feilsøke, koblingsskjemaet til å bygge og koble.", "298": "IEC 81346 deler betegnelser i aspekter med hvert sitt prefiks. «=» angir funksjon, altså hva noe gjør i anlegget, «+» angir plassering, for eksempel hvilket rom eller skap, og «-» angir produkt, selve komponenten. En betegnelse som +A1-K3 betyr da komponent K3 i skap A1. Slik kan samme komponent finnes både funksjonelt og fysisk.", "299": "Funksjonsbeskrivelsen forteller med ord hvordan anlegget skal oppføre seg: start og stopp, automatisk og manuell drift, reguleringer, alarmer, forriglinger og hva som skjer ved feil eller strømbrudd. Den er avtalen mellom kunde, prosess og programmerer. Programmet skrives etter den, og FAT og SAT testes mot den.", "300": "Under bygging blir det nesten alltid endringer: kabler legges annerledes, klemmer flyttes og komponenter byttes. As built-dokumentasjon er tegninger og lister oppdatert slik anlegget faktisk ble utført. Den som skal drifte og feilsøke senere må kunne stole på at skjemaene stemmer med virkeligheten, ellers blir feilsøking både treg og farlig.", "301": "FAT, Factory Acceptance Test, gjennomføres hos leverandøren før utstyret sendes, gjerne med simulerte signaler, slik at feil kan rettes i verkstedet. SAT, Site Acceptance Test, gjennomføres etter installasjon på anlegget, med ekte felttilkoblinger og prosess. Begge testes mot funksjonsbeskrivelsen, og kunden er ofte med og godkjenner.", "302": "En sløyfetest kontrollerer hele veien fra feltinstrumentet til styresystem og HMI. Man påtrykker for eksempel 12 mA eller simulerer en prosessverdi ved instrumentet, og sjekker at riktig tag viser riktig verdi med riktig skalering, her 50 %. For utganger styrer man fra systemet og ser at riktig ventil eller motor reagerer. Feil adresse eller ombyttede ledere avsløres her.", "303": "Etter forskrift om elektriske lavspenningsanlegg (FEL) skal den som har utført installasjonen levere en samsvarserklæring til eier. Den bekrefter at anlegget er prosjektert, utført og kontrollert i samsvar med forskriften. Sammen med den skal nødvendig dokumentasjon følge, som kursfortegnelse, beregninger av kabel og vern, og resultater fra sluttkontroll.", "304": "Fagprøven vurderes på hele arbeidsprosessen, ikke bare det praktiske resultatet. Prøvenemnda ser på planleggingen, hvordan du gjennomfører arbeidet, faglig og sikkerhetsmessig, egenvurderingen der du reflekterer over eget arbeid, og dokumentasjonen du leverer. Et godt praktisk resultat kan altså trekkes ned av svak plan eller mangelfull dokumentasjon.", "305": "En god plan viser at du har forstått oppgaven og tenkt gjennom hvordan den skal løses trygt. Fremdriftsplanen fordeler tiden, material- og verktøylisten viser at du har det du trenger, risikovurderingen viser at du har tenkt på farer og tiltak, og fremgangsmåten beskriver rekkefølgen i arbeidet. Prøvenemnda bruker planen til å følge deg underveis.", "306": "Egenvurderingen skal vise at du kan reflektere over eget arbeid. Beskriv hva som gikk bra, hva du ville gjort annerledes og hvorfor, og hvilke avvik det ble fra planen og hvordan du håndterte dem. Ærlige og faglig begrunnede vurderinger teller positivt. Å skjule feil eller bare skrive det som gikk bra gir et svakere inntrykk.", "307": "Forebyggende vedlikehold er planlagt arbeid som gjøres før noe går i stykker, for eksempel bytte av filtre, ettertrekking av klemmer, smøring og utskifting av slitedeler. Det styres gjerne etter kalender eller driftstimer. Målet er færre uventede stopp. Reparasjon etter at feilen har skjedd er korrigerende vedlikehold.", "308": "Ved tilstandsbasert vedlikehold måler man tilstanden på utstyret, for eksempel vibrasjon i motorlagre, temperatur med termografi eller strømtrekk, og griper inn når målingene viser at noe begynner å svikte. Man unngår både havari og unødvendig tidlig utskifting av deler som fortsatt er gode, slik fast intervallbasert bytte kan gi.", "309": "Korrigerende vedlikehold, også kalt avhjelpende vedlikehold, er arbeidet som gjøres etter at en feil har oppstått, for å få utstyret i drift igjen. Eksempler er å bytte en defekt giver eller en brent kontaktor. Planlagt bytte av deler og kalibrering hører derimot til forebyggende vedlikehold.", "310": "Et termografikamera viser overflatetemperaturer som et varmebilde. I en tavle avslører det dårlige koblinger og løse klemmer, som får høy overgangsmotstand og blir varme, samt overbelastede komponenter og ubalanse mellom faser. Målingen må gjøres under normal last, fordi varmgang bare oppstår når det går strøm. Termografi måler ikke spenning eller isolasjon.", "311": "FDV står for forvaltning, drift og vedlikehold. FDV-dokumentasjonen er samlingen eier trenger for å drive anlegget videre: as built-tegninger, produktdatablad, brukerveiledninger, vedlikeholdsinstrukser og reservedelslister. Den leveres ved overlevering, og i bygg er det ofte krav om at den følger en bestemt struktur.", "312": "MTBF står for Mean Time Between Failures, gjennomsnittlig driftstid mellom feil. Har en komponent MTBF på 100 000 timer, betyr det ikke at hver enhet varer så lenge, men at feil i snitt opptrer så sjelden i en stor populasjon. MTTR, Mean Time To Repair, er gjennomsnittlig reparasjonstid. Sammen sier de noe om tilgjengeligheten til anlegget.", "313": "Ib er strømmen belastningen trekker, In er vernets merkestrøm og Iz er kabelens strømføringsevne. Vernet må være minst like stort som belastningen, ellers løser det ut i normal drift, og det må ikke være større enn det kabelen tåler, ellers kan kabelen overopphetes uten at vernet reagerer. Eksempel: Ib = 12 A, In = 16 A og Iz = 20 A oppfyller kravet.", "314": "Ib er den dimensjonerende strømmen kursen skal føre i normal drift. Den hentes fra merkeskiltet, eller beregnes fra effekten. Enfase: Ib = P / (U · cos φ). Trefase: Ib = P / (√3 · U · cos φ). Eksempel: en 2300 W ovn på 230 V gir Ib = 2300 / 230 = 10 A. Ib er utgangspunktet for valg av vern og kabel.", "315": "Iz er strømmen kabelen kan føre kontinuerlig uten at ledertemperaturen blir høyere enn isolasjonen tåler, for eksempel 70 °C for PVC. Den finnes i tabeller i NEK 400 ut fra tverrsnitt, isolasjon og forlegningsmåte, og korrigeres for omgivelsestemperatur og samlet forlegning. Samme kabel kan derfor ha ulik Iz avhengig av hvordan den er lagt.", "316": "I2 er den strømmen som garantert får vernet til å løse ut innen den konvensjonelle tiden, typisk 1 time for mindre vern. Strømmer mellom In og I2 kan gå lenge uten utkobling. For automatsikringer med B- og C-karakteristikk er I2 = 1,45 · In, så en 16 A automat løser sikkert ut ved 1,45 · 16 = 23,2 A innen en time.", "317": "Kravet I2 ≤ 1,45 · Iz sikrer at kabelen ikke blir overbelastet for lenge før vernet løser ut. Kabelen tåler en kortvarig overlast på inntil 45 % over Iz. For automatsikringer er I2 = 1,45 · In, så når In ≤ Iz er kravet oppfylt automatisk. For smeltesikringer med høyere I2 må det kontrolleres særskilt.", "318": "For gG-smeltesikringer fra 16 A og oppover er I2 omtrent 1,6 · In. Kravet I2 ≤ 1,45 · Iz gir da 1,6 · In ≤ 1,45 · Iz, altså In ≤ 0,9 · Iz. Eksempel: Iz = 20 A gir maks In = 18 A, så man må velge 16 A smeltesikring, mens en automatsikring på 20 A kunne vært brukt. Derfor havner smeltesikringer ofte ett trinn lavere.", "319": "En kabel blir varm av strømmen den fører og må kvitte seg med varmen til omgivelsene. Ligger mange belastede kabler tett sammen, varmer de hverandre og får dårligere kjøling. Da må strømmen ned for at ledertemperaturen ikke skal overskride grensen. Tabellverdien for Iz multipliseres med en korreksjonsfaktor for samlet forlegning, som blir lavere jo flere kabler som ligger sammen.", "320": "Tabellene for Iz gjelder en bestemt referansetemperatur, i NEK 400 typisk 30 °C i luft. Isolasjonen tåler en fast maks ledertemperatur, for eksempel 70 °C for PVC. Er omgivelsene varmere, er det mindre temperaturmargin igjen til strømoppvarmingen, og kabelen tåler mindre strøm. Iz korrigeres derfor med en temperaturfaktor under 1, for eksempel i varme tavler eller nær ovner.", "321": "Bryteevnen er den største kortslutningsstrømmen vernet klarer å bryte uten å bli ødelagt. Den må være minst like stor som den største prospektive kortslutningsstrømmen der vernet står, ofte beregnet som Ik3maks. Er bryteevnen for lav, kan vernet sveise seg fast eller eksplodere i stedet for å bryte. Et vern med bryteevne 6 kA kan altså ikke brukes der Ik er 10 kA, med mindre det er backup-vern foran.", "322": "Kortslutningsstrømmen i inntaket avhenger av transformatoren og nettet foran kunden, som installatøren ikke har oversikt over. Derfor oppgir netteier største og minste kortslutningsstrøm i tilknytningspunktet. Installatøren bruker disse verdiene videre i beregninger, for eksempel i FEBDOK, til å kontrollere bryteevne og utkobling ute på kursene.", "323": "Begge angir bryteevne, altså hvor stor kortslutningsstrøm vernet kan bryte. Icn er merkebryteevnen for automatsikringer til bolig og lignende etter EN 60898, for eksempel 6 kA eller 10 kA. Icu er grensebryteevnen for effektbrytere og industrielle vern etter EN 60947-2. Det er altså ulike produktstandarder, ikke forskjell på AC/DC eller største/minste strøm.", "324": "Ved en feil langt ute på kursen er impedansen i sløyfa størst, og kortslutningsstrømmen minst. Vernet må likevel løse ut raskt nok, ofte momentant. Derfor beregnes Ik min i enden av kursen og sammenlignes med strømmen vernet trenger for momentan utkobling, for eksempel 10 · In for C-automat. Lang og tynn kabel gir lav Ik min og kan kreve større tverrsnitt eller annet vern.", "325": "C-karakteristikk betyr at den magnetiske utløseren løser ut momentant et sted mellom 5 og 10 ganger merkestrømmen. For å være sikker på momentan utkobling må man regne med øvre grense: 10 · In = 10 · 16 A = 160 A. Ved 80 A, som er 5 · In, kan automaten løse ut momentant, men det er ikke garantert.", "326": "B-karakteristikk betyr at automaten løser ut momentant mellom 3 og 5 ganger merkestrømmen. For sikker momentan utkobling brukes øvre grense: 5 · In = 5 · 10 A = 50 A. 30 A er nedre grense, der den kan løse ut, men ikke garantert. B-automater brukes der kortslutningsstrømmen er lav, for eksempel på lange kurser, fordi de krever minst strøm.", "327": "NEK 400 krever at vernet ved feil til jord kobler ut innen 0,4 s på sluttkurser i TN-system med 230 V mot jord. Kort tid er viktig fordi berøringsspenningen ved en feil kan være farlig høy. Kravet oppfylles i praksis ved at feilstrømmen er stor nok til momentan utkobling, for eksempel minst 160 A for en 16 A C-automat, som bryter på godt under 0,1 s.", "328": "Under en kortslutning varmes lederen opp av energien I²t før vernet bryter. Kabelen tåler energien k² · S², der S er tverrsnittet og k avhenger av ledermateriale og isolasjon. Vernet må slippe gjennom mindre energi enn kabelen tåler, ellers skades isolasjonen. Eksempel: 1,5 mm² Cu/PVC tåler 115² · 1,5² ≈ 29 800 A²s.", "329": "k-verdien sier hvor mye kortslutningsenergi en leder tåler og avhenger av ledermateriale, isolasjon og tillatt start- og sluttemperatur. For kobber med PVC-isolasjon er k = 115. PEX tåler høyere temperatur og gir k = 143, mens aluminium med PVC har k = 76. Verdien brukes i kravet I²t ≤ k² · S².", "330": "Spenningsfall gjør at utstyret får lavere spenning enn nominelt, noe som kan gi dårlig motorstart, svakere lys og varmeutvikling. NEK 400 gir veiledende grenser, og vanlig anbefaling er 3 % for belysning og 5 % for andre forbrukere, regnet fra inntaket. Noe undervisningsmateriell oppgir 4 % som generell grense, så sjekk utgaven dere bruker. Ved lange kurser er det ofte spenningsfallet som avgjør tverrsnittet.", "331": "Prosent betyr hundredeler, så 5 % er 0,05. Spenningsfallet blir 0,05 · 230 V = 11,5 V. Forbrukeren får da ned mot 230 − 11,5 = 218,5 V. Tilsvarende er 3 % av 230 V lik 0,03 · 230 = 6,9 V.", "332": "Spenningsfallet er strømmen ganger lederens motstand, og motstanden er R = ρ · L / S. På en enfase kurs går strømmen ut på faseleder og tilbake på nøytralleder, så lederlengden blir 2 · L. Det gir ΔU = 2 · I · L · ρ / S. På trefase symmetrisk last brukes √3 i stedet for 2, fordi strømmen ikke går tilbake i nøytralleder.", "333": "Formelen for enfase er ΔU = 2 · I · L · ρ / S. Innsatt: 2 · 10 A · 20 m · 0,0175 Ω·mm²/m / 2,5 mm². Først 2 · 10 · 20 = 400, så 400 · 0,0175 = 7, og til slutt 7 / 2,5 = 2,8 V. Det er 2,8 / 230 ≈ 1,2 %, godt innenfor anbefalt grense.", "334": "Spenningsfallet ΔU = 2 · I · L · ρ / S er proporsjonalt med både strøm og lengde. Holdes ΔU fast, kan produktet I · L være konstant. Halveres strømmen, kan lengden derfor dobles uten at spenningsfallet blir større. Eksempel: tillater kursen 40 m ved 10 A, tillater den 80 m ved 5 A. Vern og kortslutningsstrøm i enden må likevel kontrolleres for den lengre kabelen.", "335": "FEBDOK er et beregningsprogram utviklet av Nelfo, og er mye brukt av norske installatører. Det beregner kortslutningsstrømmer, utkoblingstider, selektivitet, spenningsfall og strømføringsevne etter NEK 400, og lager dokumentasjon som kan leveres med anlegget. TIA Portal er Siemens sitt PLS-verktøy og AutoCAD et tegneprogram, og ingen av dem dimensjonerer kabel og vern.", "336": "Varmepumpen er en Nibe S1156-13 med SMO, og tallet 13 i typebetegnelsen viser ytelsen på 13 kW. Den dekker grunnlasten i bygget. Når den ikke strekker til, kobler elkjelen IEZ001 på 30 kW seg inn som spisslast, og elkjelen er også backup hvis varmepumpen faller ut. 18 kW er gulvvarmen og 5,5 kW er varmebatteriet i ventilasjonen.", "337": "Varmepumpen henter varme fra energibrønner i grunnen, som er kald side og har systemnummer 3560.001. Pumpe 3560.001-JPA401 sirkulerer kuldebæreren gjennom brønnene og fordamperen. Den styres av varmepumpen selv, så den går bare når varmepumpen trenger varme fra brønnene. Grunnvarme gir jevn temperatur hele året.", "338": "Elkjelen er spisslast og skal bare brukes når varmepumpen ikke klarer jobben alene. Derfor kobles den inn trinnvis først når varmepumpen går med fullt pådrag og settpunktet på RTB404 likevel ikke nås. Tidsforsinkelse på inn- og utkobling hindrer at trinnene slår av og på for ofte. Slik blir den rimeligste energikilden som brukes mest.", "339": "Varmepumpen leverer også varme til forvarming av tappevann, og den kursen trenger høy nok turtemperatur hele året. Hvis turtemperaturen ble senket når det er mildt ute, ville tappevannet ikke blitt varmet godt nok. Derfor starter og stopper varmepumpen på sine interne følere. Varmepumpen holder dermed en jevn turtemperatur inn på akkumulatortanken.", "340": "JPA501 hører til varmepumpens egen krets, og det er varmepumpens interne styring som starter og stopper den. Det samme gjelder brønnpumpen 3560.001-JPA401. Når varmepumpen stopper, går pumpene en stund til med tidsforsinkelse, slik at restvarmen blir ført bort. SD-anlegget overvåker, men gir ikke start og stopp.", "341": "JPA401 og JPA402 er trykkstyrte, så turtallet følger forbruket. Når ventilene i kursene stenger, øker trykket og pumpen senker turtallet, og omvendt. Bare én pumpe går om gangen, og de alternerer for lik slitasje. Tidspunktet for veksling kan stilles fra SD.", "342": "Lavt trykk på RPB401 betyr ofte lekkasje eller for lite vann i anlegget. Da stoppes parallellpumpene JPA401/402 og gulvvarmepumpen 3200.002-JPA401, så de ikke tørrkjøres og blir ødelagt. I praksis må man finne årsaken, etterfylle og lufte før pumpene startes igjen.", "343": "Parallellpumpene gir redundans. Får den ene feil, går det alarm til SD og den andre pumpen tar over automatisk, så varmeforsyningen fortsetter. Feilen skal rettes lokalt på pumpen, og deretter kvitteres alarmen. Det skjer ingen automatisk reset, slik at noen faktisk ser på årsaken.", "344": "Pumper som står lenge kan sette seg fast på grunn av belegg og korrosjon, særlig om sommeren. Derfor mosjonkjøres alle pumper minst 5 minutter hver uke når de ellers ikke går. Reguleringsventilen SBB401 i gulvvarmen mosjoneres også ukentlig av samme grunn. Dette legges inn som et tidsprogram i undersentralen.", "345": "Gulvvarmen er et lavtemperatursystem med 35 °C tur og 30 °C retur. Det store gulvet gir stor varmeflate, så lav temperatur er nok til å dekke transmisjonstapet i oppholdsrommene i plan 1 og 2, totalt 18 kW. Lav turtemperatur gir også god virkningsgrad på varmepumpen. 50/30 °C er varmebatteriet i ventilasjonen.", "346": "Shunten skal holde riktig turtemperatur ut til gulvvarmen. Derfor regulerer SBB401 mot turføleren RTB401, som sitter etter shunten. Romtemperaturen tas hånd om av romregulatorene og ventilene på fordelerne. RTB404 hører til hovedkursen og brukes til innkobling av elkjelen.", "347": "Ventilen tilfører varme, så den må åpne mer når turtemperaturen blir for lav. Det er revers virkning: pådraget øker når prosessverdien synker. Står regulatoren i direkte virkning, lukker ventilen når det blir kaldt og temperaturen stikker av. Dette er en vanlig ting å sjekke ved idriftsettelse.", "348": "Funksjonsbeskrivelsen kap. 9 sier at ventiler skal vises i SD med AV/PÅ/AUTO, status og pådrag eller stilling, og at posisjonen til SBB401 skal sendes til SD. Da ser driften både hva regulatoren ber om og hvor ventilen faktisk står. Følger ikke posisjonen pådraget, henger ventilen eller motoren er feil, og det gjør feilsøking mye enklere.", "349": "Funksjonsbeskrivelsene krever at energimålerne kommuniserer på M-Bus. M-Bus er en standard buss for avlesning av målere, og gir både energi, effekt, temperaturer og mengde i én kobling. Undersentralen leser målerne og sender verdiene videre til SD, slik at energiforbruket kan følges opp.", "350": "En trestillingsvender kobles som regel til to digitale innganger, én for PÅ og én for AUTO. Er ingen av dem aktive, står venderen i AV. I AUTO styrer automatikken pumpen, mens i PÅ går den uansett. SD bør vite dette, så det ikke ser ut som at styringen svikter når noen har overstyrt lokalt.", "351": "All styring, settpunkter og alarmgrenser ligger i undersentralen, ikke i SD-anlegget. Faller spredenettet ut, går derfor varmeanlegget videre som før, bare uten overvåking og fjernbetjening. Lokalt kan anlegget betjenes med AV-PÅ-AUTO-venderne i tavlefronten. Det er derfor viktig at undersentralen kan stå alene.", "352": "Funksjonsbeskrivelsene sier at varmeanlegget ikke har noen funksjon ved brann. Vannbåren varme sprer ikke røyk, i motsetning til ventilasjon, så det er ingen grunn til å stoppe pumper eller stenge ventiler. Anlegget går derfor som normalt, og det er ingen brannstyring å teste for denne delen.", "353": "Ved spenningsbortfall stopper gulvvarmen. Funksjonsbeskrivelsen krever automatisk reset, så når spenningen kommer tilbake starter anlegget igjen i samme tilstand som før. Ingen trenger å reise ut og starte manuelt. Det er viktig i en omsorgsbolig der beboerne er avhengige av varmen.", "354": "Akkumulatortanken NUB001 rommer 400 liter og fungerer som en buffer mellom varmepumpen og forbrukerne. Den gir varmepumpen lengre driftsperioder og færre starter, noe som gir mindre slitasje på kompressoren og bedre virkningsgrad. Tanken jevner også ut svingninger i varmebehovet.", "355": "I TFM-merkingen står RT for temperaturmåling, og RTB er en temperaturgiver som gir et analogt signal til undersentralen. RTB401 er for eksempel turføleren i gulvvarmen. Tilsvarende er RPB trykkgiver, RDB differansetrykkgiver, JPA sirkulasjonspumpe, SBB motorstyrt reguleringsventil og OEA energimåler.", "356": "I rom med varig opphold måler en romføler temperaturen, og regulatoren styrer to-veis ventiler på gulvvarmefordeleren for sløyfene i rommet. Slik får hvert rom individuell regulering. Shunten holder bare riktig turtemperatur inn til fordelerne, mens romreguleringen bestemmer hvor mye varme hvert rom faktisk får.", "357": "Funksjonsbeskrivelsen krever at romregulatoren er modulerende, altså at pådraget kan ligge trinnløst mellom 0 og 100 %. Det gir jevnere romtemperatur enn av/på med hysterese. Aktuatortypen er ikke angitt i underlaget. Med av/på-termomotorer oppnås modulering med PWM, med 0–10 V-aktuatorer gis pådraget direkte.", "358": "En av/på-aktuator kan bare være åpen eller stengt. Med tidsproporsjonal styring (PWM) er utgangen på en andel av en fast syklustid, for eksempel 6 av 15 minutter ved 40 % pådrag. Gulvet er så tregt at temperaturen ikke merker pulsene, og resultatet blir som en modulerende regulering.", "359": "NC betyr normally closed, altså strømløst stengt. Ventilen er stengt uten spenning og åpner når termomotoren får spenning. Ved spenningsbortfall stenger sløyfen. Er motoren NO, strømløst åpen, blir logikken motsatt, så man må sjekke databladet og tilpasse programmet.", "360": "Nye NC-termomotorer leveres ofte med first open, slik at ventilen står åpen selv om motoren er strømløs. Da kan rørleggeren fylle, lufte og trykkprøve gulvvarmen før elektrikeren har koblet opp. Funksjonen deaktiveres første gang motoren får spenning i noen minutter, og etter det virker den som vanlig NC.", "361": "Romreguleringen har tre nivåer: komfort 22 °C, forberedt 21,5 °C og borte 21 °C. Når bevegelsesføleren registrerer at noen er i rommet, gjelder komfort 22 °C. Uten bevegelse senkes settpunktet litt for å spare energi. Beboeren kan i tillegg justere ±3 °C lokalt.", "362": "Gulvvarmetegningene V-32 viser 33 sløyfer i plan 1 og 18 i plan 2, til sammen 51 sløyfer og ca. 2252 m rør. Antall sløyfer forteller hvor mange kurser fordelerne må ha, og gir grunnlag for å vurdere antall ventiler og aktuatorer som skal styres.", "363": "Bygget har 11 gulvvarmefordelere. Hver av de åtte leilighetene har sin egen, -OR01 til -OR08, og fellesarealet har tre, -OR10, -OR11 og -OR12. Merk at nummer -OR09 ikke finnes. Hver fordeler har to-veis ventiler med aktuatorer som styres fra romreguleringen."};

let lesSel=null,lesQ="",lesHide=false,lesFilter="alle";
const LX=q=>LES[q.id]||q.e;
function les(){
  if(!lesSel)lesSel=new Set(cats);
  const known=new Set(store.get("known")||[]),missed=new Set(store.get("missed")||[]);
  const q=lesQ.toLowerCase().trim();
  const list=Q.filter(x=>lesSel.has(x.c)&&(!q||(x.q+" "+x.a[x.r]+" "+LX(x)).toLowerCase().includes(q))&&(lesFilter==="alle"||(lesFilter==="ukjent"&&!known.has(x.id))||(lesFilter==="feil"&&missed.has(x.id))));
  const nk=Q.filter(x=>known.has(x.id)).length;
  app.innerHTML=`
  <div class="card sec prose">
    <h2>Les opp</h2>
    <p>Alle quizspørsmålene med riktig svar og en forklaring på hvorfor. Les deg gjennom et tema før du tar quizen, og marker det du kan.</p>
    <p class="muted">${nk} av ${Q.length} markert som «kan dette».</p>
    <input type="search" id="lesSearch" placeholder="Søk i spørsmål, svar og forklaringer" aria-label="Søk" value="${esc(lesQ)}" style="width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:12px">
    <div class="row" style="justify-content:space-between;margin-bottom:8px"><b>Temaer</b><span class="row"><button class="linkish" id="lesAll">Alle</button><button class="linkish" id="lesNone">Ingen</button></span></div>
    <div class="chips">${cats.map(c=>{const n=Q.filter(x=>x.c===c).length,k=Q.filter(x=>x.c===c&&known.has(x.id)).length;return `<button class="chip" aria-pressed="${lesSel.has(c)}" data-c="${c}"><span class="dot"></span>${c} <small>${k}/${n}</small></button>`}).join("")}</div>
    <div class="row" style="margin-top:14px">
      <div class="chips">${[["alle","Alle spørsmål"],["ukjent","Bare de jeg ikke kan"],["feil","Bare de jeg har svart feil på"]].map(([k,t])=>`<button class="chip" aria-pressed="${lesFilter===k}" data-f="${k}"><span class="dot"></span>${t}</button>`).join("")}</div>
    </div>
    <label class="check" style="margin-top:10px"><input type="checkbox" id="lesHide" ${lesHide?"checked":""}><span>Skjul svarene, så jeg kan teste meg selv først</span></label>
  </div>
  <p class="muted sec" style="margin-top:-8px">${list.length} spørsmål vises.</p>
  <div id="lesList">${list.length?list.map((x,i)=>{const prev=list[i-1];return `${!prev||prev.c!==x.c?`<h2 class="lesCat">${x.c}</h2>`:""}<article class="card lesCard ${known.has(x.id)?"known":""}" data-id="${x.id}">
    <div class="meta"><span>${x.c}</span><span>${missed.has(x.id)?'<span class="lesMiss">Svart feil før</span>':""}</span></div>
    <p class="q" style="margin-bottom:10px">${esc(x.q)}</p>
    <div class="lesAns" ${lesHide?"hidden":""}>
      <p class="lesRight"><span class="lamp ok"></span><b>${esc(x.a[x.r])}</b></p>
      <p class="lesTxt">${esc(LX(x))}</p>
      <details class="lesAlt"><summary>Vis de gale alternativene</summary><ul>${x.a.filter((_,j)=>j!==x.r).map(a=>`<li>${esc(a)}</li>`).join("")}</ul></details>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      ${lesHide?`<button class="btn sm" data-show="${x.id}">Vis svar</button>`:"<span></span>"}
      <label class="check" style="padding:0"><input type="checkbox" data-k="${x.id}" ${known.has(x.id)?"checked":""}><span>Kan dette</span></label>
    </div>
  </article>`}).join(""):`<div class="empty">Ingen spørsmål passer. Velg flere temaer eller endre filteret.</div>`}</div>`;
  const s=$("lesSearch");let tm;s.oninput=e=>{clearTimeout(tm);tm=setTimeout(()=>{lesQ=e.target.value;const pos=s.selectionStart;les();const n=$("lesSearch");n.focus();n.setSelectionRange(pos,pos)},250)};
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const c=b.dataset.c;lesSel.has(c)?lesSel.delete(c):lesSel.add(c);les()});
  app.querySelectorAll("[data-f]").forEach(b=>b.onclick=()=>{lesFilter=b.dataset.f;les()});
  $("lesAll").onclick=()=>{lesSel=new Set(cats);les()};$("lesNone").onclick=()=>{lesSel=new Set();les()};
  $("lesHide").onchange=e=>{lesHide=e.target.checked;les()};
  app.querySelectorAll("[data-show]").forEach(b=>b.onclick=()=>{const c=b.closest(".lesCard");c.querySelector(".lesAns").hidden=false;b.remove()});
  app.querySelectorAll("[data-k]").forEach(b=>b.onchange=()=>{const k=new Set(store.get("known")||[]);const id=+b.dataset.k;b.checked?k.add(id):k.delete(id);store.set("known",[...k]);b.closest(".lesCard").classList.toggle("known",b.checked)});
}

let notesEl;
route();
</script>
</body>
</html>
