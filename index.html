<style>
:root{
  --bg:#E8E4F1; --panel:#F5F2FB; --ink:#1E1830; --muted:#5E5672; --line:#C9C1DC;
  --door:#2A1F45; --doorInk:#EEE9FA; --signal:#7C4DEB; --signalInk:#FFFFFF;
  --ok:#2F9A55; --bad:#C8302A; --off:#8E879E; --okBg:#DDEFE2; --badBg:#F6DEDC; --eq:#E4DFF0; --u:#3A72B0; --warm:#D9780F;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#15111E; --panel:#211B2F; --ink:#ECE7F7; --muted:#A89FBC; --line:#3B3352;
    --door:#0E0A18; --doorInk:#ECE7F7; --signal:#A97CFF; --signalInk:#140E22;
    --ok:#4CC274; --bad:#EC5A52; --off:#5E5670; --okBg:#1F3A29; --badBg:#43221F; --eq:#1B1627; --u:#6FA3DD; --warm:#F2A03D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#15111E; --panel:#211B2F; --ink:#ECE7F7; --muted:#A89FBC; --line:#3B3352;
    --door:#0E0A18; --doorInk:#ECE7F7; --signal:#A97CFF; --signalInk:#140E22;
    --ok:#4CC274; --bad:#EC5A52; --off:#5E5670; --okBg:#1F3A29; --badBg:#43221F; --eq:#1B1627; --u:#6FA3DD; --warm:#F2A03D;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--door)}
.wrap{max-width:720px;margin:0 auto;padding:0 16px 56px}
header{background:radial-gradient(120% 140% at 0% 0%,color-mix(in srgb,var(--signal) 28%,var(--door)) 0%,var(--door) 60%);color:var(--doorInk);padding:22px 20px 0;margin:0 -16px 24px;border-bottom:6px solid var(--signal)}
@media (min-width:752px){header{border-radius:0 0 6px 6px}}
.hrow{display:flex;align-items:center;gap:12px}.hlogo{flex:none;width:44px;height:44px;filter:drop-shadow(0 0 6px rgba(185,140,255,.6))}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:2.1rem;line-height:1.05;margin:0}
header p{margin:6px 0 0;opacity:.75;font-size:.95rem}
nav{display:flex;gap:4px;margin-top:16px;overflow-x:auto}
nav button{font:inherit;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.15rem;background:transparent;color:var(--doorInk);opacity:.7;border:0;padding:8px 14px 10px;border-radius:6px 6px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-current="page"]{opacity:1;background:var(--signal);color:var(--signalInk)}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.5rem;line-height:1.15;margin:0 0 10px}
h3{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.2rem;margin:18px 0 6px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:18px}
.sec{margin-bottom:22px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:.95rem;border:1.5px solid var(--line);background:transparent;color:var(--ink);padding:7px 12px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip .dot{width:10px;height:10px;border-radius:50%;background:var(--off)}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.chip[aria-pressed="true"] .dot{background:var(--signal);box-shadow:0 0 0 3px color-mix(in srgb,var(--signal) 30%,transparent)}
.chip small{color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{font:inherit;font-weight:600;border:0;border-radius:6px;padding:13px 20px;cursor:pointer;background:var(--signal);color:var(--signalInk)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:.95rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--signal);outline-offset:2px}
.muted{color:var(--muted)}
.linkish{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0}
.lamps{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 16px}
.lamp{width:14px;height:14px;border-radius:50%;background:var(--off);border:2px solid var(--line);opacity:.6}
.lamp.cur{opacity:1;background:var(--signal);border-color:var(--signal)}
.lamp.ok{opacity:1;background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px var(--ok)}
.lamp.bad{opacity:1;background:var(--bad);border-color:var(--bad);box-shadow:0 0 6px var(--bad)}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;color:var(--muted);margin-bottom:8px}
.q{font-size:1.2rem;font-weight:600;line-height:1.4;margin:0 0 16px}
.opts{display:grid;gap:10px}
.opt{font:inherit;text-align:left;background:var(--bg);color:var(--ink);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;cursor:pointer;display:flex;gap:12px;align-items:flex-start}
.opt .k{font-family:"Barlow Condensed",sans-serif;font-weight:700;min-width:1.2em;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okBg)}
.opt.wrong{border-color:var(--bad);background:var(--badBg)}
.fb{margin-top:16px;padding:14px;border-left:5px solid var(--ok);background:var(--okBg);border-radius:0 6px 6px 0}
.fb.no{border-color:var(--bad);background:var(--badBg)}
.fb strong{display:block;margin-bottom:4px}
.next{margin-top:16px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.score{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:4rem;line-height:1}
.review{display:grid;gap:12px;margin-top:14px}
.review .item{border-left:5px solid var(--bad);padding:4px 0 4px 12px}
.review .item p{margin:2px 0}
.stat{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.95rem}
.bar{grid-column:1/-1;height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:8px}
.bar i{display:block;height:100%;background:var(--ok)}
/* theory */
.prose p{margin:0 0 10px;max-width:66ch}
.prose ul,.prose ol{margin:0 0 10px;padding-left:1.3em;max-width:66ch}
.prose li{margin-bottom:4px}
.eq{background:var(--eq);border-radius:6px;padding:12px 14px;margin:8px 0 12px;font-size:1.08rem;overflow-x:auto;white-space:nowrap}
var,.v{font-style:italic;font-family:"Barlow",Georgia,serif}
.frac{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 2px;font-size:.92em}
.frac>span:first-child{border-bottom:1.5px solid currentColor;padding:0 3px}
.frac>span:last-child{padding:0 3px}
.tbl{overflow-x:auto;margin:8px 0 12px}
table{border-collapse:collapse;width:100%;font-size:.98rem}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:.9rem}
.toc{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.95rem}
.toc a{color:var(--ink)}
.note{border-left:4px solid var(--signal);padding:6px 0 6px 12px;margin:10px 0;color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
label.f{display:grid;gap:4px;font-size:.92rem;color:var(--muted)}
label.f input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
canvas{width:100%;height:260px;display:block;background:var(--bg);border-radius:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.9rem;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:5px}
.fig{max-width:100%;height:auto;display:block}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.chk:last-child{border-bottom:0}
.chk .lamp{flex:none;margin-top:4px;opacity:1}
.chk b{font-weight:600}
.out{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.6rem;line-height:1.1}
details.tip{padding:0}
details.tip summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.3rem}
details.tip summary::-webkit-details-marker{display:none}
details.tip summary::after{content:"+";font-size:1.5rem;color:var(--muted);margin-left:10px}
details.tip[open] summary::after{content:"−"}
details.tip summary small{font-family:"Barlow",sans-serif;font-weight:400;font-size:.9rem;margin-left:auto}
.tipi{padding:12px 18px;border-top:1px solid var(--line)}
.tipi p{margin:4px 0 0;max-width:66ch}
/* project */
.empty{border:1.5px dashed var(--line);border-radius:6px;padding:16px;color:var(--muted)}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0;cursor:pointer}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:10px;width:100%;min-height:140px;resize:vertical}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.facts>div{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.facts span{font-size:.85rem}
#p-alarm td,#p-risk td,#p-utstyr td:nth-child(3){white-space:normal;min-width:150px}
ol.plan{display:grid;gap:8px}
@media (max-width:520px){
  h1{font-size:1.7rem}
  header{padding:16px 16px 0}
  nav button{font-size:1.05rem;padding:8px 11px 10px}
  .card{padding:14px}
  .q{font-size:1.08rem}
  .btn{padding:12px 16px}
  #lvCanvas{height:240px}
  .lvTile b{font-size:1.35rem}
  .lvBox{padding:10px}
  .score{font-size:3rem}
  .opt{padding:12px}
}
button,.chip,.opt,summary,label.check{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.lesCat{margin:26px 0 10px}
.lesCard{margin-bottom:10px}
.lesCard.known{border-color:var(--ok)}
.lesCard .q{font-size:1.08rem}
.lesRight{display:flex;gap:10px;align-items:flex-start;margin:0 0 6px}.lesRight .lamp{flex:none;margin-top:5px}
.lesTxt{margin:0;max-width:66ch;line-height:1.55}
.lesAlt{margin-top:8px;font-size:.92rem;color:var(--muted)}.lesAlt summary{cursor:pointer}.lesAlt ul{margin:6px 0 0;padding-left:1.2em}
.lesMiss{color:var(--bad);font-weight:600}
.lvTiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin-bottom:10px}
.lvTile{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;display:grid;gap:2px;font-variant-numeric:tabular-nums}
.lvTile span{font-size:.85rem}.lvTile b{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;line-height:1.1}
.lvBar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.lvBar i{display:block;height:100%;background:var(--u)}
#lvCanvas{height:300px;touch-action:pan-y;cursor:crosshair}
.lvZoom{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.lvZoom>span{margin-right:4px}
@media (min-width:760px){#t-live{width:min(1180px,calc(100vw - 48px));position:relative;left:50%;transform:translateX(-50%)}}
.lvHead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:14px}
.lvProc{min-width:min(100%,300px)}
.lvGrid{display:grid;gap:14px;grid-template-areas:"main" "left" "right"}
.lvMain{grid-area:main;min-width:0}.lvLeft{grid-area:left}.lvRight{grid-area:right}
.lvSide{display:grid;gap:12px;align-content:start;min-width:0}
.lvBox{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:12px}
.lvBox h4{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;letter-spacing:.03em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.lvBox h4 b{text-transform:none;letter-spacing:0;font-family:"Barlow",sans-serif;font-size:1rem}
.lvBtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.lvWide{width:100%}
.lvBtns .btn.on{border-color:var(--bad);color:var(--bad)}
.lvLbl{display:block;font-size:.88rem;margin:8px 0 0}
.lvChips .chip{padding:4px 9px;font-size:.88rem}
.lvPid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.lvPid input{padding:6px 8px}
.lvCh{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.lvC{border-bottom:0;padding:4px 0;font-size:.95rem}
.lvTiles .lvTile{background:var(--panel)}
@media (min-width:1000px){
  .lvGrid{grid-template-columns:250px minmax(0,1fr) 270px;grid-template-areas:"left main right"}
  #lvCanvas{height:420px}
}
input[type=range]{width:100%;accent-color:var(--signal)}
.f .chips{margin-top:2px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:4px 0 12px}
.chain span{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:.92rem}
.chain span+span::before{content:"→";color:var(--signal);font-weight:700;margin-right:8px}
@media (prefers-reduced-motion:no-preference){.lamp{transition:background .25s,box-shadow .25s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="hrow"><svg class="hlogo" viewBox="0 0 48 48" aria-hidden="true" fill="none" stroke="#B98CFF" stroke-linecap="square" color="#B98CFF"><polygon points="24,3 45,24 24,45 3,24" stroke-width="1.3"/>
<polygon points="24,9 39,24 24,39 9,24" stroke-width=".8" opacity=".5"/>
<line x1="15" y1="20" x2="33" y2="20" stroke-width=".9" stroke-dasharray="1.6 1.3" opacity=".6"/>
<polyline points="15.5,29 19,29 21,23.5 22.8,19.2 24.6,17.6 26.6,19.6 28.6,20.6 32.5,20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="24" cy="3" r="1.3" fill="currentColor" stroke="none"/></svg><h1>Fagprøve automatiker</h1></div>
    <p>Øving, teori, verktøy og ditt prøveprosjekt.</p>
    <nav aria-label="Sider">
      <button data-view="quiz">Quiz</button>
      <button data-view="les">Les opp</button>
      <button data-view="eksamen">Eksamen</button>
      <button data-view="muntlig">Muntlig</button>
      <button data-view="feilsoking">Feilsøking</button>
      <button data-view="regulering">Reguleringsteknikk</button>
      <button data-view="kabel">Kabel og vern</button>
      <button data-view="kalkulatorer">Kalkulatorer</button>
      <button data-view="tfm">TFM</button>
      <button data-view="symboler">Symboler</button>
      <button data-view="ordliste">Ordliste</button>
      <button data-view="tips">Tips og triks</button>
      <button data-view="prosjekt">Mitt prosjekt</button>
    </nav>
  </header>
  <main id="app"></main>
</div>
<script>
const RAW = [
// ===== Elsikkerhet =====
["Elsikkerhet","Hva står FSE for?",["Forskrift om sikkerhet ved arbeid i og drift av elektriske anlegg","Forskrift om elektriske lavspenningsanlegg","Forskrift om systematisk elsikkerhetsarbeid","Forskrift om elektrisk utstyr"],"FSE regulerer sikkerhet ved arbeid i og drift av elektriske anlegg: opplæring, arbeidsmetoder og ansvar."],
["Elsikkerhet","Hva står FEL for?",["Forskrift om elektriske lavspenningsanlegg","Forskrift om elektrisk lysutstyr","Forskrift om eltilsyn lokalt","Forskrift om energi og ledninger"],"FEL stiller krav til hvordan lavspenningsanlegg skal prosjekteres, utføres og vedlikeholdes. NEK 400 er en måte å oppfylle kravene på."],
["Elsikkerhet","Hvilken norm gjelder for elektriske lavspenningsinstallasjoner i Norge?",["NEK 400","NEK EN 61439","NEK 405","IEC 61131"],"NEK 400 er normen for lavspenningsinstallasjoner. NEK EN 61439 gjelder tavler, IEC 61131 gjelder PLS."],
["Elsikkerhet","Hvilken standard dekker elektrisk utstyr på maskiner?",["NEK EN 60204‑1","NEK 400‑7","NEK EN 60079‑14","ISO 9001"],"NEK EN 60204‑1 stiller krav til elektrisk utstyr på maskiner, blant annet styrekretser og stoppfunksjoner."],
["Elsikkerhet","Ved arbeid på frakoblet anlegg følger man fem sikkerhetsregler. Hva er tredje steg?",["Kontrollere at anlegget er spenningsløst","Jorde og kortslutte","Sikre mot innkobling","Frakoble"],"FSE § 14: a) frakobling, b) sikring mot innkobling, c) kontroll av spenningsløshet, d) jording og kortslutning etter risikovurdering (alltid i høyspenning), e) beskyttelse mot spenningssatte deler nær ved."],
["Elsikkerhet","Hva er første steg av de fem sikkerhetsreglene?",["Frakoble","Kontrollere spenningsløshet","Jorde og kortslutte","Sette opp skilt"],"Man starter med å frakoble anlegget fra alle mulige forsyninger."],
["Elsikkerhet","Hva er øvre grense for lavspenning (vekselspenning)?",["1000 V AC","400 V AC","690 V AC","1500 V AC"],"Lavspenning er opp til 1000 V AC og 1500 V DC."],

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]));
const $=id=>document.getElementById(id);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();

/* ---------- routing ---------- */
function route(){
  const v=(location.hash||"#quiz").slice(1);
  document.querySelectorAll("nav button").forEach(b=>{b.setAttribute("aria-current",b.dataset.view===v?"page":"false");if(b.dataset.view===v){const n=b.parentElement;n.scrollLeft=b.offsetLeft-n.clientWidth/2+b.offsetWidth/2}});
  stopTimer();if(v==="regulering")theory();else if(v==="eksamen")eksamen();else if(v==="muntlig")muntlig();else if(v==="feilsoking")feilsok();else if(v==="kalkulatorer")calcs();else if(v==="tfm")tfm();else if(v==="symboler")symboler();else if(v==="ordliste")ordliste();else if(v==="kabel")cable();else if(v==="tips")tips();else if(v==="prosjekt")project();else if(v==="les")les();else{ if(run&&run.i<run.list.length&&!run.done)ask();else home(); }
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.view});
window.addEventListener("hashchange",()=>{route();window.scrollTo(0,0)});

/* ---------- quiz ---------- */
function home(){
  run=null;
  const st=store.get("stats")||{}, missed=(store.get("missed")||[]).filter(id=>Q[id]);
  const pool=Q.filter(q=>sel.has(q.c)).length;
  const statRows=cats.map(c=>{const s=st[c];if(!s)return"";const p=Math.round(s.ok/s.n*100);return `<span>${c}</span><span class="muted">${s.ok}/${s.n} · ${p} %</span><div class="bar"><i style="width:${p}%"></i></div>`}).join("");
  app.innerHTML=`
  <section class="sec"><div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Velg temaer</h2>
    <span class="row"><button class="linkish" id="all">Alle</button><button class="linkish" id="none">Ingen</button></span></div>
    <div class="chips">${cats.map(c=>`<button class="chip" aria-pressed="${sel.has(c)}" data-c="${c}"><span class="dot"></span>${c} <small>${Q.filter(q=>q.c===c).length}</small></button>`).join("")}</div>
  </section>
  <section class="sec"><h2>Antall spørsmål</h2>
    <div class="chips">${[10,20,40,80,0].map(n=>`<button class="chip" aria-pressed="${count===n}" data-n="${n}"><span class="dot"></span>${n||"Alle ("+pool+")"}</button>`).join("")}</div>
  </section>
  <div class="row sec">
    <button class="btn" id="start" ${pool?"":"disabled"}>Start quiz</button>
    ${missed.length?`<button class="btn ghost" id="miss">Øv på feil (${missed.length})</button>`:""}
  </div>
  <p class="muted sec">${Q.length} spørsmål totalt.</p>
  ${statRows?`<div class="card sec"><h2>Din fremgang</h2><div class="stat">${statRows}</div><button class="linkish" id="reset">Nullstill fremgang</button></div>`:""}`;
  app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const c=b.dataset.c;sel.has(c)?sel.delete(c):sel.add(c);home()});
  app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{count=+b.dataset.n;home()});
  document.getElementById("all").onclick=()=>{sel=new Set(cats);home()};
  document.getElementById("none").onclick=()=>{sel=new Set();home()};
  document.getElementById("start").onclick=()=>{let p=shuffle(Q.filter(q=>sel.has(q.c)));if(count)p=p.slice(0,count);start(p)};
  const m=document.getElementById("miss");if(m)m.onclick=()=>start(shuffle(missed.map(id=>Q[id])));
  const r=document.getElementById("reset");if(r)r.onclick=()=>{store.set("stats",{});store.set("missed",[]);home()};
}
function start(list){run={list:list.map(q=>({q,order:shuffle([0,1,2,3])})),i:0,res:[]};ask();window.scrollTo(0,0)}
function lamps(){return `<div class="lamps" aria-hidden="true">${run.list.map((_,k)=>`<span class="lamp ${run.res[k]===true?"ok":run.res[k]===false?"bad":k===run.i?"cur":""}"></span>`).join("")}</div>`}
function ask(){
  const {q,order}=run.list[run.i];
  app.innerHTML=`${lamps()}
  <div class="card">
    <div class="meta"><span>${q.c}</span><span>${run.i+1} av ${run.list.length}</span></div>
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${order.map((o,k)=>`<button class="opt" data-o="${o}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.a[o])}</span></button>`).join("")}</div>
    <div id="after"></div>
  </div>
  <p class="muted" style="margin-top:14px"><button class="linkish" id="quit">Avslutt og se resultat</button></p>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.o));
  document.getElementById("quit").onclick=result;
  if(run.res[run.i]!==undefined)answer(run.picked[run.i],true);
}
function answer(o,replay){
  const {q}=run.list[run.i], ok=o===q.r;
  run.res[run.i]=ok;(run.picked=run.picked||[])[run.i]=o;
  app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;const v=+b.dataset.o;if(v===q.r)b.classList.add("right");else if(v===o)b.classList.add("wrong")});
  if(!replay){
    const st=store.get("stats")||{};const s=st[q.c]||{ok:0,n:0};s.n++;if(ok)s.ok++;st[q.c]=s;store.set("stats",st);
    const m=new Set(store.get("missed")||[]);ok?m.delete(q.id):m.add(q.id);store.set("missed",[...m]);
  }
  const last=run.i===run.list.length-1;
  document.getElementById("after").innerHTML=`
    <div class="fb ${ok?"":"no"}" role="status"><strong>${ok?"Riktig":"Feil – riktig svar: "+esc(q.a[q.r])}</strong>${esc(LX(q))}</div>
    <div class="next"><span class="muted">${run.res.filter(x=>x).length} riktige så langt</span><button class="btn" id="nx">${last?"Se resultat":"Neste spørsmål"}</button></div>`;
  app.querySelector(".lamps").outerHTML=lamps();
  const nx=document.getElementById("nx");nx.focus({preventScroll:true});
  nx.onclick=()=>{if(last)result();else{run.i++;ask();window.scrollTo(0,0)}};
}
function result(){
  run.done=true;
  const done=run.res.filter(x=>x!==undefined).length, ok=run.res.filter(x=>x).length;
  const pct=done?Math.round(ok/done*100):0;
  const wrong=run.list.filter((_,k)=>run.res[k]===false);
  const msg=pct>=85?"Sterkt. Du er godt forberedt på disse temaene.":pct>=60?"Bra grunnlag. Gå gjennom forklaringene på det du bommet på.":"Øv mer på disse temaene, og bruk «Øv på feil» for å repetere.";
  app.innerHTML=`${lamps()}
  <div class="card sec"><div class="score">${ok}/${done}</div><p style="margin:6px 0 0">${pct} % riktig. ${msg}</p></div>
  <div class="row sec"><button class="btn" id="again">Ny quiz</button>${wrong.length?`<button class="btn ghost" id="redo">Ta feilene på nytt</button>`:""}</div>
  ${wrong.length?`<section class="card"><h2>Gå gjennom feilene</h2><div class="review">${wrong.map(({q})=>`<div class="item"><p><strong>${esc(q.q)}</strong></p><p>Riktig: ${esc(q.a[q.r])}</p><p class="muted">${esc(LX(q))}</p></div>`).join("")}</div></section>`:""}`;
  document.getElementById("again").onclick=()=>{home();window.scrollTo(0,0)};
  const r=document.getElementById("redo");if(r)r.onclick=()=>start(shuffle(wrong.map(x=>x.q)));
  window.scrollTo(0,0);
}

/* ---------- theory ---------- */
const F=(a,b)=>`<span class="frac"><span>${a}</span><span>${b}</span></span>`;
const K="<var>K</var>",T="<var>T</var>",TAU="<var>τ</var>",KP="<var>K</var><sub>p</sub>",TI="<var>T</var><sub>i</sub>",TD="<var>T</var><sub>d</sub>",TC="<var>T</var><sub>c</sub>",KPK="<var>K</var><sub>pk</sub>",TK="<var>T</var><sub>k</sub>";
function theory(){
  app.innerHTML=`
  <div class="card sec prose">
    <h2>Reguleringsteknikk</h2>
    <p>En live simulator du kan leke med, ligningene du trenger, metodene for å stille inn en PID‑regulator, og en kalkulator som regner ut parameterne.</p>
    <div class="toc"><a href="#t-live">Live simulator</a><a href="#t-beg">Begreper</a><a href="#t-pid">PID‑ligningen</a><a href="#t-mod">Prosessmodell</a><a href="#t-zn1">Ziegler–Nichols 1</a><a href="#t-zn2">Ziegler–Nichols 2</a><a href="#t-sk">Skogestad</a><a href="#t-gg">Good Gain</a><a href="#t-dis">PID i PLS</a><a href="#t-calc">Kalkulator</a></div>
  </div>
${LV_HTML}
  <section class="card sec prose" id="t-beg">
    <h2>Begreper</h2>
    <div class="tbl"><table>
      <tr><th>Symbol</th><th>Navn</th><th>Betydning</th></tr>
      <tr><td>SP</td><td>Settpunkt</td><td>Ønsket verdi</td></tr>
      <tr><td>PV</td><td>Prosessverdi</td><td>Målt verdi</td></tr>
      <tr><td><var>e</var></td><td>Avvik</td><td><var>e</var> = SP − PV</td></tr>
      <tr><td><var>u</var> (MV/OP)</td><td>Pådrag</td><td>Regulatorens utgang til ventil, FO osv.</td></tr>
      <tr><td>${KP}</td><td>Forsterkning</td><td>Hvor kraftig regulatoren reagerer på avviket</td></tr>
      <tr><td>${TI}</td><td>Integraltid</td><td>Kortere ${TI} = sterkere I‑virkning</td></tr>
      <tr><td>${TD}</td><td>Derivattid</td><td>Lengre ${TD} = sterkere D‑virkning</td></tr>
      <tr><td>${K}</td><td>Prosessforsterkning</td><td>Endring i PV delt på endring i pådrag</td></tr>
      <tr><td>${T}</td><td>Tidskonstant</td><td>Tid til 63 % av endringen</td></tr>
      <tr><td>${TAU}</td><td>Dødtid</td><td>Tid før PV begynner å reagere</td></tr>
    </table></div>
    <p>Proporsjonalbånd brukes på noen regulatorer i stedet for ${KP}: PB = 100 / ${KP} %.</p>
  </section>

  <section class="card sec prose" id="t-pid">
    <h2>PID‑ligningen</h2>
    <p>Standardformen (ideell/ISA‑form), slik de fleste PLS‑er og regulatorer bruker den:</p>
    <div class="eq"><var>u</var>(<var>t</var>) = <var>u</var><sub>0</sub> + ${KP}·<var>e</var>(<var>t</var>) + ${F(KP,TI)}∫<var>e</var> d<var>t</var> + ${KP}·${TD}·${F("d<var>e</var>","d<var>t</var>")}</div>
    <p>Som overføringsfunksjon (Laplace):</p>
    <div class="eq"><var>H</var><sub>r</sub>(<var>s</var>) = ${KP} · ( 1 + ${F("1",TI+"<var>s</var>")} + ${TD}<var>s</var> )</div>
    <ul>
      <li><strong>P‑leddet</strong> gir pådrag proporsjonalt med avviket. Alene gir det et stasjonært avvik.</li>
      <li><strong>I‑leddet</strong> summerer avviket over tid og fjerner stasjonært avvik. For kort ${TI} gir svingninger.</li>
      <li><strong>D‑leddet</strong> reagerer på hvor fort avviket endrer seg og demper oversving, men forsterker støy. Mange regulatorer deriverer PV i stedet for <var>e</var> for å unngå et hopp ved settpunktendring.</li>
    </ul>
    <p>Parallellform brukes også: <var>u</var> = <var>K</var><sub>p</sub><var>e</var> + <var>K</var><sub>i</sub>∫<var>e</var> d<var>t</var> + <var>K</var><sub>d</sub> d<var>e</var>/d<var>t</var>. Da er <var>K</var><sub>i</sub> = ${F(KP,TI)} og <var>K</var><sub>d</sub> = ${KP}·${TD}. Sjekk alltid hvilken form regulatoren din bruker.</p>
  </section>

  <section class="card sec prose" id="t-mod">
    <h2>Prosessmodell fra sprangrespons</h2>
    <p>De fleste prosesser kan tilnærmes som en førsteordens prosess med dødtid. Sett regulatoren i manuell, gjør et sprang i pådraget Δ<var>u</var> og logg PV.</p>
    <div class="eq"><var>H</var><sub>p</sub>(<var>s</var>) = ${F(K+"·<var>e</var><sup>−"+"<var>τs</var></sup>",T+"<var>s</var> + 1")}</div>
    <div id="stepfig"></div>
    <ul>
      <li>${K} = ${F("Δ<var>y</var>","Δ<var>u</var>")}, gjerne i %/% av måleområdet.</li>
      <li>${TAU} = tiden fra spranget til PV begynner å endre seg.</li>
      <li>${T} = tiden fra PV begynner å endre seg til den har nådd 63 % av total endring.</li>
    </ul>
    <p>Responsen etter dødtiden: <var>y</var>(<var>t</var>) = ${K}·Δ<var>u</var>·(1 − <var>e</var><sup>−(<var>t</var>−<var>τ</var>)/<var>T</var></sup>). Etter 1${T} er den på 63 %, etter 3${T} 95 % og etter 5${T} over 99 %.</p>
    <p><strong>Integrerende prosess</strong> (f.eks. nivå): PV stiger med konstant hastighet etter spranget. Modellen blir <var>H</var><sub>p</sub>(<var>s</var>) = <var>K</var><sub>i</sub><var>e</var><sup>−<var>τs</var></sup>/<var>s</var>, der <var>K</var><sub>i</sub> = stigningstall / Δ<var>u</var>.</p>
    <p class="note">For Ziegler–Nichols’ sprangresponsmetode bruker mange tangentmetoden: tegn tangenten i vendepunktet. Der den krysser startverdien er ${TAU}, og ${T} er tiden fra ${TAU} til tangenten når sluttverdien.</p>
  </section>

  <section class="card sec prose" id="t-zn1">
    <h2>Ziegler–Nichols metode 1: sprangrespons (åpen sløyfe)</h2>
    <p>Regulatoren står i manuell. Gjør et sprang i pådraget, finn ${K}, ${T} og ${TAU} fra responsen og bruk tabellen.</p>
    <div class="tbl"><table>
      <tr><th>Regulator</th><th>${KP}</th><th>${TI}</th><th>${TD}</th></tr>
      <tr><td>P</td><td>${F(T,K+"·"+TAU)}</td><td>∞</td><td>0</td></tr>
      <tr><td>PI</td><td>0,9 · ${F(T,K+"·"+TAU)}</td><td>3,33 · ${TAU}</td><td>0</td></tr>
      <tr><td>PID</td><td>1,2 · ${F(T,K+"·"+TAU)}</td><td>2 · ${TAU}</td><td>0,5 · ${TAU}</td></tr>
    </table></div>
    <p>Fordel: anlegget trenger ikke å svinge. Ulempe: gir ganske aggressiv regulering (kvart amplitude‑dempning), og fungerer dårlig når ${TAU} er veldig liten i forhold til ${T}.</p>
    <p class="note">Noen lærebøker nummererer metodene motsatt. Lær navnene: sprangresponsmetoden og svingemetoden.</p>
  </section>

  <section class="card sec prose" id="t-zn2">
    <h2>Ziegler–Nichols metode 2: svingemetoden (lukket sløyfe)</h2>
    <ol>
      <li>Sett regulatoren i automatisk med bare P‑ledd (${TI} = ∞, ${TD} = 0).</li>
      <li>Øk ${KP} gradvis og gi små settpunktsprang til PV svinger med jevn amplitude, verken voksende eller avtagende.</li>
      <li>Les av kritisk forsterkning ${KPK} og periodetiden ${TK} for svingningene.</li>
      <li>Regn ut parametrene fra tabellen.</li>
    </ol>
    <div class="tbl"><table>
      <tr><th>Regulator</th><th>${KP}</th><th>${TI}</th><th>${TD}</th></tr>
      <tr><td>P</td><td>0,5 · ${KPK}</td><td>∞</td><td>0</td></tr>
      <tr><td>PI</td><td>0,45 · ${KPK}</td><td>${F(TK,"1,2")}</td><td>0</td></tr>
      <tr><td>PID</td><td>0,6 · ${KPK}</td><td>${F(TK,"2")}</td><td>${F(TK,"8")}</td></tr>
    </table></div>
    <p>Fordel: trenger ingen modell. Ulempe: prosessen må tåle å svinge på stabilitetsgrensen, noe som ofte ikke er akseptabelt i et anlegg i drift.</p>
  </section>

  <section class="card sec prose" id="t-sk">
    <h2>Skogestad‑metoden (SIMC)</h2>
    <p>Modellbasert metode fra Sigurd Skogestad (NTNU). Du bruker samme modell som i sprangresponsmetoden, men velger selv hvor rask lukket sløyfe skal være med ${TC}.</p>
    <h3>Førsteordens prosess med dødtid – PI</h3>
    <div class="eq">${KP} = ${F(T,K+"·("+TC+" + "+TAU+")")} &nbsp;&nbsp;&nbsp; ${TI} = min( ${T} , 4·(${TC} + ${TAU}) )</div>
    <h3>Integrerende prosess – PI</h3>
    <div class="eq">${KP} = ${F("1","<var>K</var><sub>i</sub>·("+TC+" + "+TAU+")")} &nbsp;&nbsp;&nbsp; ${TI} = 4·(${TC} + ${TAU})</div>
    <h3>Andre ordens prosess med dødtid – PID (serieform)</h3>
    <div class="eq">${KP} = ${F(T+"<sub>1</sub>",K+"·("+TC+" + "+TAU+")")} &nbsp;&nbsp; ${TI} = min( ${T}<sub>1</sub> , 4·(${TC} + ${TAU}) ) &nbsp;&nbsp; ${TD} = ${T}<sub>2</sub></div>
    <ul>
      <li><strong>Valg av ${TC}:</strong> start med ${TC} = ${TAU}. Det gir rask og robust regulering. Øk ${TC} for roligere pådrag.</li>
      <li>Hvis ${TAU} ≈ 0, velg ${TC} ut fra hvor raskt du ønsker at sløyfa skal være, f.eks. ${TC} = ${T}/2.</li>
      <li>Min‑funksjonen i ${TI} gjør at prosesser med lang tidskonstant ikke får for treg I‑virkning.</li>
    </ul>
    <p>Fordel: én parameter å justere, gir god robusthet, og prosessen trenger ikke svinge. Mye brukt i norsk industri og undervisning.</p>
  </section>

  <section class="card sec prose" id="t-gg">
    <h2>Good Gain‑metoden (bonus)</h2>
    <p>Eksperimentell metode fra Finn Haugen som er vanlig i norsk undervisning. Den er skånsom fordi prosessen ikke skal svinge vedvarende.</p>
    <ol>
      <li>Kjør med bare P‑ledd. Øk ${KP} til et settpunktsprang gir ett tydelig oversving og et lite undersving. Det er <var>K</var><sub>pGG</sub>.</li>
      <li>Mål tiden <var>T</var><sub>ou</sub> mellom toppen av oversvinget og bunnen av undersvinget.</li>
      <li>${KP} = 0,8 · <var>K</var><sub>pGG</sub>, ${TI} = 1,5 · <var>T</var><sub>ou</sub>, og eventuelt ${TD} = ${TI} / 4.</li>
    </ol>
  </section>

  <section class="card sec prose" id="t-dis">
    <h2>PID i PLS (diskret form)</h2>
    <p>En PLS regner ut PID med fast samplingstid <var>h</var>. Hastighetsformen (inkrementell) er vanlig fordi den gir enkel anti‑windup og støtfri overgang:</p>
    <div class="eq">Δ<var>u</var><sub><var>k</var></sub> = ${KP}·[ (<var>e</var><sub><var>k</var></sub> − <var>e</var><sub><var>k</var>−1</sub>) + ${F("<var>h</var>",TI)}<var>e</var><sub><var>k</var></sub> + ${F(TD,"<var>h</var>")}(<var>e</var><sub><var>k</var></sub> − 2<var>e</var><sub><var>k</var>−1</sub> + <var>e</var><sub><var>k</var>−2</sub>) ]</div>
    <div class="eq"><var>u</var><sub><var>k</var></sub> = <var>u</var><sub><var>k</var>−1</sub> + Δ<var>u</var><sub><var>k</var></sub> &nbsp;&nbsp; (begrenset til 0–100 %)</div>
    <ul>
      <li>Kjør regulatoren i en syklisk avbruddsblokk (f.eks. OB30/OB35 i Siemens) slik at <var>h</var> er konstant.</li>
      <li>Velg <var>h</var> mye mindre enn prosessens tidskonstant, typisk ${T}/10 eller raskere.</li>
      <li>Husk virkningsretning: direkte (pådrag øker når PV øker) eller revers.</li>
    </ul>
  </section>

  <section class="card sec prose" id="t-calc">
    <h2>Kalkulator og simulering</h2>
    <p>Fyll inn modellen fra sprangresponsen. Tider i sekunder, ${K} i %/%.</p>
    <div class="grid2">
      <label class="f"><span>${K} (forsterkning)</span><input type="number" step="any" id="cK" value="1"></label>
      <label class="f"><span>${T} (tidskonstant)</span><input type="number" step="any" id="cT" value="20"></label>
      <label class="f"><span>${TAU} (dødtid)</span><input type="number" step="any" id="cTau" value="5"></label>
      <label class="f"><span>${TC} (Skogestad)</span><input type="number" step="any" id="cTc" value="5"></label>
      <label class="f"><span>${KPK} (svingemetode)</span><input type="number" step="any" id="cKpk" value=""></label>
      <label class="f"><span>${TK} (svingemetode)</span><input type="number" step="any" id="cTk" value=""></label>
    </div>
    <p class="row" style="margin-top:10px"><button class="btn ghost sm" id="calcKu">Beregn ${KPK} og ${TK} fra modellen</button><button class="btn ghost sm" id="tcTau">Sett ${TC} = ${TAU}</button></p>
    <div class="tbl"><table id="res"></table></div>
    <h3>Sammenlign innstillingene</h3>
    <label class="f" style="max-width:320px"><span>Innstilling</span><select id="simSel"></select></label>
    <canvas id="sim" aria-label="Simulering av lukket sløyfe" style="margin-top:10px"></canvas>
    <div class="legend"><span><i style="background:var(--signal)"></i>Settpunkt</span><span><i style="background:var(--ink)"></i>Prosessverdi</span><span><i style="background:var(--u)"></i>Pådrag</span></div>
    <p class="muted" style="margin-top:8px">Settpunktet hopper fra 0 til 1 ved start. Halvveis kommer en forstyrrelse på −0,5 i pådraget.</p>
  </section>`;
  stepFig();
  ["cK","cT","cTau","cTc","cKpk","cTk"].forEach(id=>document.getElementById(id).addEventListener("input",calc));
  document.getElementById("simSel").addEventListener("change",draw);

function ultimate(K,T,tau){
  if(!(K>0)||!(T>=0)||!(tau>0))return null;
  const ph=w=>-Math.atan(w*T)-w*tau;
  let lo=1e-9,hi=Math.PI/tau;
  for(let i=0;i<100;i++){const m=(lo+hi)/2;ph(m)>-Math.PI?lo=m:hi=m}
  const w=(lo+hi)/2;return{Ku:Math.sqrt(1+(w*T)**2)/K,Pu:2*Math.PI/w};
}
let tunings=[];
function calc(){
  const cK=$("cK"),cT=$("cT"),cTau=$("cTau"),cTc=$("cTc"),cKpk=$("cKpk"),cTk=$("cTk"),res=$("res"),simSel=$("simSel");
  const K=+cK.value,T=+cT.value,tau=+cTau.value,Tc=+cTc.value,Kpk=+cKpk.value,Tk=+cTk.value;
  tunings=[];
  if(K>0&&T>0&&tau>0){
    tunings.push({n:"ZN1 PI",Kp:0.9*T/(K*tau),Ti:tau/0.3,Td:0});
    tunings.push({n:"ZN1 PID",Kp:1.2*T/(K*tau),Ti:2*tau,Td:0.5*tau});
  }
  if(Kpk>0&&Tk>0){
    tunings.push({n:"ZN2 PI",Kp:0.45*Kpk,Ti:Tk/1.2,Td:0});
    tunings.push({n:"ZN2 PID",Kp:0.6*Kpk,Ti:Tk/2,Td:Tk/8});
  }
  if(K>0&&T>0&&tau>=0&&Tc>0){
    tunings.push({n:"Skogestad PI",Kp:T/(K*(Tc+tau)),Ti:Math.min(T,4*(Tc+tau)),Td:0});
  }
  const f=v=>v===0?"–":(+v.toPrecision(3)).toLocaleString("nb-NO");
  res.innerHTML=`<tr><th>Metode</th><th>Kp</th><th>Ti (s)</th><th>Td (s)</th></tr>`+(tunings.length?tunings.map(t=>`<tr><td>${t.n}</td><td>${f(t.Kp)}</td><td>${f(t.Ti)}</td><td>${f(t.Td)}</td></tr>`).join(""):`<tr><td colspan="4" class="muted">Fyll inn K, T og τ (alle større enn 0) for å få resultater.</td></tr>`);
  const prevName=simSel.selectedOptions[0]?simSel.selectedOptions[0].text:"";
  simSel.innerHTML=tunings.map((t,i)=>`<option value="${i}">${t.n}</option>`).join("");
  let si=tunings.findIndex(t=>t.n===prevName);if(si<0)si=tunings.findIndex(t=>t.n==="Skogestad PI");if(si<0)si=0;
  simSel.value=String(si);
  draw();
}
function simulate(K,T,tau,t){
  const tend=Math.max(12*(T+tau),1);
  let dt=Math.min((T+tau)/400,T/20,tau>0?tau/20:Infinity);
  if(tend/dt>30000)dt=tend/30000;
  const nd=Math.round(tau/dt),buf=new Array(nd).fill(0);
  let y=0,I=0,yp=0;const out=[];const N=Math.ceil(tend/dt),every=Math.max(1,Math.floor(N/600));
  for(let k=0;k<=N;k++){
    const time=k*dt,sp=1,d=time>=tend/2?-0.5:0,e=sp-y;
    I+=e*dt;const D=t.Td?-t.Td*(y-yp)/dt:0;yp=y;
    let u=t.Kp*(e+I/t.Ti+D);u=Math.max(-20,Math.min(20,u));
    buf.push(u+d);const ud=buf.shift();
    y+=dt*(K*ud-y)/T;
    if(k%every===0)out.push([time,sp,y,u]);
  }
  return{out,tend};
}
function draw(){
  const cK=$("cK"),cT=$("cT"),cTau=$("cTau"),simSel=$("simSel");
  const cv=document.getElementById("sim");if(!cv)return;
  const dpr=window.devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;
  cv.width=w*dpr;cv.height=h*dpr;const g=cv.getContext("2d");g.scale(dpr,dpr);g.clearRect(0,0,w,h);
  const t=tunings[+simSel.value];
  g.font="13px Barlow, sans-serif";g.fillStyle=css("--muted");
  if(!t){g.fillText("Ingen innstilling å simulere ennå.",14,24);return}
  const K=+cK.value,T=+cT.value,tau=+cTau.value;
  const {out,tend}=simulate(K,T,tau,t);
  let ymax=1.2,ymin=-0.1;out.forEach(p=>{ymax=Math.max(ymax,p[2],p[3]);ymin=Math.min(ymin,p[2],p[3])});
  ymax=Math.min(ymax*1.05,4);ymin=Math.max(ymin,-2);
  const L=36,R=10,Tp=10,B=24,X=x=>L+(w-L-R)*x/tend,Y=y=>Tp+(h-Tp-B)*(1-(y-ymin)/(ymax-ymin));
  g.strokeStyle=css("--line");g.lineWidth=1;
  [0,0.5,1,1.5,2,2.5,3].filter(v=>v>=ymin&&v<=ymax).forEach(v=>{g.beginPath();g.moveTo(L,Y(v));g.lineTo(w-R,Y(v));g.stroke();g.fillText(String(v).replace(".",","),6,Y(v)+4)});
  g.fillText("0 s",L,h-6);g.textAlign="right";g.fillText(Math.round(tend)+" s",w-R,h-6);g.textAlign="left";
  const line=(i,col,wd)=>{g.strokeStyle=col;g.lineWidth=wd;g.beginPath();out.forEach((p,k)=>{const y=Math.max(ymin,Math.min(ymax,p[i]));k?g.lineTo(X(p[0]),Y(y)):g.moveTo(X(p[0]),Y(y))});g.stroke()};
  line(1,css("--signal"),2);line(3,css("--u"),1.5);line(2,css("--ink"),2.5);
}

  const loop=2*rho*L/S, Uk=U; // feilsløyfe: to ledere
  const Zs=IkminF>0?Uk/IkminF:NaN, IkEnd=Uk/(Zs+loop);
  if(m)add(IkEnd>=m*In,"Momentan utkobling i enden av kursen",`Ik min ≈ ${f(IkEnd,0)} A, krav ${m} · In = ${f(m*In,0)} A`);
  else add(null,"Utkobling ved minste kortslutningsstrøm",`Ik min ≈ ${f(IkEnd,0)} A. Sjekk utkoblingstid i sikringens tid/strøm‑kurve.`);
  const kS2=k*k*S*S;
  add(I2t<=kS2,"I²t ≤ k² · S²",`${f(I2t,0)} A²s ≤ ${f(kS2,0)} A²s`);
  const du=(ph==="3"?Math.sqrt(3):2)*Ib*L*rho/S, duMax=U*pct/100, duPct=du/U*100;
  add(du<=duMax,`Spenningsfall ≤ ${pct} %`,`ΔU = ${f(du,2)} V (${f(duPct,2)} %), maks ${f(duMax,2)} V`);
  const Lmax=duMax*S/((ph==="3"?Math.sqrt(3):2)*rho*Ib);
  const allOk=!rows.some(r=>r.includes("lamp bad"));
  $("kOut").innerHTML=`<p class="out" style="margin:0 0 6px;color:var(${allOk?"--ok":"--bad"})">${allOk?"Kursen er OK":"Kursen oppfyller ikke alle krav"}</p>
  <p class="muted" style="margin:0 0 8px">Maks lengde for spenningsfall ved Ib: ${f(Lmax,0)} m</p>${rows.join("")}`;
}

function tips(){
  const tc=[...new Set(TIPS.map(t=>t[0]))];
  app.innerHTML=`
  <div class="card sec prose">
    <h2>Tips og triks</h2>
    <p>Lærdommer fra feltet som er greit å ha med seg, både på fagprøven og i jobben etterpå.</p>
    <div class="row"><input type="search" id="tq" placeholder="Søk i tipsene" aria-label="Søk i tipsene" style="flex:1;min-width:180px;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px"><button class="btn sm" id="trand">Tilfeldig tips</button></div>
    <div id="tshow"></div>
  </div>
  <div id="tlist"></div>`;
  const list=$("tlist");
  const render=q=>{
    q=(q||"").toLowerCase().trim();
    const html=tc.map(c=>{
      const items=TIPS.filter(t=>t[0]===c&&(!q||(t[1]+" "+t[2]).toLowerCase().includes(q)));
      if(!items.length)return"";
      return `<details class="card sec tip" ${q?"open":""}><summary><span>${c}</span><small class="muted">${items.length}</small></summary>${items.map(t=>`<div class="tipi"><b>${t[1]}</b><p>${t[2]}</p></div>`).join("")}</details>`;
    }).join("");
    list.innerHTML=html||`<div class="empty">Ingen tips matcher søket. Prøv et annet ord.</div>`;
  };
  $("tq").oninput=e=>render(e.target.value);
  $("trand").onclick=()=>{const t=TIPS[Math.floor(Math.random()*TIPS.length)];$("tshow").innerHTML=`<div class="note" style="margin-top:14px"><span class="muted">${t[0]}</span><br><b>${t[1]}</b><br>${t[2]}</div>`};
  render("");
}

let oral=null;
function muntlig(){
  const st=store.get("oral")||{};
  const known=Object.values(st).filter(v=>v===1).length;
  if(!oral){
    app.innerHTML=`<div class="card sec prose"><h2>Muntlig øving</h2>
    <p>Prøvenemnda spør ofte hvorfor du gjorde som du gjorde. Les spørsmålet, svar høyt eller i hodet, og trykk så på «Vis stikkord». Vær ærlig når du vurderer deg selv.</p>
    <p class="muted">${ORAL.length} spørsmål · ${known} markert som «kunne det»</p>
    <div class="row"><button class="btn" id="oAll">Start med alle</button>${Object.values(st).some(v=>v===0)?`<button class="btn ghost" id="oWeak">Bare de jeg må øve på</button>`:""}<button class="linkish" id="oReset">Nullstill</button></div></div>`;
    $("oAll").onclick=()=>{oral={list:shuffle(ORAL.map((_,i)=>i)),i:0,shown:false};muntlig()};
    const w=$("oWeak");if(w)w.onclick=()=>{oral={list:shuffle(ORAL.map((_,i)=>i).filter(i=>st[i]===0)),i:0,shown:false};muntlig()};
    $("oReset").onclick=()=>{store.set("oral",{});muntlig()};
    return;
  }
  if(oral.i>=oral.list.length){
    app.innerHTML=`<div class="card sec prose"><h2>Ferdig</h2><p>Du har gått gjennom ${oral.list.length} spørsmål. ${known} av ${ORAL.length} er markert som «kunne det».</p><div class="row"><button class="btn" id="oBack">Tilbake</button></div></div>`;
    $("oBack").onclick=()=>{oral=null;muntlig()};return;
  }
  const idx=oral.list[oral.i],[q,pts]=ORAL[idx];
  app.innerHTML=`<div class="card sec">
    <div class="meta"><span>Muntlig</span><span>${oral.i+1} av ${oral.list.length}</span></div>
    <p class="q">${esc(q)}</p>
    ${oral.shown?`<div class="fb" style="background:var(--eq);border-color:var(--signal)"><strong>Stikkord for et godt svar</strong><ul style="margin:6px 0 0;padding-left:1.2em">${pts.map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>
    <div class="row" style="margin-top:14px"><button class="btn" id="oYes">Kunne det</button><button class="btn ghost" id="oNo">Må øve mer</button></div>`
    :`<button class="btn" id="oShow">Vis stikkord</button>`}
  </div><p class="muted"><button class="linkish" id="oQuit">Avslutt</button></p>`;
  const mark=v=>{const s=store.get("oral")||{};s[idx]=v;store.set("oral",s);oral.i++;oral.shown=false;muntlig();window.scrollTo(0,0)};
  if(oral.shown){$("oYes").onclick=()=>mark(1);$("oNo").onclick=()=>mark(0)}else $("oShow").onclick=()=>{oral.shown=true;muntlig()};
  $("oQuit").onclick=()=>{oral=null;muntlig()};
}

let cs=null;
function feilsok(){
  if(!cs){
    app.innerHTML=`<div class="card sec prose"><h2>Feilsøkingscaser</h2><p>Velg en case. Du får en situasjon og velger neste steg. Feil valg forklares, så du kan prøve igjen.</p></div>
    ${CASES.map((c,i)=>`<button class="card sec opt" style="width:100%;display:block" data-c="${i}"><b>${c.t}</b><br><span class="muted">${c.intro}</span></button>`).join("")}`;
    app.querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{cs={c:+b.dataset.c,s:0,tried:[],done:false,miss:0};feilsok();window.scrollTo(0,0)});
    return;
  }
  const c=CASES[cs.c];
  const hist=c.steps.slice(0,cs.s).map(st=>{const g=st.o.find(o=>o[1]);return `<div class="tipi" style="padding-left:0;padding-right:0"><span class="muted">${st.p}</span><br><b>${g[0]}</b><p>${g[2]}</p></div>`}).join("");
  let body="";
  if(cs.s<c.steps.length){
    const st=c.steps[cs.s];
    body=`<p class="q" style="margin-top:14px">${st.p}</p><div class="opts">${st.o.map((o,k)=>{const t=cs.tried.includes(k);return `<button class="opt ${t?(o[1]?"right":"wrong"):""}" data-k="${k}" ${t?"disabled":""}><span class="k">${"ABCD"[k]}</span><span>${o[0]}${t&&!o[1]?`<br><small class="muted">${o[2]}</small>`:""}</span></button>`}).join("")}</div>`;
  }else{
    body=`<div class="fb" style="margin-top:14px"><strong>Case løst${cs.miss?` med ${cs.miss} feil valg`:" uten feil valg"}</strong>${c.end}</div><div class="row" style="margin-top:14px"><button class="btn" id="csBack">Flere caser</button></div>`;
  }
  app.innerHTML=`<div class="card sec"><div class="meta"><span>Feilsøking</span><span>Steg ${Math.min(cs.s+1,c.steps.length)} av ${c.steps.length}</span></div>
  <h2>${c.t}</h2><p style="margin:0 0 6px">${c.intro}</p>${hist}${body}</div><p class="muted"><button class="linkish" id="csQuit">Avslutt case</button></p>`;
  app.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{const k=+b.dataset.k,o=c.steps[cs.s].o[k];if(o[1]){cs.s++;cs.tried=[]}else{cs.tried.push(k);cs.miss++}feilsok()});
  const bk=$("csBack");if(bk)bk.onclick=()=>{cs=null;feilsok();window.scrollTo(0,0)};
  $("csQuit").onclick=()=>{cs=null;feilsok()};
}
/* ---------- kalkulatorer ---------- */
function calcs(){
  const inp=(id,label,val="")=>`<label class="f"><span>${label}</span><input type="number" step="any" inputmode="decimal" id="${id}" value="${val}"></label>`;
  app.innerHTML=`
  <div class="card sec prose"><h2>Kalkulatorer</h2><p>Regnestykkene du bruker oftest i felt. Feltene regner begge veier: skriv i det ene, så oppdateres det andre.</p>
  <div class="toc"><a href="#c1">4–20 mA</a><a href="#c2">Siemens råverdi</a><a href="#c3">Ohms lov</a><a href="#c4">Trefase</a><a href="#c5">Motor</a><a href="#c6">Trykk</a><a href="#c7">Temperatur</a><a href="#c8">PT100</a><a href="#c9">Varmeeffekt</a><a href="#c10">Spenningsfall</a></div></div>
  <section class="card sec prose" id="c1"><h2>4–20 mA ↔ måleverdi</h2>
    <div class="grid2">${inp("a_lrv","Nedre verdi (LRV)",0)}${inp("a_urv","Øvre verdi (URV)",100)}</div>
    <div class="grid2" style="margin-top:10px">${inp("a_ma","Signal (mA)",12)}${inp("a_val","Måleverdi",50)}${inp("a_pct","Prosent av område",50)}</div>
    <p class="muted" style="margin-top:8px">Verdi = LRV + (mA − 4) / 16 · (URV − LRV)</p></section>
  <section class="card sec prose" id="c2"><h2>Siemens analog råverdi</h2>
    <div class="grid2">${inp("s_raw","Råverdi (0–27648)",13824)}${inp("s_pct","Prosent",50)}${inp("s_ma","mA (4–20)",12)}</div>
    <p class="muted" style="margin-top:8px">Nominelt område 0–27648. Over 27648 er overstyring, 32767 betyr overløp eller brudd.</p></section>
  <section class="card sec prose" id="c3"><h2>Ohms lov og effekt</h2>
    <p class="muted">Fyll inn to av verdiene og trykk «Regn ut».</p>
    <div class="grid2">${inp("o_u","Spenning U (V)")}${inp("o_i","Strøm I (A)")}${inp("o_r","Motstand R (Ω)")}${inp("o_p","Effekt P (W)")}</div>
    <div class="row" style="margin-top:10px"><button class="btn sm" id="o_go">Regn ut</button><button class="btn ghost sm" id="o_clr">Tøm</button><span class="muted" id="o_msg"></span></div></section>
  <section class="card sec prose" id="c4"><h2>Trefase effekt og strøm</h2>
    <div class="grid2">${inp("t_u","Linjespenning U (V)",400)}${inp("t_cos","cos φ",0.85)}${inp("t_i","Strøm I (A)",10)}${inp("t_p","Effekt P (kW)","")}</div>
    <p class="muted" style="margin-top:8px">P = √3 · U · I · cos φ</p></section>
  <section class="card sec prose" id="c5"><h2>Motor: turtall og dreiemoment</h2>
    <div class="grid2">${inp("m_f","Frekvens f (Hz)",50)}${inp("m_p","Antall poler",4)}</div>
    <p class="out" id="m_ns" style="margin:10px 0"></p>
    <div class="grid2">${inp("m_kw","Akseleffekt P (kW)",15)}${inp("m_n","Turtall n (o/min)",1460)}</div>
    <p class="out" id="m_m" style="margin:10px 0 0"></p>
    <p class="muted">n<sub>s</sub> = 120 · f / p &nbsp;·&nbsp; M = 9550 · P / n</p></section>
  <section class="card sec prose" id="c6"><h2>Trykk</h2>
    <div class="grid2">${inp("p_bar","bar",1)}${inp("p_kpa","kPa")}${inp("p_psi","psi")}${inp("p_mvs","m vannsøyle")}</div></section>
  <section class="card sec prose" id="c7"><h2>Temperatur</h2>
    <div class="grid2">${inp("k_c","°C",20)}${inp("k_f","°F")}${inp("k_k","K")}</div></section>
  <section class="card sec prose" id="c8"><h2>PT100 ↔ temperatur</h2>
    <div class="grid2">${inp("r_t","Temperatur (°C)",100)}${inp("r_r","Motstand (Ω)")}</div>
    <p class="muted" style="margin-top:8px">Callendar–Van Dusen etter IEC 60751, gyldig −200 til 850 °C. For PT1000, gang motstanden med 10.</p></section>
  <section class="card sec prose" id="c9"><h2>Varmeeffekt fra vannmengde og ΔT</h2>
    <div class="grid2">${inp("h_tt","Turtemperatur (°C)",35)}${inp("h_tr","Returtemperatur (°C)",30)}</div>
    <div class="grid2" style="margin-top:10px">${inp("h_q","Vannmengde (l/s)",0.87)}${inp("h_qh","Vannmengde (m³/h)")}${inp("h_p","Effekt P (kW)")}</div>
    <p class="out" id="h_dt" style="margin:10px 0 0"></p>
    <p class="muted" style="margin-top:8px">P = q · 4,18 · ΔT &nbsp;(q i l/s, P i kW, vann). Skriver du effekten, regnes vannmengden ut. Eksempel: gulvvarmen 0,87 l/s ved 35/30 °C ≈ 18 kW – samme som i underlaget.</p></section>
  <section class="card sec prose" id="c10"><h2>Spenningsfall</h2>
    <div class="grid2"><label class="f"><span>System</span><select id="v_sys"><option value="1">1‑fase 230 V</option><option value="3" selected>3‑fase 400 V</option><option value="dc">24 V DC</option></select></label><label class="f"><span>Leder</span><select id="v_mat"><option value="0.0225">Kobber</option><option value="0.036">Aluminium</option></select></label></div>
    <div class="grid2" style="margin-top:10px">${inp("v_l","Lengde L (m)",40)}${inp("v_a","Tverrsnitt A (mm²)",2.5)}${inp("v_i","Strøm I (A)",10)}${inp("v_cos","cos φ",0.9)}</div>
    <p class="out" id="v_out" style="margin:10px 0 0"></p>
    <p class="muted" id="v_msg" style="margin:4px 0 0"></p>
    <p class="muted" style="margin-top:8px">1‑fase og DC: ΔU = 2 · L · I · ρ · cos φ / A &nbsp;·&nbsp; 3‑fase: ΔU = √3 · L · I · ρ · cos φ / A. ρ ved driftstemperatur: Cu 0,0225, Al 0,036 Ω·mm²/m. Reaktansen er sett bort fra, så resultatet er et estimat for små og middels tverrsnitt. NEK 400‑5‑52 anbefaler maks 3 % for belysning og 5 % for annet. For 24 V‑kretser til givere og ventiler bør du sjekke minste spenning på utstyret.</p></section>`;
  const v=id=>parseFloat(String($(id).value).replace(",",".")),set=(id,x,d=4)=>{$(id).value=isFinite(x)?+x.toFixed(d):""};
  const on=(id,fn)=>$(id).addEventListener("input",fn);
  // 4-20
  const aFromMa=()=>{const l=v("a_lrv"),u=v("a_urv"),m=v("a_ma");set("a_val",l+(m-4)/16*(u-l));set("a_pct",(m-4)/16*100,2)};
  on("a_ma",aFromMa);on("a_lrv",aFromMa);on("a_urv",aFromMa);
  on("a_val",()=>{const l=v("a_lrv"),u=v("a_urv"),x=v("a_val");const p=(x-l)/(u-l);set("a_ma",4+16*p);set("a_pct",p*100,2)});
  on("a_pct",()=>{const l=v("a_lrv"),u=v("a_urv"),p=v("a_pct")/100;set("a_ma",4+16*p);set("a_val",l+p*(u-l))});
  // siemens
  on("s_raw",()=>{const p=v("s_raw")/27648;set("s_pct",p*100,2);set("s_ma",4+16*p,3)});
  on("s_pct",()=>{const p=v("s_pct")/100;set("s_raw",Math.round(p*27648),0);set("s_ma",4+16*p,3)});
  on("s_ma",()=>{const p=(v("s_ma")-4)/16;set("s_raw",Math.round(p*27648),0);set("s_pct",p*100,2)});
  // ohm
  $("o_go").onclick=()=>{
    const U=v("o_u"),I=v("o_i"),R=v("o_r"),P=v("o_p"),has=[U,I,R,P].map(x=>isFinite(x));
    const n=has.filter(Boolean).length;if(n<2){$("o_msg").textContent="Fyll inn minst to verdier.";return}
    let u=U,i=I,r=R,p=P;
    if(has[0]&&has[1]){r=u/i;p=u*i}else if(has[0]&&has[2]){i=u/r;p=u*i}else if(has[0]&&has[3]){i=p/u;r=u/i}
    else if(has[1]&&has[2]){u=i*r;p=u*i}else if(has[1]&&has[3]){u=p/i;r=u/i}else{u=Math.sqrt(p*r);i=u/r}
    set("o_u",u);set("o_i",i);set("o_r",r);set("o_p",p);$("o_msg").textContent=n>2?"Brukte de to første verdiene.":"";
  };
  $("o_clr").onclick=()=>{["o_u","o_i","o_r","o_p"].forEach(id=>$(id).value="");$("o_msg").textContent=""};
  // trefase
  const tP=()=>set("t_p",Math.sqrt(3)*v("t_u")*v("t_i")*v("t_cos")/1000,3);
  on("t_i",tP);on("t_u",tP);on("t_cos",tP);
  on("t_p",()=>set("t_i",v("t_p")*1000/(Math.sqrt(3)*v("t_u")*v("t_cos")),2));
  tP();
  // motor
  const mot=()=>{const ns=120*v("m_f")/v("m_p");$("m_ns").textContent=isFinite(ns)?`Synkront turtall: ${Math.round(ns)} o/min`:"";
    const M=9550*v("m_kw")/v("m_n");$("m_m").textContent=isFinite(M)?`Dreiemoment: ${M.toLocaleString("nb-NO",{maximumFractionDigits:1})} Nm`:"";};
  ["m_f","m_p","m_kw","m_n"].forEach(id=>on(id,mot));mot();
  // trykk
  const pr={p_bar:1,p_kpa:100,p_psi:14.5038,p_mvs:10.1972};
  const prFrom=id=>{const b=v(id)/pr[id];Object.keys(pr).forEach(k=>{if(k!==id)set(k,b*pr[k])})};
  Object.keys(pr).forEach(k=>on(k,()=>prFrom(k)));prFrom("p_bar");
  // temp
  on("k_c",()=>{const c=v("k_c");set("k_f",c*9/5+32,2);set("k_k",c+273.15,2)});
  on("k_f",()=>{const c=(v("k_f")-32)*5/9;set("k_c",c,2);set("k_k",c+273.15,2)});
  on("k_k",()=>{const c=v("k_k")-273.15;set("k_c",c,2);set("k_f",c*9/5+32,2)});
  set("k_f",20*9/5+32,2);set("k_k",293.15,2);
  // pt100
  const A=3.9083e-3,B=-5.775e-7,C=-4.183e-12,R=t=>100*(1+A*t+B*t*t+(t<0?C*(t-100)*t*t*t:0));
  on("r_t",()=>set("r_r",R(v("r_t")),3));
  on("r_r",()=>{const r=v("r_r");let lo=-200,hi=850;if(!(r>=R(lo)&&r<=R(hi))){$("r_t").value="";return}for(let k=0;k<60;k++){const m=(lo+hi)/2;R(m)<r?lo=m:hi=m}set("r_t",(lo+hi)/2,2)});
  set("r_r",R(100),3);
  // varmeeffekt
  const hDt=()=>v("h_tt")-v("h_tr");
  const hShow=()=>{const dt=hDt();$("h_dt").textContent=isFinite(dt)?`ΔT = ${(+dt.toFixed(2)).toLocaleString("nb-NO")} K`:""};
  const hFromQ=()=>{set("h_qh",v("h_q")*3.6,3);set("h_p",v("h_q")*4.18*hDt(),2);hShow()};
  on("h_q",hFromQ);on("h_tt",hFromQ);on("h_tr",hFromQ);
  on("h_qh",()=>{set("h_q",v("h_qh")/3.6,3);set("h_p",v("h_qh")/3.6*4.18*hDt(),2);hShow()});
  on("h_p",()=>{const q=v("h_p")/(4.18*hDt());set("h_q",q,3);set("h_qh",q*3.6,3);hShow()});
  hFromQ();
  // spenningsfall
  const vCalc=()=>{const sy=$("v_sys").value,rho=+$("v_mat").value,L=v("v_l"),A=v("v_a"),I=v("v_i"),cos=sy==="dc"?1:v("v_cos");
    $("v_cos").disabled=sy==="dc";const U=sy==="1"?230:sy==="3"?400:24,k=sy==="3"?Math.sqrt(3):2;
    const du=k*L*I*rho*cos/A,pc=du/U*100;
    if(!isFinite(du)){$("v_out").textContent="";$("v_msg").textContent="";return}
    $("v_out").textContent=`ΔU = ${(+du.toFixed(2)).toLocaleString("nb-NO")} V  ·  ${(+pc.toFixed(2)).toLocaleString("nb-NO")} %`;
    $("v_msg").textContent=`Spenning ved lasten ≈ ${(+(U-du).toFixed(1)).toLocaleString("nb-NO")} V`+(pc>5?" – over 5 %, vurder større tverrsnitt.":pc>3?" – over 3 %.":"");};
  ["v_l","v_a","v_i","v_cos"].forEach(id=>on(id,vCalc));$("v_sys").onchange=vCalc;$("v_mat").onchange=vCalc;vCalc();
  app.querySelectorAll(".toc a").forEach(a=>a.onclick=e=>{e.preventDefault();document.querySelector(a.getAttribute("href")).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})});
}

/* ---------- eksamensmodus ---------- */
let ex=null,exTimer=null,exN=40,exMin=60;
function stopTimer(){if(exTimer){clearInterval(exTimer);exTimer=null}}
function eksamen(){
  stopTimer();
  if(!ex){
    app.innerHTML=`<div class="card sec prose"><h2>Eksamensmodus</h2><p>Tilfeldige spørsmål fra alle temaer, med tidsfrist. Du får ingen forklaringer før du leverer, og du kan hoppe frem og tilbake og endre svar.</p>
    <h3>Antall spørsmål</h3><div class="chips">${[20,40,60,100].map(n=>`<button class="chip" aria-pressed="${exN===n}" data-n="${n}"><span class="dot"></span>${n}</button>`).join("")}</div>
    <h3>Tid</h3><div class="chips">${[15,30,45,60,90].map(n=>`<button class="chip" aria-pressed="${exMin===n}" data-m="${n}"><span class="dot"></span>${n} min</button>`).join("")}</div>
    <div class="row" style="margin-top:18px"><button class="btn" id="exGo">Start eksamen</button></div></div>`;
    app.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{exN=+b.dataset.n;eksamen()});
    app.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{exMin=+b.dataset.m;eksamen()});
    $("exGo").onclick=()=>{ex={list:shuffle(Q).slice(0,exN).map(q=>({q,order:shuffle([0,1,2,3])})),ans:[],i:0,end:Date.now()+exMin*60000,done:false};eksamen()};
    return;
  }
  if(ex.done)return exResult();
  if(Date.now()>=ex.end){ex.done=true;return exResult()}
  const {q,order}=ex.list[ex.i],a=ex.ans[ex.i];
  const answered=ex.ans.filter(x=>x!==undefined).length;
  app.innerHTML=`<div class="card sec" style="position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding:10px 14px;display:flex;justify-content:space-between;align-items:center">
    <span class="out" id="exClock"></span><span class="muted">${answered} av ${ex.list.length} besvart</span></div>
  <div class="lamps">${ex.list.map((_,k)=>`<button class="lamp ${k===ex.i?"cur":ex.ans[k]!==undefined?"ok":""}" data-j="${k}" aria-label="Spørsmål ${k+1}" style="cursor:pointer;padding:0;${ex.ans[k]!==undefined&&k!==ex.i?"background:var(--ink);border-color:var(--ink);box-shadow:none":""}"></button>`).join("")}</div>
  <div class="card"><div class="meta"><span>Spørsmål ${ex.i+1}</span><span>${q.c}</span></div><p class="q">${esc(q.q)}</p>
  <div class="opts">${order.map((o,k)=>`<button class="opt" data-o="${o}" style="${a===o?"border-color:var(--signal);background:color-mix(in srgb,var(--signal) 18%,var(--bg))":""}"><span class="k">${"ABCD"[k]}</span><span>${esc(q.a[o])}</span></button>`).join("")}</div>
  <div class="next"><button class="btn ghost sm" id="exPrev" ${ex.i===0?"disabled":""}>Forrige</button><button class="btn sm" id="exNext">${ex.i===ex.list.length-1?"Til levering":"Neste"}</button></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost" id="exSubmit">Lever eksamen</button><button class="linkish" id="exAbort">Avbryt</button></div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{ex.ans[ex.i]=+b.dataset.o;if(ex.i<ex.list.length-1)ex.i++;eksamen()});
  app.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{ex.i=+b.dataset.j;eksamen()});
  $("exPrev").onclick=()=>{ex.i--;eksamen()};
  $("exNext").onclick=()=>{if(ex.i<ex.list.length-1){ex.i++;eksamen()}else $("exSubmit").focus()};
  $("exSubmit").onclick=e=>{const b=e.currentTarget,left=ex.list.length-ex.ans.filter(x=>x!==undefined).length;if(left&&!b.dataset.sure){b.dataset.sure=1;b.textContent=`${left} ubesvarte – trykk igjen for å levere`;b.classList.remove("ghost");return}ex.done=true;eksamen()};
  $("exAbort").onclick=e=>{const b=e.currentTarget;if(!b.dataset.sure){b.dataset.sure=1;b.textContent="Trykk igjen for å avbryte (svarene lagres ikke)";return}ex=null;eksamen()};
  const tick=()=>{const ms=ex.end-Date.now();if(ms<=0){ex.done=true;stopTimer();eksamen();return}const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;const el=$("exClock");if(el){el.textContent=`${m}:${String(s).padStart(2,"0")}`;el.style.color=ms<60000?"var(--bad)":""}};
  tick();exTimer=setInterval(tick,1000);
}
function exResult(){
  stopTimer();
  if(!ex.saved){
    const st=store.get("stats")||{},m=new Set(store.get("missed")||[]);
    ex.list.forEach(({q},k)=>{const a=ex.ans[k];if(a===undefined)return;const s=st[q.c]||{ok:0,n:0};s.n++;if(a===q.r){s.ok++;m.delete(q.id)}else m.add(q.id);st[q.c]=s});
    store.set("stats",st);store.set("missed",[...m]);ex.saved=true;
  }
  const ok=ex.list.filter(({q},k)=>ex.ans[k]===q.r).length,n=ex.list.length,pct=Math.round(ok/n*100);
  const bycat={};ex.list.forEach(({q},k)=>{const b=bycat[q.c]||(bycat[q.c]={ok:0,n:0});b.n++;if(ex.ans[k]===q.r)b.ok++});
  const wrong=ex.list.map((x,k)=>({...x,a:ex.ans[k]})).filter(x=>x.a!==x.q.r);
  app.innerHTML=`<div class="card sec"><div class="score">${ok}/${n}</div><p style="margin:6px 0 0">${pct} % riktig.</p></div>
  <div class="card sec"><h2>Per tema</h2><div class="stat">${Object.entries(bycat).map(([c,b])=>`<span>${c}</span><span class="muted">${b.ok}/${b.n}</span><div class="bar"><i style="width:${b.ok/b.n*100}%"></i></div>`).join("")}</div></div>
  <div class="row sec"><button class="btn" id="exNew">Ny eksamen</button></div>
  ${wrong.length?`<section class="card"><h2>Gjennomgang</h2><div class="review">${wrong.map(({q,a})=>`<div class="item"><p><strong>${esc(q.q)}</strong></p><p>Ditt svar: ${a===undefined?"<em>ubesvart</em>":esc(q.a[a])}</p><p>Riktig: ${esc(q.a[q.r])}</p><p class="muted">${esc(LX(q))}</p></div>`).join("")}</div></section>`:""}`;
  $("exNew").onclick=()=>{ex=null;eksamen();window.scrollTo(0,0)};
  window.scrollTo(0,0);
}

/* ---------- symboler ---------- */
const S=(b)=>`<svg viewBox="0 0 80 80" width="80" height="80" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${b}</svg>`;
const TOP='<path d="M40 6V26"/>',BOT='<path d="M40 54V74"/>',NOB='<path d="M40 54L24 28"/>';
const SYM=[
["Sluttende kontakt (NO)","Åpen i hvilestilling, lukker når den påvirkes.",S(TOP+BOT+NOB)],
["Brytende kontakt (NC)","Lukket i hvilestilling, åpner når den påvirkes.",S(TOP+BOT+'<path d="M40 26H54"/><path d="M40 54L58 22"/>')],
["Trykknapp, sluttende","Sluttende kontakt med trykknapp‑aktuator, f.eks. startknapp.",S(TOP+BOT+NOB+'<path d="M31 41H14" stroke-dasharray="4 4"/><path d="M14 33V49M14 33H10M14 49H10"/>')],
["Trykknapp, brytende","Brytende kontakt med trykknapp‑aktuator, f.eks. stoppknapp.",S(TOP+BOT+'<path d="M40 26H54"/><path d="M40 54L58 22"/><path d="M48 39H14" stroke-dasharray="4 4"/><path d="M14 31V47M14 31H10M14 47H10"/>')],
["Nødstopp","Brytende kontakt med soppformet aktuator som låses i aktivert stilling.",S(TOP+BOT+'<path d="M40 26H54"/><path d="M40 54L58 22"/><path d="M48 39H18" stroke-dasharray="4 4"/><path d="M18 27A12 12 0 0 0 18 51Z"/>')],
["Spole (relé eller kontaktor)","Betjeningsspole. Tilkoblingene heter A1 og A2.",S('<path d="M40 6V26M40 54V74"/><rect x="22" y="26" width="36" height="28"/>')],
["Kontaktor, hovedkontakt","Sluttende kontakt med halvsirkel ved fast kontakt.",S(TOP+BOT+NOB+'<path d="M34 26A6 6 0 0 0 46 26"/>')],
["Effektbryter / automatsikring","Bryter som kan bryte kortslutningsstrøm. Kryss ved fast kontakt.",S(TOP+BOT+NOB+'<path d="M35 21L45 31M45 21L35 31"/>')],

      <li>Varmepumpen styrer JPA501 og brønnpumpen 3560.001‑JPA401. Pumpene stopper med tidsforsinkelse etter at varmepumpen stopper.</li>
      <li>Elkjelen kobles inn trinnvis når varmepumpen har fullt pådrag og RTB404 ikke når settpunktet, med forsinkelse ved inn‑ og utkobling.</li>
      <li>JPA401/402 er trykkstyrte og alternerer. Veksling stilles inn i SD, og ved feil tar den andre over.</li>
      <li>Alle pumper mosjonkjøres minst 5 minutter per uke i stopperioder.</li>
    </ul>
    <h3>Gulvvarme 3200.002</h3>
    <ul>
      <li>Shunten får varmtvann fra samlestokken og leverer 35/30 °C til gulvvarmen i plan 1 og 2.</li>
      <li>SBB401 regulerer turtemperaturen etter RTB401. Synker RTB401 under settpunktet, åpner ventilen til verdien er nådd.</li>
      <li>JPA401 er trykkregulert og følger forbruket. Rommene reguleres med romføler og tovegsventiler på fordelerne.</li>
      <li>SBB401 mosjonkjøres hver uke, og ventilposisjonen sendes til SD.</li>
    </ul>
    <h3>Felles</h3>
    <ul>
      <li>Alle pumper har vender AV‑PÅ‑AUTO i tavla. I AUTO styrer SD‑anlegget.</li>
      <li>SD viser pumper (AV/PÅ/AUTO, status, pådrag), følere (verdi og børverdi) og ventiler (stilling). Alle analoge verdier trendlogges.</li>
      <li>Driftstider lagres, og pumpene gir alarm ved oppnådd serviceintervall. Energimålerne leses over M‑Bus.</li>
    </ul>
  </section>

  <section class="card sec prose" id="p-akt"><h2>Gulvvarmeaktuatorer</h2>
    <p>Shunten 3200.002 lager 35 °C turvann. Alle rom med varig opphold har egen temperaturregulering: romføleren styrer via regulatoren to‑veis ventiler montert direkte på fordelerne, og regulatoren skal være modulerende (FB 3200.002 kap. 3).</p>
    <div class="chain">${["Romføler","Romregulator (PI)","Pådrag: PWM eller 0–10 V","Aktuator på fordeler","Gulvsløyfe i rommet"].map(x=>`<span>${x}</span>`).join("")}</div>
    <h3>Slik virker en termomotor</h3>
    <p class="muted">Aktuatortypen er ikke angitt i underlaget. Termomotor er det vanligste på gulvvarmefordelere.</p>
    <ul>
      <li>Et lite varmeelement varmer opp et ekspansjonselement (voks). Det utvider seg og skyver ventilstiften. Uten spenning kjøles det ned, og fjæren stenger ventilen.</li>
      <li>Den er treg: typisk 2–5 minutter for å åpne helt. Den finnes som av/på (24 V eller 230 V) og som proporsjonal 0–10 V.</li>
      <li>De fleste er NC (strømløst stengt). Er de NO, snur logikken. Sjekk databladet når typen er valgt.</li>
      <li>Nye aktuatorer står ofte åpne («first open») slik at rørleggeren kan fylle og trykkprøve. Funksjonen forsvinner første gang de får spenning.</li>
    </ul>
    <h3>Regulering</h3>
    <ul>
      <li>Hvert rom har tre settpunkter fra 563 Romregulering: komfort 22 °C ved bevegelse, forberedt 21,5 °C og borte 21 °C. Brukeren kan justere ±3 °C.</li>
      <li>PI‑regulatoren gir 0–100 % pådrag. Med 0–10 V‑aktuator går pådraget rett ut. Med av/på‑aktuator gjøres det om til tidsproporsjonal styring (PWM): 40 % og 15 minutters syklus gir 6 minutter åpent. Begge oppfyller kravet om modulerende regulering.</li>
      <li>Betonggulv har tidskonstant på flere timer. Syklustiden må være mye lengre enn åpnetiden til aktuatoren, ellers rekker den aldri å åpne.</li>
    </ul>
    <h3>Fordelerskap</h3>
    ${tbl(["Skap","Område","Sløyfer","Aktuatorer"],P_MANI)}
    <p class="muted" style="margin:8px 0 0">Fra gulvvarmetegningene V‑32‑20‑00‑01/02. Sløyfelengder 7–106 m, totalt ca. 2252 m.</p>

function lvEgen(){
  const K=+$("cK").value||1,T=Math.max(+$("cT").value||10,0.1),tau=Math.max(+$("cTau").value||0,0);
  const win=Math.max(12*(T+tau),20);

function lvSetup(key){

  const dt=P.int?Math.min(P.tau/10||0.5,0.5):Math.min(P.T/100,P.tau>0?P.tau/10:Infinity,1);
  const u0=P.int?P.out:Math.min(100,Math.max(0,(P.sp-P.base)/P.K));
  const nd=Math.max(0,Math.round((P.tau||0)/dt));
  const y0=P.int?P.sp:P.base+P.K*u0;
  lv={key,P,span,dt,t:0,x:P.int?0:P.K*u0,yTrue:y0,ym:y0,buf:new Array(nd).fill(u0),u:u0,uMan:u0,I:u0,Df:0,yPrev:(y0-P.lo)/span*100,
    sp:P.sp,auto:true,dist:false,noise:true,paused:false,speed:P.speed,Kp:P.tun.Kp,Ti:P.tun.Ti,Td:P.tun.Td,
    trend:[],tNext:0,vs:P.win,vEnd:null,yfit:false,hx:null,geo:null,last:null,acc:0,inBand:null,step:null,dEvt:null,ident:null,model:null,msg:{},done:new Set(store.get("live-"+key)||[])};
  for(let tt=-2*P.win;tt<0;tt+=P.win/600)lv.trend.push([tt,P.sp,y0,u0]);

}
function lvPush(){

}
const lvGauss=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)};
function lvStepSim(){
  const L=lv,P=L.P,dt=L.dt,span=L.span;
  // regulator (alt i % av måleområdet)
  const ypct=(L.ym-P.lo)/span*100,e=(L.sp-L.ym)/span*100;
  let Draw=L.Td>0?-L.Kp*L.Td*(ypct-L.yPrev)/dt:0;L.yPrev=ypct;
  const Tf=Math.max(L.Td/8,dt);L.Df+=(Draw-L.Df)*dt/(Tf+dt);if(!(L.Td>0))L.Df=0;
  if(L.auto){
    let u=L.Kp*e+L.I+L.Df;const sat=u>100||u<0;u=Math.min(100,Math.max(0,u));
    if(L.Ti>0&&!((u>=100&&e>0)||(u<=0&&e<0)))L.I+=L.Kp*dt/L.Ti*e;
    L.u=u;L.uMan=u;
  }else{L.u=L.uMan;L.I=L.u-L.Kp*e-L.Df}
  // prosess med dødtid
  L.buf.push(L.u);const ud=L.buf.length>0?L.buf.shift():L.u;
  if(P.int){
    const out=P.out+(L.dist&&P.dist.type==="out"?P.dist.v:0);
    L.yTrue=Math.min(100,Math.max(0,L.yTrue+dt*P.Ki*(ud-out)));
  }else{
    L.x+=dt*(P.K*ud-L.x)/P.T;
    L.yTrue=P.base+(L.dist&&P.dist.type==="base"?P.dist.v:0)+L.x;
  }
  L.ym=L.yTrue+(L.noise?P.noise*lvGauss():0);

  if(L.t>=L.tNext)lvPush();

}
function lvDone(id){if(!lv.done.has(id)){lv.done.add(id);store.set("live-"+lv.key,[...lv.done]);lvRenderCh()}}
function lvEval(){
  const L=lv,P=L.P,t=L.t,err=L.sp-L.yTrue,inb=Math.abs(err)<=P.tol;
  if(L.auto&&inb){if(L.inBand===null)L.inBand=t;if(t-L.inBand>=P.hold)lvDone("hold")}else L.inBand=null;
  const fmt=v=>v.toLocaleString("nb-NO",{maximumFractionDigits:1});

    else if(inb){if(s.inSince===null)s.inSince=t;if(t-s.inSince>=P.hold/3){const pct=Math.max(0,s.over)/Math.abs(s.to-s.from)*100,ts=s.inSince-s.t0;
      L.msg.step=`Siste sprang: oversving ${fmt(pct)} %, innenfor ±${fmt(P.tol)} ${P.unit} etter ${lvDur(ts)}.`;if(pct<=10)lvDone("step");L.step=null}}else s.inSince=null;}

function lvDur(s){return s>=3600?(s/3600).toLocaleString("nb-NO",{maximumFractionDigits:1})+" t":s>=120?Math.round(s/60)+" min":Math.round(s)+" s"}
function lvIdentStep(){

  if(id.wait){const we=L.t-id.w0;id.wd.push([we,L.yTrue]);const b=id.wd.find(p=>p[0]>=we*0.8);
    const steady=P.int?we>=Math.max(2*(P.tau||1),2):(we>Math.max(10*L.dt,2*(P.tau||0))&&b&&Math.abs(L.yTrue-b[1])<P.tol*0.05);

      lvDone("ident");}
    return;
  }
  const back=id.d.find(p=>p[0]>=el*0.8);

const LES={"0": "FSE er forskriften som styrer hvordan du jobber trygt i og rundt elektriske anlegg. Den handler om mennesker og arbeid: krav til opplæring, valg av arbeidsmetode, planlegging og hvem som har ansvaret. Hvordan selve anlegget skal bygges, står derimot i FEL. Enkel huskeregel: FSE gjelder jobben du gjør, FEL gjelder anlegget du bygger.", "1": "FEL er forskriften som stiller krav til selve lavspenningsanlegget, altså hvordan det prosjekteres, bygges, endres og vedlikeholdes slik at det er sikkert for folk og eiendom. Forskriften sier hva som skal oppnås, mens NEK 400 viser hvordan. Følger du NEK 400, regnes kravene i FEL som oppfylt. Sikkerhet ved selve arbeidet står i FSE.", "2": "NEK 400 er den norske normen for elektriske lavspenningsinstallasjoner, for eksempel kursopplegg, vern, jording og kabeldimensjonering i bygg og industri. Den er knyttet til FEL som anerkjent måte å oppfylle forskriften på. NEK EN 61439 handler om bygging av tavler, NEK 405 om sertifisering av elektrokontrollører og IEC 61131 om PLS. De er nyttige, men gjelder ikke installasjonen som helhet.", "3": "NEK EN 60204‑1 gjelder det elektriske utstyret på selve maskinen: hovedbryter, styrekretser, nødstopp, stoppkategorier, fargekoder på ledere og trykknapper og dokumentasjon. Når du bygger et styreskap til en maskin, er det denne du jobber etter. NEK 400 dekker den faste installasjonen frem til maskinen, mens NEK EN 60079‑14 gjelder Ex‑installasjoner.", "4": "Rekkefølgen er: frakoble, sikre mot innkobling, kontrollere spenningsløshet, jorde og kortslutte ved behov, og beskytte mot spenningssatte deler i nærheten. Du kan ikke kontrollere spenningsløshet før anlegget er frakoblet og sikret, ellers kan noen koble inn igjen etter at du har målt. Jording kommer etter kontrollen, fordi du aldri skal jorde noe du ikke har bekreftet er spenningsløst.", "5": "Alt starter med å frakoble anlegget fra alle forsyninger, også reservekilder som UPS, aggregat, solcelleanlegg eller tilbakemating fra kondensatorer og frekvensomformere. Først etter frakobling gir det mening å låse og merke bryteren og deretter kontrollere spenningsløshet. Å måle eller jorde før frakobling ville vært både meningsløst og farlig.", "6": "Lavspenning er spenning opp til og med 1000 V vekselspenning eller 1500 V likespenning. Over dette er det høyspenning, med strengere krav til blant annet jording og kortslutning. 400 V og 690 V er vanlige driftsspenninger i industrien, men de ligger godt innenfor lavspenningsområdet. Grensen avgjør hvilke regler i FSE og hvilke normer som gjelder.", "7": "FSE krever at alle som arbeider på eller nær elektriske anlegg får opplæring hvert år. Opplæringen skal dekke sikkerhetsbestemmelsene og førstehjelp ved strømulykker, inkludert hjerte‑lunge‑redning. Grunnen er at kunnskap om farer og prosedyrer, og ikke minst førstehjelp, raskt går i glemmeboka. Arbeidsgiver har ansvaret for at opplæringen blir gjennomført og dokumentert.", "8": "FSE har tre arbeidsmetoder: arbeid på frakoblet anlegg, arbeid nær ved spenningssatte deler og arbeid under spenning (AUS). Hver metode har egne krav til sikkerhetstiltak. «Arbeid med redusert spenning» finnes ikke som egen metode. Å jobbe på lav spenning, for eksempel 24 V, endrer ikke hvilken metode du bruker hvis det finnes farlig spenning i samme anlegg.", "9": "Strøm gjennom kroppen kan forstyrre hjerterytmen, og alvorlige rytmeforstyrrelser kan komme timer etter ulykken selv om du føler deg fin. Strømmen kan også gi indre brannskader som ikke synes på huden. Derfor skal du alltid til lege for kontroll, gjerne med EKG, og hendelsen skal meldes. Også 230 V kan være dødelig.", "10": "En jordfeilbryter måler forskjellen mellom strømmen som går ut og som kommer tilbake. Er forskjellen 30 mA eller mer, har strøm lekket ut et annet sted, kanskje gjennom en person, og bryteren løser ut. 30 mA er valgt fordi det ligger under nivået der strøm gjennom kroppen normalt gir dødelig hjerteflimmer. 300 mA beskytter mot brann, ikke mot personskade.", "11": "En frekvensomformer likeretter nettspenningen til en DC‑mellomkrets. Ved jordfeil på utgangssiden eller i mellomkretsen kan feilstrømmen derfor bli en glatt likestrøm. Type AC og type A kan bli «blendet» av DC og løser da ikke ut sikkert. Type B er bygget for å oppdage glatte DC‑feilstrømmer i tillegg til AC og pulserende DC, og er derfor riktig valg når produsenten krever det.", "12": "IP‑koden har to siffer. Første siffer 6 betyr støvtett, som er høyeste nivå for faste fremmedlegemer. Andre siffer 5 betyr beskyttet mot vannstråler fra dyse, for eksempel ved spyling. Nedsenking krever 7 eller 8 som andre siffer. IP65 er typisk for koblingsbokser og tavler utendørs eller i vaskeområder i næringsmiddelindustrien.", "13": "Første siffer i IP‑koden (0 til 6) angir hvor godt kapslingen beskytter mot inntrenging av faste gjenstander og mot berøring av farlige deler, fra fingre og verktøy ned til støv. Andre siffer angir beskyttelse mot vann. IP20 betyr for eksempel fingersikker, men ingen vannbeskyttelse, vanlig for komponenter inne i en tavle. Mekanisk slagfasthet angis med IK‑kode.", "14": "Grønn/gul er reservert for beskyttelseslederen (PE) og skal aldri brukes til noe annet. Fargen gjør det lett å se hvilken leder som skal sikre at utsatte deler holder jordpotensial. Blå brukes for nøytralleder, mens brun, svart og grå er vanlige for faseledere. Å bruke grønn/gul som fase eller N er farlig og ikke tillatt.", "15": "I et IT‑nett er forsyningen isolert fra jord eller jordet over høy impedans, mens utsatte deler er jordet lokalt. Ved første jordfeil blir feilstrømmen så liten at vernet ikke trenger å løse ut, og anlegget kan gå videre. Feilen må likevel varsles med isolasjonsovervåking og rettes raskt, fordi en ny jordfeil på en annen fase gir kortslutning. IT‑nett er vanlig i eldre norske boliger.", "16": "I TN‑S‑nettet er transformatorens nullpunkt direkte jordet, og nøytralleder (N) og beskyttelsesleder (PE) føres som to separate ledere gjennom hele anlegget. S står for separat. I TN‑C er de slått sammen til én PEN‑leder, og i TN‑C‑S deles PEN opp i N og PE et sted i anlegget. Separate ledere gir mindre støy på PE, noe som er en fordel for elektronikk og PLS.", "17": "Selektivitet betyr at det bare er vernet rett før feilstedet som løser ut, mens vernene lenger opp mot hovedfordelingen blir stående inne. Da faller bare den kursen med feil ut, og resten av anlegget går videre. Uten selektivitet kan en kortslutning i én motorkurs ta ut hele tavla. Selektivitet oppnås ved å velge vern med riktig størrelse og karakteristikk.", "18": "En automatsikring har termisk utløsning for overlast og magnetisk utløsning for kortslutning. Karakteristikken bestemmer hvor stor strømmen må være før den magnetiske delen løser ut momentant. For C‑karakteristikk er det mellom 5 og 10 ganger merkestrømmen. En C16 løser altså ut magnetisk et sted mellom 80 og 160 A. Det tåler startstrømmen til motorer og trafoer bedre enn B, som løser ut ved 3 til 5 × In.", "19": "Begge er ekstra lav spenning, normalt maks 50 V AC eller 120 V DC, levert fra en kilde med sikker adskillelse, for eksempel en sikkerhetstransformator. Forskjellen er jording: i SELV er kretsen helt ujordet, mens i PELV er kretsen koblet til jord. 24 V styrespenning i et styreskap er typisk PELV, fordi 0 V jordes slik at en jordfeil gir utkobling i stedet for utilsiktet start.", "20": "Utjevningsforbindelser kobler sammen ledende deler, som rør, kabelbruer, stålkonstruksjoner og maskinrammer, slik at de holder samme potensial. Får en del spenning ved en feil, får de andre samme spenning, og du kan ikke få farlig berøringsspenning mellom to ting du tar på samtidig. Hovedutjevningen knyttes til hovedjordskinnen ved inntaket.", "21": "Isolasjonsmåling gjøres med likespenning for å teste isolasjonen mellom ledere og mellom ledere og jord. For anlegg med nominell spenning opp til 500 V, som 230 V og 400 V, brukes 500 V DC, og kravet er minst 1 MΩ. Spenningen ligger litt
