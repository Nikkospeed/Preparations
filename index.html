over driftsspenningen for å avsløre svak isolasjon. Koble fra frekvensomformere, PLS og annen elektronikk først, ellers kan de ødelegges.", "22": "En kontinuitetsmåling sender en liten strøm gjennom beskyttelseslederen og måler resistansen. Lav resistans viser at PE er sammenhengende fra jordskinnen helt ut til utstyret, slik at en jordfeil gir stor nok feilstrøm til at vernet løser ut. Isolasjonsmåling tester det motsatte, nemlig at det ikke er forbindelse der det ikke skal være.", "23": "Ex‑soner deles inn etter hvor ofte en eksplosiv gassatmosfære forekommer. Sone 0 betyr at den er til stede hele tiden eller over lange perioder, for eksempel inne i en tank med brennbar væske. Sone 1 kan ha eksplosiv atmosfære ved normal drift, og sone 2 bare unntaksvis og kortvarig. Jo lavere sonenummer, jo strengere krav til utstyret.", "24": "Brennbart støv, som mel, sukker, trestøv eller kullstøv, har egne soner: 20, 21 og 22. De tilsvarer gassonene 0, 1 og 2, med samme logikk om hvor ofte eksplosiv atmosfære forekommer. Sone 20 er for eksempel inne i en silo eller et filter. Gassgrupper og utstyrsgrupper skrives med romertall og bokstaver, men det er noe annet enn sonene.", "25": "Ex i, egensikkerhet, betyr at energien i kretsen begrenses så mye at verken gnister eller varme kan antenne gassen, selv ved feil. Det gjøres med sikkerhetsbarrierer eller galvaniske skilletrinn i sikker sone. Egensikre kretser brukes typisk for givere og instrumentering. Fordelen er at man kan jobbe på kretsen under drift uten å måtte frigi området.", "26": "Ex d, trykkfast kapsling, tillater at gass trenger inn og at en eksplosjon skjer inne i kapslingen. Kapslingen er så kraftig at den tåler trykket, og flammeveiene, de smale spaltene mellom lokk og hus, kjøler ned gassene slik at eksplosjonen ikke slipper ut. Derfor må flammeveier ikke skrapes, males eller skades, og alle skruer må sitte på plass.", "27": "Temperaturklassen angir den høyeste overflatetemperaturen utstyret kan få. T4 betyr maks 135 °C. Utstyret må ha en temperaturklasse der maks temperatur er lavere enn tenntemperaturen til gassen i området. Rekken er T1 450, T2 300, T3 200, T4 135, T5 100 og T6 85 °C. Jo høyere T‑tall, jo kaldere utstyr og jo strengere krav.", "28": "Gasser deles i gruppe IIA, IIB og IIC etter hvor lett de antennes og hvor lett en flamme slipper gjennom en spalte. IIC omfatter hydrogen og acetylen, som antennes med svært lite energi, og stiller derfor strengest krav. Utstyr merket IIC kan også brukes i IIB og IIA, men ikke omvendt. Gruppe I gjelder gruver.", "29": "ATEX deler utstyr i kategorier etter beskyttelsesnivå. Kategori 1 har svært høyt sikkerhetsnivå og skal være sikkert selv ved to uavhengige feil, og kreves derfor i sone 0 og 20 der eksplosiv atmosfære er til stede nesten hele tiden. Kategori 2 brukes i sone 1 og 21, og kategori 3 i sone 2 og 22. M‑kategoriene gjelder gruver.", "30": "SJA er sikker jobbanalyse, en gjennomgang du og kollegene gjør før en konkret arbeidsoppgave med risiko. Dere går gjennom jobben steg for steg, finner hva som kan gå galt og bestemmer tiltak, som frakobling, sperring eller verneutstyr. En SJA er særlig nyttig for arbeid som ikke er dekket av vanlige prosedyrer, eller når forholdene på stedet er uvante.", "31": "En spenningsprøver som har feil, for eksempel en brutt måleledning eller flatt batteri, vil vise 0 V selv om anlegget er spenningsførende. Derfor tester du den mot en kjent spenningskilde før målingen, for å se at den virker, og etterpå, for å bekrefte at den ikke ble defekt underveis. Bare da kan du stole på at 0 V faktisk betyr spenningsløst.", "32": "Kapittelet om arbeidsmetoder i FSE dekker §§ 14 til 18. Paragrafene 14 og 15 gjelder arbeid på frakoblet anlegg, med etablering og avvikling av sikkerhetstiltak. § 16 gjelder arbeid under spenning. Paragrafene 17 og 18 gjelder arbeid nær ved spenningssatte deler, også her med etablering og avvikling. Paragrafene foran handler om ansvar, opplæring og planlegging.", "33": "§ 15 i FSE handler om hva som skal skje når arbeidet på et frakoblet anlegg er ferdig og sikkerhetstiltakene skal fjernes. Det er en kritisk fase, fordi anlegget går fra trygt til spenningssatt. Alle involverte og berørte skal ha beskjed om at anlegget nå er å betrakte som spenningssatt, og alle skal ha forlatt arbeidsstedet før det meldes klart for innkobling.", "34": "Når jordinger, låser og skilt fjernes, er anlegget plutselig ikke lenger sikret. Hvis noen fortsatt tror det er frakoblet og jobber videre, kan de få strøm gjennom kroppen. Derfor skal alle som har vært involvert eller blir berørt, få beskjed om at anlegget er å betrakte som spenningssatt. Isolasjonsmåling kan være lurt etter arbeid, men er ikke det FSE krever her.", "35": "Ved arbeid nær ved spenningssatte deler skal risikoen for å komme for nær styres med fysiske og visuelle tiltak. Sikkerhetsavstanden markeres, og spenningssatte deler avskjermes og/eller sperres av, slik at du ikke kommer borti dem ved et uhell. Skilting alene er ikke nok. Lar tiltakene seg ikke gjennomføre fullt ut, må du frakoble eller velge en annen arbeidsmetode.", "36": "I lavspenningsanlegg avgjøres behovet for jording og kortslutning etter en risikovurdering. Det er nødvendig der det er fare for tilbakemating, induserte spenninger eller at anlegget kan bli spenningssatt utilsiktet, for eksempel på lange luftlinjer eller ved aggregater. I høyspenningsanlegg er jording og kortslutning alltid påkrevd, fordi følgene av en feil er langt større.", "37": "Prinsippet er at det alltid skal være minst to uavhengige barrierer mellom deg og farlig spenning. Svikter én, skal den andre fortsatt beskytte fullt ut. Ved arbeid på frakoblet anlegg kan barrierene for eksempel være låst og merket bryter pluss kontrollert spenningsløshet med jording. Ved arbeid nær ved kan det være avstand pluss avskjerming.", "38": "I lavspenningsanlegg kalles personen som har ansvaret for sikkerheten på arbeidsstedet ansvarlig for arbeidet, forkortet AFA. AFA sørger for at sikkerhetstiltakene er på plass før arbeidet starter, og at alle vet hva som gjelder. I høyspenningsanlegg heter tilsvarende rolle leder for sikkerhet (LFS). Det skal aldri være tvil om hvem som har rollen.", "39": "Opplæringen etter FSE skal gjennomføres årlig, og veiledningen tolker det som maks 12 måneder mellom hver gang. Kurset skal inneholde både sikkerhetsbestemmelsene og førstehjelp ved strømulykker, inkludert hjerte‑lunge‑redning. Har du kurs i januar ett år, bør neste altså være senest januar året etter, ikke en gang i løpet av neste kalenderår.", "40": "Elulykker med personskade skal meldes til DSB, som er tilsynsmyndighet for elsikkerhet. Det gjelder også når skaden virker liten, fordi strøm kan gi senskader på hjerte og nerver. Meldingen brukes til å lære av ulykker og forebygge nye. Arbeidsgiver har i tillegg egne plikter etter arbeidsmiljøloven til å varsle Arbeidstilsynet og politiet ved alvorlige skader.", "41": "FSE krever at alt arbeid planlegges før det starter. Det betyr å vurdere risiko, velge arbeidsmetode, finne ut hvilket verktøy og verneutstyr som trengs, og velge og instruere personell som er kvalifisert for jobben. Planleggingskravet står i § 10. Paragrafene 14 og utover beskriver selve arbeidsmetodene som velges i planleggingen.", "42": "NEK EN 50110‑1 er europeisk norm for drift av elektriske anlegg og beskriver arbeidsmetoder, roller og sikkerhetstiltak. DSB viser til at normen, sammen med FSE og veiledningen, oppfyller sikkerhetskravene i forskriften. NEK 400 hører til FEL og gjelder bygging av anlegget, mens NEK EN 60204‑1 gjelder elektrisk utstyr på maskiner.", "43": "I komplekse lavspenningsanlegg, typisk industri med mange tavler og forsyninger, er det vanskelig å ha oversikt over hva som mater hva. Derfor krever FSE at det finnes enlinjeskjema og oppdatert dokumentasjon tilgjengelig. Det gjør det mulig å frakoble riktig og sikkert. Vedlikehold skal i tillegg skje etter fastsatte prosedyrer.", "44": "Arbeidsmiljøloven § 2‑3 beskriver arbeidstakers medvirkningsplikt. Den sier blant annet at du skal avbryte arbeidet hvis du mener det ikke kan fortsette uten fare for liv eller helse. Det er altså både en rett og en plikt. § 6‑3 handler om verneombudets rett til å stanse arbeid, som er en annen bestemmelse.", "45": "Arbeidsmiljøloven legger hovedansvaret for helse, miljø og sikkerhet på arbeidsgiver. Arbeidsgiver skal sørge for at risiko kartlegges, at det finnes rutiner og at ansatte får opplæring og verneutstyr. Arbeidstakere har medvirkningsplikt, og verneombudet ivaretar de ansattes interesser, men ingen av dem overtar arbeidsgivers ansvar. Arbeidstilsynet fører tilsyn.", "46": "Internkontrollforskriften krever at alle virksomheter jobber systematisk med HMS. Det betyr å kartlegge farer, vurdere risiko, sette mål, lage rutiner, gi opplæring og følge opp avvik. Forskriften omfatter både arbeidsmiljø, elsikkerhet, brann og ytre miljø. FSE og FEL gir krav til elsikkerhet, men selve systemkravet ligger i internkontrollforskriften.", "47": "Et sikkerhetsdatablad (SDS) beskriver farene ved et kjemikalie og hvordan det skal brukes, lagres og avhendes. Det inneholder også verneutstyr, førstehjelp og hva du gjør ved søl eller brann. Bladet skal være tilgjengelig for alt du bruker, for eksempel rensevæske, kontaktspray, lim og maling. Det har ingenting med sikkerhetskomponenter i maskiner å gjøre.", "48": "RUH står for rapport om uønsket hendelse. Den brukes til å melde ulykker, nestenulykker og farlige forhold, slik at virksomheten kan finne årsaken og hindre at det skjer igjen. En nestenulykke, for eksempel en kabel som var spenningsførende selv om den skulle vært frakoblet, er like viktig å melde som en faktisk skade.", "49": "Verneombudet har etter arbeidsmiljøloven rett til å stanse arbeid ved umiddelbar fare for liv og helse, hvis faren ikke kan avverges på annen måte. Arbeidet står stille til arbeidsgiver har vurdert om det er trygt å fortsette. Verneombudet trenger ikke vente på Arbeidstilsynet, og kan verken gi bot eller si opp noen.", "50": "Ser du en fare som kan skade deg eller andre, skal du avbryte arbeidet og varsle arbeidsgiver og verneombud. Det følger av medvirkningsplikten i arbeidsmiljøloven. Å fullføre raskt først kan være akkurat det som fører til ulykken. Varslingen gjør det mulig å rette faren og, via en RUH, hindre at den oppstår igjen.", "51": "Tiltakshierarkiet sier at det mest effektive er å fjerne faren helt, for eksempel ved å frakoble anlegget. Deretter kommer tekniske tiltak som avskjerming, verneinnretninger og sikkerhetsfunksjoner, så organisatoriske tiltak som prosedyrer, opplæring og arbeidstillatelse. Personlig verneutstyr er siste skanse, fordi det bare virker hvis det brukes riktig hver gang.", "52": "EE‑avfall, som kretskort, PLS‑er, frekvensomformere, lysrør og batterier, inneholder miljøgifter som bly, kvikksølv og bromerte flammehemmere. Det skal derfor kildesorteres og leveres til godkjent mottak, der det demonteres og gjenvinnes forsvarlig. Restavfall, brenning eller metallcontainer gir utslipp av miljøgifter og er ikke tillatt.", "53": "En arbeidstillatelse er et skriftlig system for å styre arbeid med risiko, som varmt arbeid, arbeid i tanker eller arbeid på anlegg i drift. Den viser hvem som skal gjøre hva, hvilke sikkerhetstiltak som er gjort, og hvem som har godkjent arbeidet. Slik vet både driften og de som jobber hva som pågår. AT erstatter ikke SJA, de brukes ofte sammen.", "54": "Ohms lov sier at strømmen er spenning delt på motstand: I = U / R. Her blir det I = 24 V / 120 Ω = 0,2 A. Et vanlig feiltrinn er å flytte kommaet feil og få 2 A eller 0,02 A, så sjekk alltid at svaret virker rimelig. 0,2 A er typisk for en liten last på 24 V, for eksempel en reléspole eller en signallampe.", "55": "I parallell får strømmen flere veier å gå, så total motstand blir alltid mindre enn den minste enkeltmotstanden. Formelen er 1/Rt = 1/R1 + 1/R2 = 1/100 + 1/100 = 2/100, som gir Rt = 50 Ω. For to like motstander kan du bare ta halvparten. 200 Ω ville vært svaret for seriekobling, ikke parallell.", "56": "I en seriekrets må strømmen gjennom alle motstandene etter hverandre, så motstandene legges sammen: Rt = R1 + R2 = 100 Ω + 220 Ω = 320 Ω. Total motstand i serie er alltid større enn den største enkeltmotstanden. 69 Ω er det du ville fått med parallellkobling, og det er derfor et typisk forvekslingssvar.", "57": "I en spenningsdeler går samme strøm gjennom begge motstandene, så spenningen fordeler seg i forhold til motstandsverdiene. Formel: U2 = U · R2 / (R1 + R2) = 24 V · 2 kΩ / 3 kΩ = 16 V. Resten, 8 V, ligger over 1 kΩ. Den største motstanden får alltid den største delen av spenningen, så 8 V over 2 kΩ kan ikke stemme.", "58": "Effekt i en likestrømskrets er spenning ganger strøm: P = U · I. Her blir det P = 24 V · 2 A = 48 W. Dette er nyttig når du skal dimensjonere en 24 V DC-forsyning i tavla: summer effekten til alle forbrukerne og legg på litt margin. 12 W får du hvis du deler i stedet for å gange.", "59": "I et symmetrisk trefasesystem regner man med linjespenning U og linjestrøm I. Faktoren √3 (ca. 1,73) kommer av at linjespenningen er √3 ganger fasespenningen, og cos φ tar med at bare en del av den tilsynelatende effekten er aktiv effekt. Eksempel: 400 V, 10 A og cos φ 0,85 gir P = 1,73 · 400 · 10 · 0,85 ≈ 5,9 kW. Formelen 3 · U · I gjelder bare hvis du bruker fasespenning.", "60": "I et 400 V TN-nett er linjespenningen målt mellom to faser, mens fasespenningen er målt mellom fase og nøytral. Forholdet er √3: Ufase = Ulinje / √3 = 400 / 1,732 ≈ 230 V. Derfor får du 230 V mellom fase og N og 400 V mellom to faser i samme anlegg. 690 V er linjespenningen i et annet spenningsnivå og hører ikke hjemme her.", "61": "I trekantkobling ligger hver viklingsfase mellom to linjer. Strømmen i hver linjeleder blir summen av to fasestrømmer som er faseforskjøvet 120°, og det gir linjestrøm = √3 · fasestrøm. I stjernekobling er det motsatt: der er linjestrøm lik fasestrøm, mens spenningen har faktoren √3. Dette er grunnlaget for stjerne/trekant-start, der startstrømmen reduseres til omtrent en tredjedel.", "62": "Effektivverdien er den verdien som gir samme varmeeffekt som tilsvarende likespenning, og det er den multimeteret viser. For en ren sinus er toppverdien √2 ganger effektivverdien: Û = 1,414 · 230 V ≈ 325 V. Dette er viktig når du velger komponenter, for eksempel varistorer eller kondensatorer i en likeretter, som må tåle toppverdien og ikke bare 230 V.", "63": "24 V DC er standard for PLS-innganger og utganger, givere, reléspoler og ventiler i moderne tavler. Spenningen er lav nok til at berøringsfaren er liten, men høy nok til å gi god støymargin over lange kabler. Den hentes fra en egen 230 V AC til 24 V DC strømforsyning i tavla. 230 V AC styrespenning finnes i eldre anlegg, men gir høyere risiko ved feilsøking.", "64": "En reléspole lagrer energi i magnetfeltet. Når transistoren eller kontakten bryter strømmen, prøver spolen å holde strømmen oppe og lager en høy spenningstopp med motsatt polaritet. Frihjulsdioden kobles i sperreretning over spolen, slik at strømmen kan sirkulere gjennom dioden og dø ut. Da beskyttes PLS-utgangen mot overspenning. Ulempen er at reléet slipper litt tregere.", "65": "I en seriekrets finnes det bare én vei for strømmen, så den samme strømmen går gjennom alle komponentene. Det er spenningen som fordeler seg, og den største motstanden får størst spenningsfall. Derfor kobles amperemeteret i serie, og derfor stopper hele kretsen hvis én komponent får brudd, slik som en kjede av NC-stoppbrytere i en sikkerhetskrets.", "66": "En kondensator består av to plater med isolasjon mellom. Når du legger på likespenning, går det en ladestrøm til spenningen over kondensatoren er lik forsyningsspenningen. Deretter går det ingen strøm, og kondensatoren oppfører seg som et brudd. For vekselspenning lades den opp og ut hele tiden, og da slipper den gjennom strøm. Det er derfor kondensatorer brukes til å skille DC fra AC-signaler.", "67": "En spole motsetter seg endringer i strømmen, ikke strømmen i seg selv. Når likestrømmen har stabilisert seg, er det ingen endring, og en ideell spole uten resistans oppfører seg som en kortslutning. I praksis er det bare viklingens kobbermotstand som begrenser strømmen. Derfor kan en spole beregnet for vekselspenning brenne opp hvis den kobles til samme verdi i DC.", "68": "Motorer trekker reaktiv effekt for å bygge opp magnetfeltet, og det gir lav cos φ og unødvendig høy strøm i kabler og trafo. Kondensatorer leverer reaktiv effekt med motsatt fortegn, så et kondensatorbatteri nær lasten kan dekke dette lokalt. Da synker strømmen fra nettet, tapene går ned, og man unngår eventuelle tariffer for reaktiv effekt. Større sikringer endrer ikke effektfaktoren.", "69": "I en ideell transformator er effekten lik på primær- og sekundærsiden: U1 · I1 = U2 · I2. Det gir I2 = I1 · U1 / U2 = 1 A · 230 / 24 ≈ 9,6 A. Når spenningen transformeres ned, går strømmen tilsvarende opp. Derfor har sekundærsiden på en styrestrømstrafo tykkere viklinger og trenger vern dimensjonert for den høyere strømmen.", "70": "For å måle strøm må all strømmen gå gjennom instrumentet, og da må det kobles i serie med lasten. Du bryter kretsen og setter amperemeteret inn i bruddet. Amperemeteret har svært lav indre motstand, så det påvirker kretsen lite. Kobler du det parallelt med lasten eller mellom fase og jord, lager du en kortslutning. Voltmeteret kobles derimot parallelt.", "71": "Et tangamperemeter har en tang som legges rundt én leder og måler magnetfeltet strømmen lager. Du slipper å bryte kretsen, noe som sparer tid og er tryggere i en spenningssatt tavle. Tangen må bare omslutte én leder, for legger du den rundt en hel kabel med fase og nøytral, opphever feltene hverandre og du får tilnærmet null. Isolasjonsmåling krever et eget instrument.", "72": "I strømposisjon har multimeteret nesten null indre motstand, fordi det skal kobles i serie. Setter du probene over en spenningskilde, kortslutter du den gjennom instrumentet. Det går da en stor strøm, og den interne sikringen i måleren kan gå. Med et dårlig sikret instrument på et kraftig anlegg kan det oppstå lysbue. Sjekk derfor alltid velger og probeplassering før måling.", "73": "Kabeltverrsnitt velges ut fra flere forhold samtidig. Kabelen må tåle belastningsstrømmen ved den aktuelle forlegningsmåten, siden kabler i rør, isolasjon eller samlet i bunt kjøles dårligere. Spenningsfallet må holde seg innenfor akseptable grenser, noe som betyr mye ved lange kabler. Vernet må også beskytte kabelen mot overlast og kortslutning, slik NEK 400 krever. Spenningen alene bestemmer isolasjonsnivået, ikke tverrsnittet.", "74": "Motstanden i en leder beregnes med R = ρ · l / A, der ρ er resistiviteten, l er lengden og A er tverrsnittet. Motstanden er proporsjonal med lengden, så dobbel lengde gir dobbel motstand. Det er derfor spenningsfallet øker på lange kabelstrekk. Dobler du derimot tverrsnittet, halveres motstanden.", "75": "I binærtall har hver posisjon en vekt som er en potens av 2, fra høyre: 1, 2, 4, 8. For 1010 blir det 1 · 8 + 0 · 4 + 1 · 2 + 0 · 1 = 8 + 2 = 10. Du legger bare sammen vektene der det står 1. Svaret 5 får du hvis du leser tallet baklengs.", "76": "Heksadesimalt bruker grunntall 16, med sifrene 0 til 9 og A til F, der F = 15. FF blir 15 · 16 + 15 · 1 = 240 + 15 = 255. Det er den største verdien én byte kan ha, altså 8 bit med bare enere. 256 er antall mulige verdier (0 til 255), ikke den største verdien.", "77": "Heksadesimale siffer har vekter som er potenser av 16. Sifferet til venstre teller 16-ere, det til høyre teller enere. 64 hex blir 6 · 16 + 4 · 1 = 96 + 4 = 100 desimalt. Det er lett å tro at 64 hex er 64, men det gjelder bare i desimal. I PLS-programmering skrives heks ofte som 16#64 for å unngå forveksling.", "78": "En byte består av 8 bit og kan ha 256 ulike verdier, fra 0 til 255. I IEC 61131-3 bygges datatypene videre på dette: BYTE er 8 bit, WORD er 16 bit og DWORD er 32 bit. Fire bit kalles ofte en nibble og tilsvarer ett heksadesimalt siffer. Derfor skrives en byte med to heksadesiffer.", "79": "Hver binær inngang kan være 0 eller 1, altså to tilstander. Med flere innganger ganges mulighetene: 2 · 2 · 2 · 2 = 2⁴ = 16 kombinasjoner. Generelt gir n innganger 2ⁿ kombinasjoner. Dette er antall rader du får i en sannhetstabell med fire innganger, og det er også grunnen til at 4 bit kan telle fra 0 til 15.", "80": "XOR står for eksklusiv eller. Utgangen blir 1 når én og bare én av inngangene er 1, altså når inngangene er ulike. Er begge 0 eller begge 1, blir utgangen 0. Det siste alternativet beskriver en vanlig OR, som også gir 1 når begge er 1. XOR brukes blant annet til å oppdage endringer eller sammenligne to signaler.", "81": "NAND er en AND-port med invertert utgang. En AND gir 1 bare når alle innganger er 1, så NAND gir 0 i akkurat det tilfellet og 1 i alle andre. Er én eller flere innganger 0, er utgangen 1. NAND kalles en universell port fordi alle andre logiske funksjoner kan bygges med bare NAND-porter.", "82": "BCD står for Binary Coded Decimal. Hvert desimalsiffer kodes for seg med 4 bit, så tallet 59 blir 0101 1001 i stedet for den rene binærverdien 111011. Kombinasjonene 1010 til 1111 brukes ikke. Formatet er praktisk mot utstyr som jobber siffer for siffer, for eksempel tommelhjulsbrytere og 7-segmentdisplayer, og mange PLS-er har egne konverteringsfunksjoner for BCD.", "83": "16 bit gir 2¹⁶ = 65536 ulike verdier. Med fortegn brukes toerkomplement, og verdiene fordeles fra −32768 til 32767, der null tar én plass på den positive siden. Uten fortegn (UINT eller WORD) går området fra 0 til 65535. Overskrider en INT 32767, slår den over til negative verdier, noe som kan gi rare feil i tellere.", "84": "REAL er et 32-bits flyttall i IEC 61131-3 og kan lagre desimaltall som 21,7 °C. INT og BYTE er heltall og mister desimalene, og BOOL kan bare være sann eller usann. Når en analog inngang skaleres fra råverdi til ingeniørenhet, gjøres beregningen derfor vanligvis i REAL. Alternativt kan man lagre tideler i en INT, men det krever at alle husker skaleringen.", "85": "DINT står for Double Integer og er et heltall på 32 bit med fortegn, altså dobbelt så langt som INT på 16 bit. Området er omtrent ±2,1 milliarder. DINT brukes når INT ikke strekker til, for eksempel i pulstellere fra encodere eller akkumulerte driftstider. LINT er 64-bits varianten.", "86": "Med 4 mA som laveste verdi kalles signalet live zero. Når målingen er på 0 %, går det fortsatt 4 mA i sløyfa, så 0 mA betyr at noe er galt, for eksempel kabelbrudd eller død transmitter. Med 0–20 mA kunne du ikke skilt 0 % fra brudd. I tillegg gir de 4 mA nok strøm til å drive elektronikken i en 2-leder transmitter.", "87": "Signalet har et spenn på 20 − 4 = 16 mA som tilsvarer 0–10 bar. Trekk først fra live zero, og regn ut andelen av spennet: (12 − 4) / 16 = 8 / 16 = 0,5. Ganger du med måleområdet, får du 0,5 · 10 bar = 5 bar. 12 mA er alltid 50 % i et 4–20 mA signal. Svaret 6 bar kommer av å glemme å trekke fra 4 mA.", "88": "Trekk fra live zero og del på spennet på 16 mA: (8 − 4) / 16 = 4 / 16 = 0,25. Det betyr 25 % av området. Med 0–100 °C blir det 0,25 · 100 °C = 25 °C. Svaret 40 °C får du hvis du deler 8 på 20 uten å ta hensyn til at signalet starter på 4 mA.", "89": "Signalet starter på 4 mA ved 0 % og har et spenn på 16 mA. Formel: I = 4 mA + andel · 16 mA = 4 + 0,75 · 16 = 4 + 12 = 16 mA. Svaret 15 mA kommer av å regne 75 % av 20 mA og glemme live zero. Husk: 25 % er 8 mA, 50 % er 12 mA og 75 % er 16 mA.", "90": "Span er bredden på måleområdet, altså øvre områdeverdi (URV) minus nedre områdeverdi (LRV). Her blir det 150 °C − (−50 °C) = 150 + 50 = 200 °C. Å trekke fra et negativt tall gir pluss. Span brukes i skaleringen: 4 mA tilsvarer −50 °C, 20 mA tilsvarer 150 °C, og hver mA tilsvarer 200 / 16 = 12,5 °C.", "91": "NAMUR NE43 er en anbefaling fra prosessindustrien som skiller normale måleverdier fra feilsignaler. Normalt område er omtrent 3,8 til 20,5 mA, slik at litt over- og underskridelse av måleområdet kan vises. Under 3,6 mA eller over 21 mA tolkes som feil, for eksempel brudd i sløyfa eller at transmitteren har oppdaget en intern feil og sender et alarmnivå. PLS-en kan da gi alarm i stedet for å vise en falsk verdi.", "92": "En presisjonsmotstand i serie med sløyfa gjør strømmen om til spenning etter Ohms lov, U = I · R. Med 250 Ω får du 0,004 A · 250 Ω = 1 V ved 4 mA og 0,020 A · 250 Ω = 5 V ved 20 mA. Det brukes når en analog inngang bare leser spenning. Med 500 Ω ville du fått 2–10 V, som er en annen standard.", "93": "Forsyningsspenningen i sløyfa må dekke både minstespenningen transmitteren trenger og spenningsfallet over lasten, som inngangsmotstand, kabel og eventuelle displayer. Det verste tilfellet er ved 20 mA. Eksempel: med 24 V forsyning og 12 V minstespenning til transmitteren blir maks last (24 − 12) / 0,020 = 600 Ω. Er lasten større, klarer ikke transmitteren å drive full strøm, og signalet stopper under 20 mA.", "94": "En 2-leder transmitter har bare to tilkoblinger som både forsyner den og bærer signalet. Forsyningen på 24 V DC ligger i serie med transmitter og analog inngang, og transmitteren regulerer hvor mye strøm som går, fra 4 til 20 mA. Elektronikken klarer seg med de 4 mA som alltid går. En 4-leder transmitter har derimot egen forsyning og egne signalledere.", "95": "En signalisolator skiller inngang og utgang galvanisk, vanligvis med en liten trafo eller optokobler, slik at det ikke er noen direkte elektrisk forbindelse mellom dem. Det bryter jordsløyfer som oppstår når to deler av anlegget har litt ulikt jordpotensial og det går utjevningsstrøm i signalkabelen. Uten skille kan målingen bli ustabil eller feil. Isolatoren beskytter også PLS-en mot støy og overspenning fra feltet.", "96": "PT100 er en motstandsføler av platina, og tallet 100 betyr at den har 100 Ω ved 0 °C. Motstanden øker når temperaturen stiger, til rundt 138,5 Ω ved 100 °C. En PT1000 har tilsvarende 1000 Ω ved 0 °C. Med et vanlig ohmmeter kan du derfor raskt sjekke om en PT100 virker: ved romtemperatur skal den vise litt over 100 Ω.", "97": "Platina har en temperaturkoeffisient på ca. 0,00385 per °C, altså endrer motstanden seg med 0,385 % av verdien ved 0 °C per grad. For PT100 blir det 100 Ω · 0,00385 = 0,385 Ω/°C. Over 100 °C gir det 100 + 38,5 = 138,5 Ω. Fordi endringen er så liten, gir selv noen få ohm ledningsmotstand flere graders målefeil.", "98": "Ved 2-leder kobling måles ledningsmotstanden sammen med sensoren. To ledere med til sammen 1 Ω ekstra gir omtrent 2,6 °C feil, siden PT100 bare endrer seg 0,385 Ω per grad. Med 3-leder måles ledningsmotstanden og trekkes fra, forutsatt at lederne er like. 4-leder kobling bruker egne ledere for målestrøm og spenningsmåling, og fjerner påvirkningen nesten helt.", "99": "Et termoelement består av to ulike metaller som er sveiset sammen i målepunktet. Når det er temperaturforskjell mellom målepunktet og tilkoblingspunktet, oppstår det en liten spenning i millivoltområdet. Dette kalles Seebeck-effekten. Spenningen avhenger av temperaturforskjellen, ikke av den absolutte temperaturen. Det er PT100 som virker ved at motstanden endrer seg med temperaturen.", "100": "Et termoelement måler temperaturforskjellen mellom målepunktet og punktet der det kobles til instrumentet, det såkalte kaldloddet. Instrumentet vet ikke hva temperaturen der er, og derfor måler det den med en egen intern føler og legger den til. Uten kompensering ville målingen vandret med temperaturen i tavla. Det kalles kaldlodd fordi man i laboratoriet tidligere holdt dette punktet i isvann på 0 °C.", "101": "Termoelementet måler bare riktig hvis lederne er av samme eller tilsvarende materiale helt fram til tilkoblingen med kaldloddskompensering. Bruker du vanlig kobberkabel, oppstår det nye metalloverganger i koblingsboksen som virker som egne termoelementer og gir målefeil. Kompensasjons- eller forlengelseskabel er laget for den aktuelle typen, for eksempel type K, og har egen fargekode. Polariteten må også være riktig.", "102": "PT100 brukes vanligvis opp til noen hundre grader og er svært nøyaktig og stabil i lave og middels temperaturområder. Termoelementer tåler mye høyere temperaturer, for eksempel type K opp mot 1200 °C og platinatyper enda høyere. De er også robuste og reagerer raskt. Derfor velges termoelement i ovner, avgass og smelteprosesser, mens PT100 er førstevalget i HVAC og vanlig prosess.", "103": "HART legger et digitalt signal oppå det analoge 4–20 mA signalet ved å veksle mellom to frekvenser (FSK). Gjennomsnittet av det digitale signalet er null, så den analoge målingen påvirkes ikke. Med en HART-kommunikator eller via systemet kan du lese av diagnose, endre måleområde og sjekke instrumentdata uten å gå ut til transmitteren. Det er ikke en Ethernet-buss, men bruker den vanlige tolederkabelen.", "104": "En induktiv giver lager et vekslende magnetfelt foran sensorflaten. Når metall kommer inn i feltet, oppstår det virvelstrømmer som demper feltet, og giveren slår om. Plast, tre og væske påvirker ikke feltet, så de blir ikke detektert. Rekkevidden er størst for stål og kortere for aluminium og kobber. Induktive givere brukes mye som endebrytere på maskiner fordi de er robuste og uten bevegelige deler.", "105": "En kapasitiv giver måler endringer i det elektriske feltet foran sensorflaten og reagerer på materialer med en annen dielektrisitet enn luft. Den kan derfor detektere granulat, pulver og væske, også gjennom en vegg av plast eller glass. Induktive givere og Hall-givere reagerer bare på metall eller magnetfelt, og en reed-kontakt trenger en magnet. Følsomheten justeres ofte med en skrue for å unngå å reagere på selve veggen.", "106": "En PNP-giver har en transistor som kobler utgangen til pluss, 24 V, når den er aktiv. Lasten, for eksempel en PLS-inngang, er koblet mellom utgangen og 0 V. Dette kalles sourcing og er vanligst i Europa. En NPN-giver kobler i stedet utgangen til 0 V og kalles sinking. Giver og inngangskort må passe sammen, ellers blir signalet aldri registrert.", "107": "Ved gjennomstråling sitter sender og mottaker hver for seg, og lyset går bare én vei direkte til mottakeren. Det gir mest lys tilbake og derfor lengst rekkevidde og best driftssikkerhet i støvete miljø. En refleksfotocelle må sende lyset fram og tilbake via reflektoren, og en diffus fotocelle får bare tilbake det lille som reflekteres fra objektet. Ulempen ved gjennomstråling er at du må trekke kabel til begge sider.", "108": "En absolutt encoder har en kodeskive der hver posisjon har sin unike kode, så den vet alltid nøyaktig hvor den står, også rett etter oppstart eller spenningsbrudd. En inkremental encoder sender bare pulser som styringen teller. Etter spenningsbrudd er tellingen tapt, og maskinen må referansekjøres mot en kjent posisjon. Absolutt encoder er derfor nyttig der referansekjøring er upraktisk eller farlig.", "109": "En blende er en plate med et hull som struper strømmen i røret. Når væsken presses gjennom, øker hastigheten og trykket faller etter hullet. Trykkforskjellen over blenden henger sammen med hvor mye som strømmer. Strømningen er proporsjonal med kvadratroten av differansetrykket, så signalet må rotutdras i transmitter eller PLS. Differansetrykk brukes også til nivå i lukkede tanker, men da uten blende.", "110": "En magnetisk mengdemåler lager et magnetfelt på tvers av røret. Når en ledende væske strømmer gjennom feltet, induseres det en spenning etter Faradays lov, og spenningen er proporsjonal med hastigheten. Elektroder i rørveggen fanger opp spenningen. Det krever at væsken har en viss ledningsevne, så den passer for vann og avløp, men ikke for olje, gass eller avionisert vann.", "111": "En Coriolismåler sender væsken gjennom rør som settes i svingninger. Massestrømmen gir en vridning i rørene på grunn av Corioliskraften, og vridningen er proporsjonal med massestrømmen. Svingefrekvensen avhenger av tettheten til mediet, så måleren gir tetthet i tillegg. Fordi den måler masse direkte, trenger den ikke korrigering for trykk og temperatur slik volumetriske målere ofte gjør.", "112": "I en vortexmåler står et hinder midt i røret. Når væske eller gass strømmer forbi, løsner det virvler vekselvis på hver side, omtrent som når et flagg blafrer i vinden. Antall virvler per sekund er proporsjonal med strømningshastigheten, og en sensor teller frekvensen. Måleren har ingen bevegelige deler og brukes mye på damp og gass, men trenger en minimumshastighet for å gi stabile virvler.", "113": "Hydrostatisk trykk regnes med p = ρ · g · h. For vann er ρ ≈ 1000 kg/m³ og g ≈ 9,81 m/s². Med h = 10 m blir p = 1000 · 9,81 · 10 = 98 100 Pa ≈ 98 kPa, som er omtrent 1 bar. Tommelfingerregelen er 0,1 bar per meter vannsøyle. Den brukes mye ved nivåmåling med trykktransmitter i bunnen av en tank.", "114": "En radarnivåmåler sender mikrobølger ned mot overflaten og måler tiden det tar før ekkoet kommer tilbake. Avstanden til overflaten blir da halve gangtiden ganger utbredelseshastigheten, og nivået finnes ved å trekke den fra tankhøyden. Mikrobølger påvirkes lite av damp, temperatur og trykk. Ultralyd virker på samme måte, men lydhastigheten endrer seg med temperatur og gassammensetning.", "115": "Bara står for bar absolutt og er trykket målt mot perfekt vakuum. Barg står for bar gauge og er overtrykk målt mot atmosfæretrykket rundt oss. Sammenhengen er bara ≈ barg + 1,013. Et dekk med 2 barg har altså omtrent 3 bara. Det er viktig å vite hvilket du har, siden en transmitter av feil type kan gi omtrent 1 bar feil.", "116": "En lastcelle er et metallelement som deformeres litt når det belastes. Strekklapper limt på elementet endrer motstand når de strekkes eller trykkes sammen. Fire strekklapper kobles i en Wheatstone-bro, som gir en liten spenning i millivoltområdet proporsjonal med kraften. Broen kompenserer også for temperatur. Signalet forsterkes i en veieforsterker og brukes til vektmåling i siloer, tanker og doseringsanlegg.", "117": "pH er et mål på konsentrasjonen av hydrogenioner i en løsning, på en skala fra 0 til 14. Ved pH 7 er løsningen nøytral, slik rent vann er ved 25 °C. Under 7 er løsningen sur og over 7 er den basisk. Skalaen er logaritmisk, så pH 5 er ti ganger surere enn pH 6. pH-måling er vanlig i vannrensing og avløpsanlegg.", "118": "Sporbar kalibrering betyr at instrumentet er sammenlignet mot en referanse som selv er kalibrert mot en enda bedre referanse, i en ubrutt kjede tilbake til nasjonale eller internasjonale standarder. Hvert ledd skal ha dokumentert måleusikkerhet og sertifikat. Da kan du stole på at målingen faktisk stemmer. At produsenten har justert instrumentet, er ikke det samme som at kalibreringen er sporbar.", "119": "As found er verdiene du registrerer før du gjør noen justering, altså slik instrumentet faktisk målte i drift. As left er verdiene etter justering. Begge føres i kalibreringsrapporten. As found er viktig fordi det viser hvor mye instrumentet har drevet siden forrige kalibrering, og om målinger i perioden kan ha vært feil. Det hjelper også med å bestemme riktig kalibreringsintervall.", "120": "Ved å teste fem punkter, 0, 25, 50, 75 og 100 % av området, ser du både nullpunktsfeil, spennfeil og linearitetsfeil. Tester du bare endepunktene, kan transmitteren være riktig i 0 og 100 % men feil i midten. For en 4–20 mA transmitter tilsvarer punktene 4, 8, 12, 16 og 20 mA. Kjøres punktene både stigende og synkende, avdekkes også hysterese.", "121": "Hysterese betyr at instrumentet viser ulik verdi for samme målestørrelse avhengig av om verdien stiger eller synker. Eksempel: en trykktransmitter viser 5,02 bar på vei opp og 4,97 bar på vei ned ved samme faktiske trykk. Årsaken er ofte friksjon i mekaniske deler eller elastiske egenskaper i membranen. Hysterese finnes ved å kalibrere både stigende og synkende, og er ikke det samme som responstid.", "122": "En ventilposisjoner sitter på aktuatoren og får styresignalet fra regulatoren, typisk 4–20 mA. Den måler ventilens faktiske stilling via en tilbakemeldingsarm og justerer lufttrykket til aktuatoren til stillingen stemmer med signalet. Slik kompenseres friksjon i pakkboksen og krefter fra prosessmediet, så ventilen havner der den skal. Moderne digitale posisjonere gir i tillegg diagnose, for eksempel om ventilen henger.", "123": "I/P står for strøm (I) til trykk (P). Omformeren tar imot 4–20 mA fra regulator eller PLS og gir ut et proporsjonalt lufttrykk, typisk 0,2–1 bar, som styrer en pneumatisk aktuator. 4 mA gir 0,2 bar og 20 mA gir 1 bar. Det motsatte, å gjøre trykk om til strøm, er jobben til en trykktransmitter.", "124": "Kv‑verdien forteller hvor mange m³/h vann ved ca. 15–20 °C som går gjennom ventilen når trykkfallet over den er 1 bar. Kvs er verdien ved full åpning. Sammenhengen er Q = Kv · √(Δp), med Δp i bar for vann. Kv brukes til å velge riktig ventilstørrelse: for liten ventil gir for lite mengde, for stor ventil regulerer dårlig fordi den jobber nesten stengt.", "125": "En aktuator som er «luft for å åpne» har en fjær som presser ventilen mot stengt, mens lufttrykket åpner den. Forsvinner instrumentluften, er det bare fjærkraften igjen, og ventilen går til stengt. Dette kalles fail closed (FC). Valget gjøres ut fra hva som er tryggest, for eksempel at en dampventil til en varmeveksler stenger ved lufttap.", "126": "Her åpner fjæren ventilen, og lufttrykket brukes til å stenge den. Ved tap av instrumentluft eller signal tar fjæren over, og ventilen går helt åpen. Dette kalles fail open (FO). Det velges der åpen ventil er sikrest, for eksempel kjølevann til en reaktor eller en kompressor, slik at kjølingen fortsetter selv om styringen faller ut.", "127": "Med likeprosentig karakteristikk gir hver like store økning i åpning samme prosentvise økning i mengden, regnet av mengden man allerede har. Ved liten åpning blir endringene små, ved stor åpning store. Det gir fin regulering i nedre del og kompenserer for at trykkfallet over ventilen ofte synker når mengden øker. Lineær karakteristikk, der mengden er proporsjonal med åpningen, er et annet alternativ.", "128": "En seteventil (globe) har en kjegle som beveger seg mot et sete, og strupingen endrer seg jevnt og forutsigbart med slaget. Den tåler å stå delvis åpen over tid og kan leveres med ulike karakteristikker. Kuleventil med full boring og sluseventil er laget for helt åpen eller helt stengt og regulerer dårlig, og sluseventilen slites ved struping. Tilbakeslagsventil hindrer bare tilbakestrømning.", "129": "Når væske går gjennom en trang passasje i ventilen, øker hastigheten og trykket synker. Faller trykket under væskens damptrykk, koker væsken lokalt og danner dampbobler. Når trykket stiger igjen nedstrøms, kollapser boblene voldsomt og gir trykkstøt som river løs materiale. Resultatet er støy som høres ut som grus i røret, vibrasjoner og erosjonsskader på kjegle, sete og rør.", "130": "Etter affinitetslovene er mengden proporsjonal med turtallet, trykket med turtallet i andre og effekten med turtallet i tredje potens. Ved 80 % turtall blir effekten 0,8³ ≈ 0,51, altså omtrent halvparten. Ved struping går pumpen på fullt turtall, og ventilen brenner av overskuddsenergien som trykkfall. Derfor sparer en frekvensomformer mye energi på pumper og vifter med varierende behov.", "131": "Endebrytere, ofte i en bryterboks oppå aktuatoren, gir et digitalt signal til PLS‑en når ventilen er helt åpen eller helt stengt. Da vet styresystemet at ventilen faktisk har gått dit den ble kommandert. Når den ikke er i endeposisjon innen en gitt tid, gis en gangtidsalarm. Tilbakemeldingen brukes også i forriglinger, for eksempel at en pumpe ikke starter før sugeventilen er bekreftet åpen.", "132": "En P‑regulator gir pådrag u = Kp · e, altså proporsjonalt med avviket. For å holde et pådrag forskjellig fra arbeidspunktet må det derfor finnes et avvik. Når belastningen endres, stabiliserer prosessen seg med et blivende avvik mellom settpunkt og måling. Økt Kp gjør avviket mindre, men aldri null, og for høy Kp gir svingninger. Derfor legges det vanligvis til et I‑ledd.", "133": "I‑leddet summerer (integrerer) avviket over tid. Så lenge det finnes et avvik, fortsetter I‑bidraget å vokse og flytter pådraget. Først når avviket er null, slutter det å endre seg, og da står pådraget på akkurat den verdien som trengs. Derfor fjerner I‑leddet det stasjonære avviket som en ren P‑regulator etterlater. Integraltiden Ti bestemmer hvor raskt dette skjer.", "134": "D‑leddet ser på endringshastigheten, altså hvor fort avviket eller målingen beveger seg. Stiger temperaturen raskt, reagerer D‑leddet med en gang, før avviket rekker å bli stort, og demper oversving. Mange regulatorer deriverer målingen i stedet for avviket for å unngå et kraftig sprang i pådraget ved settpunktendring. Ulempen er at rask målestøy gir store D‑bidrag.", "135": "Mengdesløyfer er i seg selv raske, med små tidskonstanter, så det er lite å hente på D‑virkning. Samtidig er mengdemålinger ofte støyete på grunn av turbulens. D‑leddet reagerer på endringshastighet og forsterker derfor støyen kraftig, noe som gir et urolig pådrag og unødig slitasje på ventilen. Derfor brukes vanligvis PI‑regulator på mengde, og D‑ledd heller på trege prosesser som temperatur.", "136": "Pådraget er det regulatoren sender ut, for eksempel 4–20 mA til en ventil eller et turtallsreferanse til en frekvensomformer. Det kalles ofte MV eller OP. Settpunkt (SP) er ønsket verdi, måling (PV) er faktisk verdi, og avviket er e = SP − PV. Regulatoren regner ut pådraget fra avviket, og pådragsorganet påvirker prosessen.", "137": "Proporsjonalbånd (PB) er hvor mange prosent av måleområdet avviket må endre seg for at pådraget skal gå over hele området 0–100 %. Sammenhengen er Kp = 100 / PB. Med PB = 50 % blir Kp = 100 / 50 = 2. Lite proporsjonalbånd betyr altså høy forsterkning, og stort bånd betyr lav forsterkning.", "138": "Ved et sprang i pådraget stiger en førsteordens prosess raskt først og flater ut mot sluttverdien. Tidskonstanten T er tiden det tar å nå 63 % av den totale endringen, regnet fra prosessen begynner å reagere. Etter 2T er man på ca. 86 %, og etter 5T er endringen over 99 %. Tiden før prosessen reagerer i det hele tatt er dødtid, ikke tidskonstant.", "139": "Dødtid er ventetiden fra pådraget endres til målingen viser noen reaksjon. Et typisk eksempel er transport: varmt vann bruker tid i røret frem til temperaturføleren. I dødtiden får regulatoren ingen tilbakemelding om at endringen virker, og en hardt innstilt regulator overkompenserer og begynner å svinge. Jo lengre dødtid i forhold til tidskonstanten, desto mer forsiktig må regulatoren stilles.", "140": "Prosessforsterkningen i %/% er endring i måling delt på endring i pådrag, begge i prosent av sitt område. Temperaturendringen er 20 °C av et område på 200 °C, altså 20 / 200 · 100 % = 10 %. Pådragsendringen er 10 %. K = 10 % / 10 % = 1. Svarer man 2, har man glemt å regne om 20 °C til prosent av måleområdet.", "141": "En integrerende prosess har ingen naturlig likevekt. Når en pumpe tar ut fast mengde, stiger eller synker nivået i tanken så lenge innløpet er forskjellig fra utløpet, og det stopper ikke av seg selv. Romtemperatur eller trykk i et rør med åpent utløp er selvregulerende: de finner et nytt likevektspunkt etter en endring. Integrerende prosesser må derfor alltid reguleres.", "142": "Virkningsretningen sier om pådraget skal øke eller minke når målingen øker. Her skal ventilen åpne mer, altså økt pådrag, når temperaturen (PV) stiger. Det er direkte virkning. En varmeventil er motsatt: den skal strupe når temperaturen stiger, og trenger revers virkning. Velges feil retning, forsterker regulatoren avviket og pådraget går til ytterkant.", "143": "I kaskaderegulering gir den ytre regulatoren (master) settpunkt til den indre regulatoren (slave), og bare slaven styrer pådragsorganet. Eksempel: en temperaturregulator gir settpunkt til en mengderegulator for damp. Endringer i damptrykket rettes da opp av den raske mengdesløyfa før de rekker å påvirke temperaturen. Den indre sløyfa må være vesentlig raskere enn den ytre.", "144": "Foroverkobling måler en forstyrrelse og justerer pådraget med en gang, før forstyrrelsen rekker å endre den regulerte størrelsen. Eksempel: i et ventilasjonsaggregat måles utetemperaturen, og varmebatteriet får økt pådrag før tilluftstemperaturen faller. En ren tilbakekoblet regulator må vente på avviket. Foroverkobling er sjelden perfekt, så den kombineres normalt med tilbakekobling som tar resten.", "145": "Ved forholdsregulering måles en hovedstrøm, og settpunktet til en annen mengderegulator settes som hovedstrømmen ganget med et fast forhold. Eksempel: klor doseres i fast forhold til vannmengden i et renseanlegg, eller luft i forhold til brensel i en brenner. Øker hovedstrømmen, følger den andre automatisk etter, slik at blandingsforholdet holdes konstant.", "146": "Ved split‑range deles regulatorens utgangsområde mellom to pådragsorgan. Eksempel: utgang 0–50 % styrer kjøleventilen og 50–100 % styrer varmeventilen, slik at én temperaturregulator kan både kjøle og varme. Et annet eksempel er en liten og en stor ventil i parallell, der den lille tar lav last. Fordelingen gjøres i regulatoren, i PLS‑en eller med posisjonerne.", "147": "Når pådraget står i metning, for eksempel ventil helt åpen, hjelper ikke mer pådrag, men avviket er fortsatt der. I‑leddet fortsetter da å summere og bygger opp en stor verdi langt over 100 %. Når avviket snur, må all denne summen bygges ned før pådraget begynner å gå ned, og resultatet blir stort oversving. Anti‑windup stopper eller begrenser integrasjonen ved metning.", "148": "Når regulatoren står i manuell, settes pådraget av operatøren. Ved bytte til automatikk skal regulatoren starte fra samme pådrag, ikke hoppe til en beregnet verdi. Det gjøres ved at I‑leddet initialiseres slik at utgangen stemmer med manuell verdi, eller ved at settpunktet følger målingen i manuell. Uten dette kan ventiler slå kraftig og gi trykkstøt eller prosessforstyrrelser.", "149": "I svingemetoden settes regulatoren til bare P‑virkning. Kp økes gradvis til sløyfa svinger med jevn amplitude, verken voksende eller avtagende. Forsterkningen der kalles kritisk forsterkning Kpk, og tiden for én hel svingning er kritisk periodetid Tk. Fra disse to tallene regnes parametrene ut med tabellverdier. Metoden krever at prosessen tåler å svinge under testen.", "150": "For PI etter svingemetoden er tabellverdiene Kp = 0,45 · Kpk og Ti = Tk / 1,2 ≈ 0,83 · Tk. Kp settes lavere enn for PID, fordi I‑leddet gir faseforsinkelse og gjør sløyfa mindre stabil. Eksempel: Kpk = 4 og Tk = 60 s gir Kp = 0,45 · 4 = 1,8 og Ti = 60 / 1,2 = 50 s. Verdien 0,6 · Kpk gjelder PID, 0,5 · Kpk ren P.", "151": "For PID etter svingemetoden er tabellverdiene Kp = 0,6 · Kpk, Ti = Tk / 2 og Td = Tk / 8. D‑leddet gir faseforbedring, så både Kp kan økes og Ti gjøres kortere enn for PI. Eksempel: Tk = 40 s gir Ti = 40 / 2 = 20 s og Td = 40 / 8 = 5 s. Tk / 1,2 er Ti for PI, og Tk / 8 er Td.", "152": "Sprangresponsmetoden går ut på å gi et sprang i pådraget i manuell og se på målingen. Fra kurven leses forsterkningen K (endring i måling delt på endring i pådrag), dødtiden τ (tid før målingen reagerer) og tidskonstanten T (tid fra reaksjon til 63 % av endringen). Disse beskriver en førsteordens modell med dødtid. Kpk og Tk hører til svingemetoden.", "153": "Sprangresponsmetoden gir for PI: Kp = 0,9 · T / (K · τ) og Ti = τ / 0,3 ≈ 3,33 · τ. Integraltiden bestemmes altså av dødtiden alene. Eksempel: τ = 6 s gir Ti = 6 / 0,3 = 20 s. For PID er tabellverdiene Ti = 2 · τ og Td = 0,5 · τ, så de nærliggende alternativene hører til PID‑innstillingen.", "154": "Ziegler og Nichols laget tabellene for å gi kvart amplitudes dempning: etter en forstyrrelse er hver svingetopp omtrent en fjerdedel av den forrige. Det gir rask innsvinging, men med tydelig oversving og liten robusthet. I praksis er det ofte for aggressivt, så mange reduserer Kp eller øker Ti litt. Ingen oversving eller kritisk dempning krever mer forsiktig innstilling.", "155": "SIMC‑metoden bruker modellen K, T og τ fra en sprangrespons, og ett valgfritt tall: Tc, ønsket tidskonstant for lukket sløyfe. Tc sier hvor raskt man vil at regulert sløyfe skal følge et settpunktsprang. Liten Tc gir rask, men aggressiv og lite robust regulering. Stor Tc gir rolig og robust regulering. Kp og Ti regnes deretter ut fra enkle formler.", "156": "Skogestad anbefaler Tc = τ som utgangspunkt. Det gir rask regulering som fortsatt har god margin mot ustabilitet, typisk med en forsterkningsmargin rundt 3. Dødtiden setter en naturlig grense for hvor raskt en sløyfe kan reguleres, så det gir mening å knytte Tc til den. Ønsker man roligere regulering, for eksempel ved støy eller usikker modell, velges større Tc.", "157": "SIMC for førsteordens prosess med dødtid gir Kp = T / (K · (Tc + τ)) og Ti = min(T, 4 · (Tc + τ)). Eksempel: K = 2, T = 40 s, τ = 5 s og Tc = τ = 5 s gir Kp = 40 / (2 · 10) = 2 og Ti = min(40, 40) = 40 s. Formelen 0,9 · T / (K · τ) er Ziegler–Nichols, ikke Skogestad.", "158": "En integrerende prosess, som nivå, har ingen tidskonstant T å sette Ti lik. SIMC bruker derfor Ti = 4 · (Tc + τ) og Kp = 1 / (Ki · (Tc + τ)), der Ki er hvor fort målingen stiger per enhet pådrag. Eksempel: τ = 10 s og Tc = 10 s gir Ti = 4 · 20 = 80 s. For kort Ti på integrerende prosesser gir lett langsomme svingninger.", "159": "Grunnregelen i SIMC er Ti = T, som gir god settpunktrespons. Men når T er veldig lang, oppfører prosessen seg nesten som en integrator, og en lang Ti gjør at forstyrrelser rettes opp svært tregt. Ved å ta minste verdi av T og 4 · (Tc + τ) begrenses Ti, slik at I‑leddet virker raskt nok uten å gjøre sløyfa ustabil.", "160": "Høy Kp betyr at regulatoren reagerer kraftig på et lite avvik. Sammen med dødtid og forsinkelser i prosessen fører det til at pådraget overkompenserer, målingen skyter over, regulatoren slår tilbake og sløyfa begynner å svinge. Øker man Kp nok, blir svingningene voksende og sløyfa ustabil. For lav Kp gir derimot en treg sløyfe. Også for kort Ti gir svingninger.", "161": "Forsterkningsmarginen sier hvor mange ganger sløyfeforsterkningen kan økes før sløyfa når stabilitetsgrensen og svinger med konstant amplitude. En margin på 2 betyr at forsterkningen kan dobles. Dette gir trygghet når prosessen endrer seg, for eksempel når en ventil får annen forsterkning ved annen åpning. Sammen med fasemarginen er det et mål på hvor robust reguleringen er.", "162": "I Laplace‑form er K forsterkningen, 1 / (Ts + 1) beskriver førsteordens forsinkelse med tidskonstant T, og e^(−τs) er en ren tidsforsinkelse på τ sekunder. Samlet blir modellen K · e^(−τs) / (Ts + 1). Det er samme modell som brukes i Ziegler–Nichols sprangrespons og Skogestad. K / s er derimot en integrerende prosess.", "163": "En av/på‑regulering uten hysterese ville slått av og på i rask takt rundt settpunktet, fordi målingen alltid har litt støy og variasjon. Med hysterese kobler utgangen inn ved én verdi og ut ved en annen, for eksempel en termostat som slår på ved 20 °C og av ved 22 °C. Det gir færre koblinger og mindre slitasje på kontaktorer, kompressorer og pumper.", "164": "PLS‑en starter syklusen med å lese alle innganger inn i prosessbildet (PII). Deretter kjøres programmet mot dette bildet, slik at inngangene ikke endrer seg midt i syklusen. Til slutt skrives resultatene fra prosessbildet for utganger (PIQ) ut til de fysiske utgangene. Derfor ser man ikke endringer på utgangene før syklusen er ferdig, og en kort puls kortere enn syklustiden kan bli borte.", "165": "IEC 61131‑3 er standarden for PLS‑programmering og beskriver Ladder (LD), funksjonsblokkdiagram (FBD), Structured Text (ST), Instruction List (IL) og Sequential Function Chart (SFC). IL er tatt ut av nyere utgaver av standarden, men finnes fortsatt i eldre anlegg. Python er et generelt programmeringsspråk og er ikke en del av standarden, selv om enkelte systemer kan bruke det ved siden av.", "166": "Structured Text er et tekstbasert høynivåspråk som ligner Pascal. Det har IF, CASE, FOR‑ og WHILE‑løkker og skriver formler direkte, for eksempel skalering eller beregning av gjennomsnitt i en tabell. Det samme i Ladder blir mange nettverk med matteblokker som er vanskelige å lese. Ladder egner seg best til enkel binær logikk, og SFC til sekvenser.", "167": "En stoppknapp med brytende kontakt gir sant signal i normal drift, og stopp tolkes som at signalet blir borte. Ryker en ledning eller løsner en klemme, forsvinner signalet, og maskinen stopper. Med sluttende kontakt ville et ledningsbrudd gjort stoppknappen virkningsløs uten at noen merket det. Dette er prinsippet om feilsikker utforming, som også ligger til grunn i NEK EN 60204‑1.", "168": "En startknapp gir bare signal mens den holdes inne. I en selvholdskrets kobles en kontakt fra kontaktoren eller utgangen selv parallelt med startknappen. Når start trykkes, trekker utgangen, og den egne kontakten holder kretsen sluttet etter at knappen slippes. Kretsen brytes først når stopp (NC) trykkes, motorvernet løser ut eller spenningen forsvinner, og da må man trykke start på nytt.", "169": "TON er en tilkoblingsforsinkelse. Når inngangen IN blir sann, begynner timeren å telle. Er IN fortsatt sann når tiden PT er gått, blir utgangen Q sann og holdes så lenge IN er sann. Faller IN før tiden er ute, nullstilles timeren. Den brukes for eksempel til å filtrere bort korte signaler eller kreve at et nivå har vært høyt i 5 s før alarm.", "170": "TOF er en utkoblingsforsinkelse. Utgangen Q blir sann med en gang inngangen blir sann. Når inngangen går til usann, holdes Q sann i den innstilte tiden PT før den faller. Typisk bruk er ettergangstid, for eksempel en avtrekksvifte som går 3 minutter etter at lyset slukkes, eller en kjølevifte som går en stund etter at en motor har stoppet.", "171": "CTU er en opptellende teller. Hver stigende flanke på inngangen CU øker telleverdien CV med én. Utgangen Q blir sann når CV er lik eller større enn forhåndsverdien PV, og holdes sann til telleren nullstilles med R. Eksempel: PV = 10 gir Q når 10 esker har passert en fotocelle, og R nullstiller telleren for neste pall.", "172": "R_TRIG gir utgangen Q sann i nøyaktig én PLS‑syklus når inngangen går fra 0 til 1, altså på stigende flanke. Holdes knappen inne, skjer det ikke mer. F_TRIG gjør det samme på fallende flanke. Dette brukes når noe skal skje én gang per hendelse, for eksempel å øke en teller eller veksle en lampe av og på med én knapp.", "173": "PLS‑en kjører programmet ovenfra og ned og skriver til prosessbildet underveis. Hvis samme utgang skrives flere steder, er det bare den siste skrivingen før syklusen er ferdig som kommer ut på den fysiske utgangen. Logikken lenger opp blir da overstyrt uten at det synes, og feilsøking blir svært vanskelig. Samle all logikk for én utgang på ett sted.", "174": "Siemens S7‑1200/1500 representerer nominelt område på analoge kort som heltall fra 0 til 27648. For 4–20 mA betyr det at 4 mA gir 0 og 20 mA gir 27648. Verdier over 27648 brukes til å vise overstyring, og 32767 betyr typisk brudd eller overflyt. Råverdien skaleres i programmet, for eksempel med NORM_X og SCALE_X, til ingeniørenheter.", "175": "Prosentverdien er råverdi delt på fullt område: 13824 / 27648 = 0,5, altså 50 %. Ved et 4–20 mA signal tilsvarer det 4 + 0,5 · 16 = 12 mA. Har giveren måleområde 0–10 bar, viser den da 5 bar. Svaret 13,8 % kommer av å tro at området går til 100 000, mens Siemens bruker 27648 som 100 %.", "176": "En FB (funksjonsblokk) har en tilhørende instans‑DB der statiske variabler lagres mellom syklusene. Derfor kan den inneholde timere, flanker og tilstander, for eksempel en motorblokk som husker om motoren er i drift. En FC (funksjon) har bare midlertidige variabler som forsvinner etter kallet. Den egner seg til ren beregning, som skalering, der svaret bare avhenger av inngangene.", "177": "OB1 er organisasjonsblokken PLS‑en kjører igjen og igjen i hver syklus, så snart forrige syklus er ferdig. Herfra kalles resten av programmet, altså FB‑er og FC‑er. Oppstart håndteres i OB100, som kjøres én gang når PLS‑en går fra STOP til RUN. Syklisk avbrudd med fast tid ligger i egne OB‑er, for eksempel OB30 og OB35.", "178": "Syklustiden i OB1 varierer med hvor mye programmet gjør. I‑ og D‑leddet regnes ut fra tiden mellom hver kjøring, så varierende tid gir feil integrering og derivering. En syklisk avbruddsblokk kjøres med fast intervall, for eksempel hvert 100 ms, og regulatoren får da en kjent samplingstid. Samplingstiden bør være godt under prosessens tidskonstant.", "179": "Remanente data beholder verdien når PLS‑en blir spenningsløs eller går gjennom STOP og RUN. Ikke‑remanente data settes til startverdi ved oppstart. Det brukes til ting som må overleve et strømbrudd, som driftstimetellere, produksjonstellere og settpunkter operatøren har lagt inn. I TIA Portal velges dette per variabel i datablokker eller som et område av merkerne.", "180": "En SFC‑ eller GRAFCET‑sekvens består av steg og transisjoner som veksler. Et steg er en tilstand der bestemte handlinger utføres, for eksempel «fyll tank». Transisjonen etter steget er betingelsen for å gå videre, for eksempel «nivå høyt». Bare aktive steg utfører handlinger. Dette gir en oversiktlig struktur for batchprosesser og maskinsekvenser, og gjør det lett å se hvor prosessen har stoppet.", "181": "PLS‑en har en overvåkingstimer (watchdog) som passer på at hver syklus blir ferdig innen en maksimal tid. Henger programmet, for eksempel i en uendelig WHILE‑løkke i ST, oppdateres ikke utgangene, og maskinen er ute av kontroll. Da gir PLS‑en tidsfeil og går normalt i STOP, med utgangene i en definert tilstand. Feilen ses i diagnosebufferen.", "182": "Forcing betyr at en inngang eller utgang tvinges til en bestemt verdi, uavhengig av hva giveren i felt melder eller programmet bestemmer. Det brukes ved idriftsetting og feilsøking, for eksempel for å teste en ventil. Det er farlig fordi forriglinger kan bli satt ut av spill. Forcing skal avtales med driftsansvarlig, merkes og fjernes når jobben er gjort.", "183": "Trekker kontaktorene for høyre‑ og venstregang samtidig, blir to faser kortsluttet. Programforrigling i PLS‑en hjelper ikke hvis programmet har feil, en utgang henger eller en kontaktor har sveiste kontakter. Ved å legge en brytende hjelpekontakt fra hver kontaktor i spolekretsen til den andre, kan den ene ikke trekke før den andre har sluppet. Mange bruker også mekanisk forrigling.", "184": "Transistorutganger har ingen bevegelige deler, så de kobler raskt og slites ikke av mange koblinger. De egner seg til pulser, PWM og hyppig kobling av ventiler og reléer. Ulempen er at de bare kobler DC, vanligvis 24 V, og tåler lavere strøm. Reléutganger kan koble både AC og DC og gir galvanisk skille, men kontaktene slites og de er trege.", "185": "Med desentralisert I/O plasseres I/O‑modulene i små skap ute ved maskinen eller prosessen, og kobles til PLS‑en via en feltbuss eller et industrielt nettverk som PROFINET. I stedet for mange enkeltkabler tilbake til hovedtavla trengs bare buss og forsyning. Det sparer kabling og arbeid, og diagnose fra modulene gjør det enklere å finne feil.", "186": "En backup gjør at man kan gå tilbake hvis endringen gir problemer. Endringen må avtales med driftsansvarlig, fordi den kan påvirke produksjon og sikkerhet, og operatørene må vite hva som skjer. I tillegg skal endringen dokumenteres og testes før anlegget overleveres. Det er sjelden nødvendig å stoppe hele anlegget, og gammel kode skal ikke slettes uten videre.", "187": "Med symbolsk adressering får hvert signal et beskrivende navn, for eksempel «Pumpe1_Drift» i stedet for I0.3. Programmet blir da mye lettere å lese og feilsøke for andre. Hvis et signal flyttes til en annen klemme, endres bare adressen i taggtabellen, og programmet trenger ikke endres. Navnene bør stemme med I/O‑listen og tegningene.", "188": "SCADA står for Supervisory Control And Data Acquisition, altså overordnet styring og datainnsamling. Systemet henter data fra PLS‑er og RTU‑er, viser prosessbilder, håndterer alarmer og lagrer historikk. Det brukes ofte i geografisk spredte anlegg, som vann og avløp, kraftnett og fjernvarme. Selve regulering og sikkerhet ligger normalt i PLS‑ene ute.", "189": "DCS står for Distributed Control System. Reguleringen er fordelt på flere kontrollere rundt i anlegget, men alt konfigureres og overvåkes som ett integrert system med felles database, operatørbilder, alarmer og historikk. DCS brukes mest i prosessindustri med mange reguleringssløyfer, som olje og gass, kjemi og papir. Et PLS‑ og SCADA‑system er gjerne satt sammen av flere separate produkter.", "190": "Å kvittere en alarm betyr at operatøren bekrefter å ha sett den. Det retter ikke feilen, og alarmen er fortsatt aktiv så lenge årsaken er der, for eksempel høyt nivå i en tank. En alarm kan derfor ha fire tilstander: aktiv og ukvittert, aktiv og kvittert, borte men ukvittert, og borte og kvittert. Sperring av alarmer er noe annet.", "191": "Hvis alt i bildet er farget, mister fargene sin signalverdi, og en alarm drukner i resten. Etter prinsipper fra ISA‑101 tegnes normal drift i grått og nøytrale farger, mens sterke farger som rødt og gult reserveres for alarmer og unormale tilstander. Da ser operatøren avvikene med en gang. Farge bør heller ikke være eneste kjennetegn, siden noen er fargeblinde.", "192": "Brukernivåer sørger for at bare personer med riktig opplæring og ansvar kan endre settpunkter, regulatorparametre, alarmgrenser eller forcing. En operatør kan gjerne starte og stoppe og kvittere alarmer, mens innstillinger krever høyere nivå. Det hindrer utilsiktede og ukvalifiserte endringer, og med pålogging kan man også logge hvem som endret hva.", "193": "Trender viser hvordan målinger, settpunkter og pådrag har utviklet seg over tid, og historikken lagrer dataene. Ved feilsøking kan man se hva som skjedde før en driftsstans eller alarm. Ved innstilling av regulatorer ser man oversving, svingninger og hvor raskt sløyfa følger settpunktet. Trender brukes også til å oppdage langsomme endringer, som et filter som gror igjen.", "194": "Alarmflom oppstår når en feil utløser mange følgealarmer samtidig, for eksempel når en pumpe stopper og lavt trykk, lav mengde og høyt nivå alarmerer etter hverandre. Operatøren klarer da ikke å finne den egentlige årsaken. God alarmhåndtering prioriterer alarmer, undertrykker følgealarmer og fjerner alarmer som ikke krever handling, slik at hver alarm betyr noe.", "195": "Profibus DP sender data over RS‑485, som er en differensiell, tolederbuss der signalet ligger som spenningsforskjell mellom ledning A og B. Det gjør bussen robust mot støy og gir lange avstander ved lave hastigheter. Bussen trekkes som en linje fra node til node, og begge ender skal termineres, ofte med bryter i Profibus‑pluggen. Profinet bruker Ethernet, mens RS‑232 er punkt‑til‑punkt og 4–20 mA er et analogt signal.", "196": "RS‑485 er spesifisert for inntil 32 enhetslaster per segment, så et Profibus‑segment kan ha 32 stasjoner, og en repeater teller som en av dem. Trenger du flere noder eller lengre kabel, deler du nettet i flere segmenter med repeatere. Totalt gir adresseområdet plass til 126 adresser i hele nettet. Tallet 126 gjelder altså hele nettet, ikke ett segment.", "197": "Når et signal når enden av en åpen kabel, sendes en del av det tilbake som en refleksjon som forstyrrer de neste bitene. En termineringsmotstand som tilsvarer kabelens bølgeimpedans, typisk rundt 120 Ω for RS‑485, tar opp signalet i stedet. Derfor skal bussen termineres i begge ytterendene, og bare der. Manglende eller ekstra terminering er en klassisk årsak til ustabil kommunikasjon.", "198": "Modbus TCP lytter som standard på TCP‑port 502. Portnummeret forteller hvilken tjeneste i enheten som skal motta pakken, og må stemme i både klient og server. De andre tallene er også kjente: 102 brukes av Siemens S7‑kommunikasjon, 44818 av EtherNet/IP og 80 av vanlig HTTP. Står det en brannmur mellom SCADA og PLS, må port 502 være åpnet for Modbus TCP.", "199": "Modbus har fire datatyper: coils og discrete inputs er enkeltbiter, mens holding registers og input registers er 16‑bits ord. Holding registers kan både leses og skrives, og brukes for eksempel til settpunkter og parametere. Input registers er skrivebeskyttede måleverdier, som en temperatur fra en transmitter. Coils kan skrives, men er bare én bit, ikke en 16‑bits verdi.", "200": "I Modbus RTU er adressefeltet én byte, men bare 1 til 247 brukes som slaveadresser. Adresse 0 er kringkasting til alle slaver, og 248 til 255 er reservert. Merk at det fysiske RS‑485‑laget i seg selv bare tåler 32 enhetslaster per segment, så mange slaver krever repeatere. Tallet 126 hører til Profibus, ikke Modbus.", "201": "Profinet er en industriell protokoll som bygger på standard Ethernet, med vanlige RJ45‑ eller M12‑kontakter og switcher. For tidskritisk I/O bruker den sanntidskanaler (RT og IRT) som går utenom den vanlige TCP/IP‑stakken for å få korte og forutsigbare syklustider. Samtidig kan vanlig IT‑trafikk som webserver og diagnose gå på samme nett. RS‑485 hører til Profibus, og CAN og HART er andre teknologier.", "202": "I Profinet får hver enhet et enhetsnavn (device name) i prosjektet. Ved oppstart leter kontrolleren etter enheten med riktig navn og tildeler den IP‑adressen fra prosjektet. Derfor holder ikke MAC‑adressen alene: bytter du en defekt I/O‑node, må den nye enheten få samme navn, enten manuelt eller automatisk via topologi. Feil eller manglende navn gir typisk at enheten ikke kommer opp på nettet.", "203": "IO‑Link er en digital punkt‑til‑punkt‑forbindelse mellom en IO‑Link‑master og én sensor eller aktuator. Den bruker vanlig uskjermet 3‑leder sensorkabel med M12‑kontakt, så det trengs ingen spesialkabel. I tillegg til prosessverdien kan man lese diagnose og sende parametere, slik at en ny giver kan få innstillingene sine automatisk ved utskifting. Det er ikke en feltbuss med mange noder, men masteren kobles videre til for eksempel Profinet.", "204": "OPC UA er en åpen standard for utveksling av data mellom systemer fra ulike leverandører og på ulike plattformer. Den har innebygd sikkerhet med autentisering, signering og kryptering, og beskriver dataene med en informasjonsmodell, ikke bare rå adresser. Typisk bruk er kobling mellom PLS, SCADA, MES og skytjenester. Den brukes ikke til selve motorstyringen eller som sikkerhetsfunksjon for maskiner.", "205": "OSI‑modellen deler nettverkskommunikasjon i 7 lag: fysisk, datalink, nettverk, transport, sesjon, presentasjon og applikasjon. Hvert lag har sin oppgave, fra kabel og signaler nederst til programmene øverst. Modellen er nyttig i feilsøking, fordi man kan jobbe seg oppover: er kabelen ok, ser switchen MAC‑adressen, svarer IP‑adressen på ping. TCP/IP‑modellen har færre lag, men OSI har sju.", "206": "En vanlig switch jobber på lag 2, datalinklaget, og videresender rammer basert på MAC‑adresser. Den lærer hvilken MAC som sitter på hvilken port og sender trafikken bare dit. En ruter jobber på lag 3 og sender trafikk mellom ulike IP‑nett. Det finnes også lag 3‑switcher som kan rute, men grunnfunksjonen til en switch er lag 2.", "207": "Masken 255.255.255.0 tilsvarer /24, altså 8 biter igjen til verter. Det gir 2⁸ = 256 adresser. Den første (for eksempel 192.168.0.0) er nettverksadressen, og den siste (192.168.0.255) er kringkastingsadressen. 256 − 2 = 254 adresser kan brukes av PLS, HMI, PC og annet utstyr.", "208": "Med /24 er de tre første oktettene nettdelen. PLS‑en ligger i 192.168.0.x og PC‑en i 192.168.1.x, så de er i hvert sitt subnett. Da sender PC‑en trafikken til gatewayen i stedet for direkte, og uten en ruter mellom nettene kommer pakkene ikke fram. Løsningen er å gi PC‑en en adresse i 192.168.0.x eller sette opp ruting.", "209": "DHCP (Dynamic Host Configuration Protocol) deler ut IP‑adresse, nettmaske, gateway og DNS automatisk til enheter som ber om det. Det er praktisk på kontornett, men i automasjon får PLS, I/O og HMI ofte fast IP, slik at adressen ikke endrer seg og kommunikasjonen ikke faller ut. Det er DNS som oversetter navn til IP‑adresser, ikke DHCP.", "210": "For Ethernet over tvunnet par (som Cat5e og Cat6) er maks kanallengde 100 m mellom to aktive enheter, for eksempel switch og PLS. Grensen skyldes signaldemping og tidskrav. Trenger du lengre strekk, setter du inn en switch underveis eller går over til fiber. Det gjelder også Profinet og EtherNet/IP på kobber.", "211": "Fiber overfører lys i stedet for elektriske signaler, så den påvirkes ikke av elektromagnetisk støy fra for eksempel frekvensomformere og kraftkabler. Den har lav demping og tåler mye lengre avstander enn kobber. Fiber gir også galvanisk skille, slik at man unngår jordsløyfer og potensialforskjeller mellom bygg. Den er ikke enklere å skjøte og fører ikke strøm.", "212": "IEC 62443 er standardserien for cybersikkerhet i industrielle automasjons‑ og kontrollsystemer. Den beskriver blant annet inndeling i soner og conduits, sikkerhetsnivåer (SL) og krav til både eiere, integratorer og leverandører. IEC 61131 handler om PLS og programmeringsspråk, ISO 9001 om kvalitetsledelse og NEK 400 om elektriske lavspenningsinstallasjoner.", "213": "Ping sender en ICMP‑forespørsel til en IP‑adresse og venter på svar. Får du svar, vet du at det er forbindelse fram til enheten og at den har riktig adresse, og du ser også responstiden. Uteblir svaret, kan feilen være kabel, IP‑oppsett, subnett eller brannmur. Merk at enkelte enheter er satt opp til ikke å svare på ping selv om de virker.", "214": "Synkront turtall er hvor fort dreiefeltet roterer: n = 120 · f / p, der p er antall poler. For en 4‑polet motor på 50 Hz: n = 120 · 50 / 4 = 6000 / 4 = 1500 o/min. En 2‑polet motor gir 3000 o/min og en 6‑polet 1000 o/min. Den faktiske akselhastigheten blir litt lavere på grunn av sakking, typisk rundt 1450 o/min.", "215": "En asynkronmotor må gå litt saktere enn dreiefeltet for at det skal induseres strøm og moment i rotoren. Denne forskjellen kalles sakking: s = (ns − n) / ns. Eksempel: ns = 1500 o/min og n = 1450 o/min gir s = 50 / 1500 ≈ 0,033, altså ca. 3,3 %. Sakkingen øker med lasten.", "216": "Rotasjonsretningen bestemmes av fasefølgen, som gir dreiefeltets retning. Bytter du to av fasene, for eksempel L1 og L2, snur dreiefeltet og motoren går motsatt vei. Bytter du alle tre i ring, blir fasefølgen den samme og retningen uendret. I en reverseringsstarter gjøres dette med to kontaktorer som må være forriglet mot hverandre.", "217": "Merkeskiltet sier at hver vikling er laget for 400 V. I trekant ligger hver vikling direkte mellom to faser og får hovedspenningen, altså 400 V på et 400 V‑nett. I stjerne ville hver vikling bare få 400 / √3 ≈ 230 V, og motoren ville gi for lite moment. Slike motorer er derfor egnet for stjerne‑trekant‑start på 400 V.", "218": "Her tåler hver vikling 230 V. I stjerne får hver vikling fasespenningen: 400 / √3 ≈ 230 V, som er riktig. Kobles den i trekant på 400 V, får viklingene 400 V, altså √3 ganger for høy spenning, og motoren blir ødelagt. Denne motoren kan derfor ikke brukes med stjerne‑trekant‑start på 400 V‑nett.", "219": "I stjerne får hver vikling 1/√3 av spenningen, og strømmen i viklingen synker også med 1/√3. I tillegg er linjestrømmen i trekant √3 ganger viklingsstrømmen, mens den i stjerne er lik. Til sammen blir linjestrømmen 1/√3 · 1/√3 = 1/3 av direktestart. Momentet er proporsjonalt med U², så også startmomentet blir ca. 1/3.", "220": "En mykstarter bruker antiparallelle tyristorer som slipper gjennom en stadig større del av spenningsperioden under start. Spenningen rampes opp, og dermed begrenses startstrøm og mekaniske støt, for eksempel i pumper og transportbånd. Når motoren er oppe i fart, kobles ofte en bypasskontaktor inn. Frekvensen er hele tiden 50 Hz, så den kan ikke regulere turtallet i drift slik en frekvensomformer kan.", "221": "Turtallet til en asynkronmotor følger frekvensen, så omformeren endrer frekvensen for å endre hastigheten. Samtidig må spenningen justeres i takt, slik at forholdet U/f holdes tilnærmet konstant og magnetiseringen blir riktig. Eksempel: 400 V ved 50 Hz gir 8 V/Hz, så ved 25 Hz brukes ca. 200 V. Antall poler er en fast egenskap ved motoren.", "222": "Rampetiden angir hvor lang tid omformeren bruker på å øke frekvensen fra 0 til maks (akselerasjon), eller ned igjen (retardasjon). En rampe på 10 s til 50 Hz betyr at det tar ca. 5 s å nå 25 Hz. For kort akselerasjonsrampe kan gi overstrømsfeil, og for kort retardasjonsrampe gir overspenning i DC‑mellomkretsen fordi motoren mater energi tilbake.", "223": "Et termisk motorvern skal beskytte motoren mot overlast over tid, og stilles derfor inn på merkestrømmen som står på merkeskiltet for aktuell spenning og kobling. Vernet har en tidsforsinkelse, slik at startstrømmen ikke løser det ut. Kortslutningsvernet er sikringen eller effektbryteren sin oppgave. Stilles vernet etter sikringen eller kabelen, kan motoren brenne før vernet reagerer.", "224": "Motorvernet løser ut når strømmen er for høy for lenge. Typiske årsaker er at lasten er for tung, at en fase mangler slik at de andre fasene får høyere strøm, at vernet er stilt for lavt, eller mekaniske feil som dårlige lagre eller noe som går tregt. Feilsøk ved å måle strømmen i alle tre faser, sammenligne med merkeskiltet og sjekke mekanikken. Å bare stille vernet høyere fjerner ikke årsaken.", "225": "Med bare to faser får motoren et pulserende felt i stedet for et roterende. Står den stille, får den ikke startmoment og brummer bare mens strømmen er høy. Går den allerede, kan den fortsette, men de gjenværende fasene trekker mye mer strøm og viklingene overopphetes. Et motorvern med fasebruddsfølsomhet skal derfor løse ut.", "226": "En PTC‑termistor (positiv temperaturkoeffisient) har lav motstand ved normal temperatur, men motstanden stiger brått når den når sin nominelle utløsertemperatur. Termistorene legges inn i viklingene og kobles til et termistorrelé eller en frekvensomformer som bryter ved høy motstand. Fordelen er at den måler selve viklingstemperaturen, så den fanger også opp dårlig kjøling, som et strømbasert vern ikke ser.", "227": "Isolasjonsklassen angir høyeste tillatte temperatur for isolasjonsmaterialet i viklingene. Klasse B tåler 130 °C, klasse F 155 °C og klasse H 180 °C. Mange motorer har klasse F‑isolasjon men utnyttes bare til temperaturøkning etter klasse B, noe som gir ekstra margin og lengre levetid. Høy temperatur over tid er en hovedårsak til at viklinger svikter.", "228": "De fleste standardmotorer kjøles av en vifte som sitter på motorakselen. Ved lavt turtall går viften sakte og flytter lite luft, mens motoren likevel kan trekke nær full strøm hvis lasten krever moment. Det gir varmgang, særlig ved konstant moment som på transportbånd. Løsningen kan være separat drevet vifte, større motor eller begrensning av drift på lav frekvens.", "229": "Når en motor bremses raskt eller holder igjen en last som går nedover, går den som generator og mater energi tilbake til omformeren. Energien havner i DC‑mellomkretsen og øker spenningen der. En bremsechopper kobler da inn bremsemotstanden, som gjør energien om til varme. Uten den vil omformeren løse ut på overspenning, eller du må ha lengre retardasjonsrampe.", "230": "Kabelen mellom frekvensomformer og motor fører høyfrekvente strømmer fra rask switching. Skjermen skal gi disse strømmene en kort vei med lav impedans tilbake til omformeren. Derfor jordes skjermen med 360° kontakt, for eksempel med EMC‑forskruning eller skjermklemme, i begge ender. En skjerm tvunnet til en tynn hale (pigtail) eller jordet i bare én ende virker dårlig på høye frekvenser.", "231": "En frekvensomformer har en likeretter på inngangen som trekker strøm i korte pulser, ikke som en ren sinus. Det gir harmoniske strømmer, særlig 5. og 7. harmoniske, som gir ekstra varme i trafoer og kabler og kan forstyrre annet utstyr. En nettreaktor eller DC‑spole glatter ut strømmen, og ved større krav brukes harmoniske filtre eller aktive frontender. Større sikring endrer ikke strømformen.", "232": "STO, Safe Torque Off, er en sikkerhetsfunksjon som sikkert fjerner energien til motoren slik at den ikke kan lage dreiemoment. Det gjøres internt i omformeren ved å sperre styringen av utgangstransistorene, uten å bryte hovedkretsen. Motoren friløper til stopp, som tilsvarer stoppkategori 0. STO skiller ikke motoren galvanisk fra nettet, så det erstatter ikke frakobling før elektrisk arbeid.", "233": "Sammenhengen mellom effekt, moment og turtall er P = M · ω, som omregnet blir M = 9550 · P / n med P i kW og n i o/min. Innsatt: M = 9550 · 15 / 1500 = 143 250 / 1500 ≈ 95,5 Nm. Tallet 9550 kommer fra 60 / (2π) · 1000. Ved halvt turtall og samme effekt ville momentet blitt dobbelt så stort.", "234": "Brukskategorien angir hva slags last kontaktoren er dimensjonert for å slå inn og bryte. AC‑3 gjelder kortslutningsmotorer: innkobling med høy startstrøm og utkobling mens motoren går. AC‑1 er tilnærmet resistiv last som varmeelementer, og AC‑15 er styring av elektromagnetiske laster som spoler. En kontaktor har lavere strømverdi i AC‑3 enn i AC‑1, så velg etter riktig kategori.", "235": "En steppmotor roterer i faste vinkelsteg, for eksempel 1,8° per steg, altså 200 steg per omdreining. Driveren sender pulser, og posisjonen beregnes ved å telle pulsene, ofte uten giver. Det er enkelt og billig, men blir lasten for stor eller akselerasjonen for høy, kan motoren miste steg uten at styringen merker det. Da blir posisjonen feil til neste referansekjøring.", "236": "En servomotor styres i lukket sløyfe: en giver, som resolver eller enkoder, melder hele tiden faktisk posisjon og hastighet tilbake til servodriveren. Driveren sammenligner med ønsket verdi og korrigerer straks. Det gir nøyaktig posisjonering og høy dynamikk, for eksempel i roboter, pakkemaskiner og akser i CNC. Forskjellen fra en steppmotor er nettopp tilbakemeldingen.", "237": "NEK EN 60204‑1 definerer tre stoppkategorier. Kategori 0 er ukontrollert stopp ved at energien til drivene fjernes umiddelbart, for eksempel ved at kontaktoren faller eller STO aktiveres, og motoren friløper. Kategori 1 er kontrollert nedbremsing før energien fjernes. Nødstopp skal være kategori 0 eller 1, valgt ut fra risikovurderingen.", "238": "I stoppkategori 2 bremses maskinen kontrollert ned, men drivene har fortsatt energi og holder for eksempel posisjonen. Det er praktisk for normal stopp der maskinen skal starte raskt igjen eller ikke miste posisjon. Fordi energien er tilkoblet, kan en feil i styringen gi uventet bevegelse. Derfor kan kategori 2 ikke brukes som nødstopp.", "239": "Nødstoppen skal være rød og ha en bakgrunn som er gul, slik at den skiller seg tydelig fra andre betjeningselementer. Soppformen gjør at den er lett å treffe raskt med hånden. Den skal låse seg i aktivert stilling og bare kunne tilbakestilles med en bevisst handling, for eksempel vridning eller nøkkel. Andre stoppknapper skal ikke ha denne fargekombinasjonen.", "240": "Å tilbakestille nødstoppen skal bare gjøre det mulig å starte igjen, ikke starte maskinen. Det skal kreves en separat, bevisst startkommando, slik at ingen blir overrasket av en maskin som plutselig går. I praksis tilbakestiller man først nødstoppbryteren, deretter sikkerhetsreleet med en resetknapp, og trykker så start. Automatisk gjenstart kunne skadet noen som står i fareområdet.", "241": "EN ISO 13849‑1 bruker Performance Level, fra PLa (lavest) til PLe (høyest), for å angi hvor pålitelig en sikkerhetsfunksjon i styresystemet er. PL bestemmes ut fra kategori, MTTFd, diagnosedekning (DC) og felles feil (CCF). SIL er et tilsvarende begrep i IEC 62061 og IEC 61508. IEC 61131‑3 er PLS‑programmering og EN 61439 er tavlestandarden.", "242": "Risikografen i EN ISO 13849‑1 bestemmer påkrevd ytelsesnivå PLr ut fra tre spørsmål. S
